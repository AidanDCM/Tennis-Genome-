[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tennis-genome"
version = "0.1.0"
description = "Research-first calibrated tennis probability and betting-decision engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary / research use until explicitly licensed"}
authors = [{name = "Tennis Genome Project"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]
research = [
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_genome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_web_shadow_wta_intake.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
