name: WTA Forward 004 Auto Shadow Chain

on:
  workflow_run:
    workflows:
      - Prospective Trusted Provider Capture Anchor
    types:
      - completed
  workflow_dispatch:
    inputs:
      provider_run_id:
        description: Successful trusted Sportradar provider capture run ID
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: wta-forward-004-auto-${{ github.event.workflow_run.id || inputs.provider_run_id }}
  cancel-in-progress: false

jobs:
  predict-chain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONPATH: src
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: trial
      API_TENNIS_HISTORY_ARTIFACT_ID: "10531692054"
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Resolve and validate successful trusted provider run
        id: provider
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.provider_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            run_id="${WORKFLOW_RUN_ID}"
          else
            run_id="${MANUAL_RUN_ID}"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "provider run id must be a positive integer" >&2; exit 1 ;;
          esac
          test "$run_id" -gt 0
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            > provider-run.json
          python - "$run_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          run_id = int(sys.argv[1])
          run = json.loads(Path("provider-run.json").read_text(encoding="utf-8"))
          if int(run.get("id", 0)) != run_id:
              raise SystemExit("provider run id mismatch")
          if run.get("path") != ".github/workflows/prospective_provider_capture_anchor.yml":
              raise SystemExit("source run is not the trusted provider capture workflow")
          if run.get("conclusion") != "success":
              raise SystemExit("trusted provider capture run is not successful")
          if run.get("head_branch") != "main":
              raise SystemExit("trusted provider capture did not run on main")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("trusted provider capture was not explicitly dispatched")
          PY
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require prediction credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPORTRADAR_API_KEY:-}"

      - name: Download immutable trusted provider capture
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_RUN_ID: ${{ steps.provider.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted-provider-artifact
          gh run download "${PROVIDER_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "trusted-provider-capture-${PROVIDER_RUN_ID}" \
            --dir trusted-provider-artifact
          test -f trusted-provider-artifact/provider_batch_anchor_receipt.json
          test -f trusted-provider-artifact/provider_batch_anchor_comment_id.txt
          test -d trusted-provider-artifact/trusted-provider-capture/provider-batch-store
          test -d trusted-provider-artifact/trusted-provider-capture/pages
          sha256sum \
            trusted-provider-artifact/provider_batch_anchor_receipt.json \
            trusted-provider-artifact/provider_batch_anchor_comment.json \
            > trusted-provider-input-sha256.txt

      - name: Install pinned prediction runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Download frozen 2000-2025 WTA source and player registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
              "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv" \
              --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv" \
            --output data/wta_players.csv
          test "$(find data/wta-live-raw -type f -name 'wta_matches_*.csv' | wc -l)" -eq 26

      - name: Rebuild canonical frozen WTA history
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2025); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset \
            "${args[@]}" \
            --tour WTA \
            --output-dir data/wta-live-base \
            --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-2000-2025" \
            --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
            --source-version "${PINNED_ARCHIVE_COMMIT}" \
            --license-name "CC BY-NC-SA 4.0" \
            --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/" \
            --allowed-use-status research_allowed \
            > data/wta-live-base/build_output.json

      - name: Select target and immutably commit Forward-004 prediction
        id: prediction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wta_live_prediction_forward_004.py | tee prediction-summary.json
          test -f forward-004-target-resolution.json
          record=$(find prediction-work/prospective-pilot-store/records \
            -type f -name '*.json' | sort | tail -1)
          prediction_sha=$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["record_sha256"])' \
            "$record")
          chain_head=$(python - <<'PY'
          from pathlib import Path
          from tennis_genome.prospective.pilot import ProspectivePilotStore

          print(
              ProspectivePilotStore(
                  Path("prediction-work/prospective-pilot-store")
              ).verify()["chain_head_sha256"]
          )
          PY
          )
          test "$prediction_sha" = "$chain_head"
          identity_sha=$(sha256sum \
            prediction-work/sportradar-identity-binding.json | awk '{print $1}')
          echo "prediction_sha=$prediction_sha" >> "$GITHUB_OUTPUT"
          echo "chain_head=$chain_head" >> "$GITHUB_OUTPUT"
          echo "identity_sha=$identity_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$prediction_sha" > prediction-work/prediction-record-sha256.txt
          printf '%s\n' "$chain_head" > prediction-work/chain-head-sha256.txt
          printf '%s\n' "$identity_sha" > prediction-work/identity-binding-sha256.txt

      - name: Dispatch trusted Champion prediction anchor
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICTION_SHA: ${{ steps.prediction.outputs.prediction_sha }}
          CHAIN_HEAD: ${{ steps.prediction.outputs.chain_head }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_record_sha256": os.environ["PREDICTION_SHA"],
                  "chain_head_sha256": os.environ["CHAIN_HEAD"],
              },
          }, separators=(",", ":")))
          PY
          )
          code=$(curl --silent --show-error \
            --output prediction-anchor-dispatch-response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/prospective_evidence_anchor.yml/dispatches" \
            -d "$payload")
          if [ "$code" != "204" ]; then
            cat prediction-anchor-dispatch-response.txt
            exit 1
          fi

      - name: Upload complete Forward-004 prediction evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wta-forward-004-${{ github.run_id }}
          path: |
            trusted-provider-artifact/
            trusted-provider-input-sha256.txt
            provider-run.json
            forward-004-target-resolution.json
            prediction-work/
            prediction-summary.json
            prediction-anchor-dispatch-response.txt
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch one-request API-Tennis evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICTION_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          case "${PREDICTION_ARTIFACT_ID}" in
            ''|*[!0-9]*) echo "missing prediction artifact id" >&2; exit 1 ;;
          esac
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_artifact_id": os.environ["PREDICTION_ARTIFACT_ID"],
                  "history_artifact_id": os.environ["API_TENNIS_HISTORY_ARTIFACT_ID"],
              },
          }, separators=(",", ":")))
          PY
          )
          code=$(curl --silent --show-error \
            --output api-tennis-dispatch-response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/api_tennis_prospective_evidence.yml/dispatches" \
            -d "$payload")
          if [ "$code" != "204" ]; then
            cat api-tennis-dispatch-response.txt
            exit 1
          fi
