name: PATTERN-CONFIRM Live v3 State Binding Retry

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_live_v3_retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reapply live v3 patch and correct invariant test
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/pattern_confirm_live_v3_autofix.yml > /tmp/live_v3_patch.py
          python /tmp/live_v3_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_pattern_confirm_live.py')
          text = path.read_text()
          old = '''    assert not report.timing_exclusions\n    assert all(\n        item["available_qualifying_n"] == 1 for item in report.core_confirmation["hypotheses"]\n    )\n'''
          new = '''    assert not report.timing_exclusions\n    by_id = {\n        item["hypothesis_id"]: item for item in report.core_confirmation["hypotheses"]\n    }\n    matched = set(record.core_record.matched_hypotheses)\n    assert set(by_id) == {"PC-ATP-PG-LOW", "PC-ATP-PG-ABS-HIGH"}\n    for hypothesis_id, item in by_id.items():\n        assert item["available_qualifying_n"] == (1 if hypothesis_id in matched else 0)\n'''
          if old not in text:
              raise SystemExit('eligible confirmation assertion block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format \
            src/tennis_genome/experiments/pattern_confirm_live.py \
            tests/test_pattern_confirm_live.py
          ruff check --fix \
            src/tennis_genome/experiments/pattern_confirm_live.py \
            tests/test_pattern_confirm_live.py
          ruff check .
          pytest
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add \
            src/tennis_genome/experiments/pattern_confirm_live.py \
            tests/test_pattern_confirm_live.py
          git commit -m "Require sealed internally generated signals in live v3"
          git push origin HEAD:dev/pattern-confirm-provider-dryrun
