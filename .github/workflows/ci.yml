name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned runtime and test tools
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format=concise > ruff.txt 2>&1
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: pytest > pytest.txt 2>&1
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ruff.txt
            pytest.txt
      - name: Enforce checks
        if: steps.ruff.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: |
          echo "=== Ruff ==="
          cat ruff.txt
          echo "=== Pytest ==="
          cat pytest.txt
          exit 1
