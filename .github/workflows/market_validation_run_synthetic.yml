name: MARKET-VALIDATION-RUN-001 synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - dev/market-validation-run-v1
      - dev/market-validation-run-hardening
    paths:
      - "src/tennis_genome/experiments/market_validation_run.py"
      - "tests/test_market_validation_run.py"
      - "schemas/market_validation_*.schema.json"
      - "research/installment_01/market_validation_run_001_amendment_001.md"
      - ".github/workflows/market_validation_run_synthetic.yml"
  pull_request:
    paths:
      - "src/tennis_genome/experiments/market_validation_run.py"
      - "tests/test_market_validation_run.py"
      - "schemas/market_validation_*.schema.json"
      - "research/installment_01/market_validation_run_001_amendment_001.md"
      - ".github/workflows/market_validation_run_synthetic.yml"

jobs:
  synthetic-staged-market-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .[dev]

      - name: Generate outcome-locked synthetic inputs
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from tennis_genome.market.historical_manifest import (
              build_historical_source_manifest,
              write_historical_source_manifest,
          )

          root = Path("synthetic_market_validation")
          root.mkdir(parents=True)
          source_root = root / "source"
          source_root.mkdir()
          (source_root / "bundle.jsonl").write_text(
              "synthetic licensed-source stand-in\n",
              encoding="utf-8",
          )

          manifest = build_historical_source_manifest(
              root=source_root,
              data_package="ADVANCED",
              requested_start_date="2020-01-01",
              requested_end_date="2025-12-31",
          )
          source_manifest = root / "source_manifest.json"
          write_historical_source_manifest(manifest, source_manifest)

          def file_sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical_bytes(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")

          def write_self_hashed(path, payload):
              value = dict(payload)
              value["artifact_sha256"] = hashlib.sha256(
                  canonical_bytes(payload)
              ).hexdigest()
              path.write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          paths = {
              "market_hist_records": root / "market_hist_001_records.jsonl",
              "pre_match": root / "pre_match.parquet",
              "outcomes": root / "outcomes.parquet",
              "profile_gap_atp": root / "profile_atp.json",
              "profile_gap_wta": root / "profile_wta.json",
              "genome_atp": root / "genome_atp.json",
              "genome_wta": root / "genome_wta.json",
          }
          for name, path in paths.items():
              path.write_text(f"synthetic:{name}\n", encoding="utf-8")

          gates = {
              "overall_close_coverage_at_least_60pct": True,
              "every_recent_year_close_coverage_at_least_50pct": True,
              "every_recent_year_at_least_100_rows": True,
              "at_least_1000_prior_rows_before_first_evaluation_year": True,
              "at_least_five_evaluation_years": True,
              "all_2021_2025_years_in_evaluation_population": True,
              "passed": True,
          }
          qa_path = root / "market_hist_qa_001.json"
          qa_payload = {
              "experiment_id": "MARKET-HIST-QA-001",
              "effective_overall_status": "ELIGIBLE_CONFIRMATORY",
              "qa_report": {
                  "overall_status": "ELIGIBLE_CONFIRMATORY",
                  "tours": [
                      {
                          "tour": "ATP",
                          "status": "ELIGIBLE_CONFIRMATORY",
                          "gates": gates,
                      },
                      {
                          "tour": "WTA",
                          "status": "ELIGIBLE_CONFIRMATORY",
                          "gates": gates,
                      },
                  ],
              },
              "checkpoint_coverage": [],
              "companion_structural_errors": [],
              "input_sha256": {
                  "source_manifest": file_sha(source_manifest),
                  "market_hist_records": file_sha(paths["market_hist_records"]),
                  "pre_match": file_sha(paths["pre_match"]),
                  "outcomes": file_sha(paths["outcomes"]),
              },
          }
          write_self_hashed(qa_path, qa_payload)

          claims = []
          for tour, signal in (
              ("ATP", "profile_gap"),
              ("WTA", "profile_gap"),
              ("ATP", "genome"),
              ("WTA", "genome"),
          ):
              claims.append(
                  {
                      "experiment_id": "POWER-MDE-001",
                      "tour": tour,
                      "signal_name": signal,
                      "min_prior_rows": 1000,
                      "family_alpha": 0.05,
                      "family_size": 4,
                      "conservative_planning_alpha": 0.0125,
                      "year_plans": [
                          {"evaluation_year": year, "identifiable": True}
                          for year in range(2021, 2026)
                      ],
                  }
              )
          power_path = root / "power_mde_001.json"
          power_payload = {
              "experiment_id": "POWER-MDE-001",
              "outcome_blind": True,
              "method": "synthetic-outcome-blind-fixture",
              "family_alpha": 0.05,
              "family_size": 4,
              "conservative_planning_alpha": 0.0125,
              "claims": claims,
              "input_sha256": {
                  "market_hist_records": file_sha(paths["market_hist_records"]),
                  "pre_match": file_sha(paths["pre_match"]),
                  "profile_gap_atp": file_sha(paths["profile_gap_atp"]),
                  "profile_gap_wta": file_sha(paths["profile_gap_wta"]),
                  "genome_atp": file_sha(paths["genome_atp"]),
                  "genome_wta": file_sha(paths["genome_wta"]),
              },
          }
          write_self_hashed(power_path, power_payload)
          PY

      - name: Validate contract schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("schemas/market_validation_unlock_seal.schema.json"),
              Path("schemas/market_validation_result_bundle.schema.json"),
          ):
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert payload["additionalProperties"] is False
          seal = json.loads(
              Path("schemas/market_validation_unlock_seal.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          assert "qa_outcomes_sha256" in seal["required"]
          PY

      - name: Run coordinator regression suite
        run: pytest -q tests/test_market_validation_run.py

      - name: Prove Stage A CLI has no outcomes input
        run: |
          python -m tennis_genome.experiments.market_validation_run seal --help > seal-help.txt
          if grep -q -- "--outcomes" seal-help.txt; then
            echo "Stage A unexpectedly exposes an outcomes argument"
            exit 1
          fi

      - name: Create deterministic Stage A seals
        run: |
          for output in seal-a.json seal-b.json; do
            python -m tennis_genome.experiments.market_validation_run seal \
              --source-manifest synthetic_market_validation/source_manifest.json \
              --market-hist-records synthetic_market_validation/market_hist_001_records.jsonl \
              --pre-match synthetic_market_validation/pre_match.parquet \
              --market-hist-qa synthetic_market_validation/market_hist_qa_001.json \
              --power-mde synthetic_market_validation/power_mde_001.json \
              --profile-gap-atp synthetic_market_validation/profile_atp.json \
              --profile-gap-wta synthetic_market_validation/profile_wta.json \
              --genome-atp synthetic_market_validation/genome_atp.json \
              --genome-wta synthetic_market_validation/genome_wta.json \
              --output synthetic_market_validation/${output} > /dev/null
          done
          cmp synthetic_market_validation/seal-a.json synthetic_market_validation/seal-b.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("synthetic_market_validation")
          seal = json.loads((root / "seal-a.json").read_text(encoding="utf-8"))
          expected = hashlib.sha256((root / "outcomes.parquet").read_bytes()).hexdigest()
          assert seal["qa_outcomes_sha256"] == expected
          PY

      - name: Prove post-seal mutation blocks before outcome scoring
        run: |
          cp synthetic_market_validation/genome_atp.json synthetic_market_validation/genome_atp.original
          printf '\n' >> synthetic_market_validation/genome_atp.json
          set +e
          python -m tennis_genome.experiments.market_validation_run run \
            --seal synthetic_market_validation/seal-a.json \
            --source-manifest synthetic_market_validation/source_manifest.json \
            --market-hist-records synthetic_market_validation/market_hist_001_records.jsonl \
            --pre-match synthetic_market_validation/pre_match.parquet \
            --market-hist-qa synthetic_market_validation/market_hist_qa_001.json \
            --power-mde synthetic_market_validation/power_mde_001.json \
            --profile-gap-atp synthetic_market_validation/profile_atp.json \
            --profile-gap-wta synthetic_market_validation/profile_wta.json \
            --genome-atp synthetic_market_validation/genome_atp.json \
            --genome-wta synthetic_market_validation/genome_wta.json \
            --outcomes synthetic_market_validation/outcomes.parquet \
            --output synthetic_market_validation/should-not-exist.json \
            > /tmp/stage-b-tamper.stdout 2> /tmp/stage-b-tamper.stderr
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "changed before Stage B: genome_atp" /tmp/stage-b-tamper.stderr
          test ! -e synthetic_market_validation/should-not-exist.json
          mv synthetic_market_validation/genome_atp.original synthetic_market_validation/genome_atp.json

      - name: Prove different outcome file blocks before evaluators
        run: |
          printf 'different-outcomes\n' > synthetic_market_validation/different_outcomes.parquet
          set +e
          python -m tennis_genome.experiments.market_validation_run run \
            --seal synthetic_market_validation/seal-a.json \
            --source-manifest synthetic_market_validation/source_manifest.json \
            --market-hist-records synthetic_market_validation/market_hist_001_records.jsonl \
            --pre-match synthetic_market_validation/pre_match.parquet \
            --market-hist-qa synthetic_market_validation/market_hist_qa_001.json \
            --power-mde synthetic_market_validation/power_mde_001.json \
            --profile-gap-atp synthetic_market_validation/profile_atp.json \
            --profile-gap-wta synthetic_market_validation/profile_wta.json \
            --genome-atp synthetic_market_validation/genome_atp.json \
            --genome-wta synthetic_market_validation/genome_wta.json \
            --outcomes synthetic_market_validation/different_outcomes.parquet \
            --output synthetic_market_validation/should-not-exist.json \
            > /tmp/stage-b-outcome.stdout 2> /tmp/stage-b-outcome.stderr
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "file frozen by MARKET-HIST-QA" /tmp/stage-b-outcome.stderr
          test ! -e synthetic_market_validation/should-not-exist.json

      - name: Prove confirmatory prior-row threshold is immutable
        run: |
          set +e
          python -m tennis_genome.experiments.market_validation_run run \
            --seal synthetic_market_validation/seal-a.json \
            --source-manifest synthetic_market_validation/source_manifest.json \
            --market-hist-records synthetic_market_validation/market_hist_001_records.jsonl \
            --pre-match synthetic_market_validation/pre_match.parquet \
            --market-hist-qa synthetic_market_validation/market_hist_qa_001.json \
            --power-mde synthetic_market_validation/power_mde_001.json \
            --profile-gap-atp synthetic_market_validation/profile_atp.json \
            --profile-gap-wta synthetic_market_validation/profile_wta.json \
            --genome-atp synthetic_market_validation/genome_atp.json \
            --genome-wta synthetic_market_validation/genome_wta.json \
            --outcomes synthetic_market_validation/outcomes.parquet \
            --min-prior-rows 20 \
            --output synthetic_market_validation/should-not-exist.json \
            > /tmp/stage-b-prior.stdout 2> /tmp/stage-b-prior.stderr
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "frozen at 1000" /tmp/stage-b-prior.stderr
          test ! -e synthetic_market_validation/should-not-exist.json

      - name: Upload Stage A synthetic artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-market-validation-run-synthetic
          path: synthetic_market_validation/seal-a.json
