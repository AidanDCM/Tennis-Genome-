name: Verify supervised pilot operational hardening v2

on:
  push:
    branches:
      - dev/supervised-pilot-operational-gate

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Apply operational evidence hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/harden_supervised_pilot.py')
          text = path.read_text()
          text = text.replace("old_test = '''", "old_test = r'''", 1)
          text = text.replace("old_late = '''", "old_late = r'''", 1)
          path.write_text(text)
          PY
          python .github/scripts/harden_supervised_pilot.py
      - name: Install pinned runtime and test tools
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Format and fix
        run: |
          ruff format src/tennis_genome/prospective tests/test_prospective_pilot.py
          ruff check --fix src/tennis_genome/prospective tests/test_prospective_pilot.py
      - name: Reviewer regression tests
        run: pytest -q tests/test_prospective_pilot.py tests/test_matchup_calculator.py tests/test_pattern_confirm_live.py
      - name: Ruff
        run: ruff check . --exclude .github/scripts/harden_supervised_pilot.py
      - name: Full pytest
        run: pytest -q
      - name: Commit verified operational gate
        run: |
          git config user.name 'Aidan Miller'
          git config user.email 'aidandcmiller@live.com'
          git add src/tennis_genome/prospective/pilot.py tests/test_prospective_pilot.py docs/prospective_full_stack_pilot.md research/installment_01/full_stack_forward_001_protocol.md
          git commit -m 'Enforce supervised pilot evidence gate'
          git push origin HEAD:dev/supervised-pilot-operational-gate
