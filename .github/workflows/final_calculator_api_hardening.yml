name: Final calculator API hardening

on:
  push:
    branches:
      - dev/prospective-pilot-boundary-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Apply final API and runtime hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Direct typed MatchupInput construction must enforce the same finite-value
          # invariant as JSON ingestion.
          path = Path('src/tennis_genome/calculator/types.py')
          text = path.read_text()
          text = text.replace(
              'import re\nfrom dataclasses import dataclass\nfrom datetime import datetime\n',
              'import math\nimport re\nfrom collections.abc import Mapping, Sequence\nfrom dataclasses import dataclass, fields, is_dataclass\nfrom datetime import datetime\n',
              1,
          )
          anchor = '_SHA256_RE = re.compile(r"^[0-9a-f]{64}$")\n\n\n'
          helper = '''_SHA256_RE = re.compile(r"^[0-9a-f]{64}$")\n\n\ndef _reject_nonfinite_state(value: object, *, path: str) -> None:\n    if isinstance(value, float) and not math.isfinite(value):\n        raise ValueError(f"{path} contains a non-finite numeric value")\n    if is_dataclass(value) and not isinstance(value, type):\n        for field in fields(value):\n            _reject_nonfinite_state(getattr(value, field.name), path=f"{path}.{field.name}")\n        return\n    if isinstance(value, Mapping):\n        for key, nested in value.items():\n            _reject_nonfinite_state(nested, path=f"{path}.{key}")\n        return\n    if isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):\n        for index, nested in enumerate(value):\n            _reject_nonfinite_state(nested, path=f"{path}[{index}]")\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('types finite helper anchor missing')
          text = text.replace(anchor, helper, 1)
          anchor = '''        if isinstance(self.best_of, bool) or self.best_of not in (3, 5):\n            raise ValueError("best_of must be integer 3 or 5")\n\n        if self.tour == "ATP":\n'''
          replacement = '''        if isinstance(self.best_of, bool) or self.best_of not in (3, 5):\n            raise ValueError("best_of must be integer 3 or 5")\n\n        _reject_nonfinite_state(self.foundational, path="foundational")\n        if self.profile_pair is not None:\n            _reject_nonfinite_state(self.profile_pair, path="profile_pair")\n        if self.serve_return is not None:\n            _reject_nonfinite_state(self.serve_return, path="serve_return")\n\n        if self.tour == "ATP":\n'''
          if text.count(anchor) != 1:
              raise SystemExit('types validation anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))

          # A sealed production identity may only be paired with banks that passed
          # the path-based byte-digest checks. Synthetic bundles remain constructible.
          path = Path('src/tennis_genome/calculator/engine.py')
          text = path.read_text()
          anchor = 'from .types import FairDecimalOdds, MatchupCalculation, MatchupInput\n\n\n'
          replacement = 'from .types import FairDecimalOdds, MatchupCalculation, MatchupInput\n\n\n_VERIFIED_PRODUCTION_BANKS = object()\n\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('engine sentinel anchor missing')
          text = text.replace(anchor, replacement, 1)
          anchor = '''        wta_neighbor_bank: tuple[ResidualRecord, ...],\n    ) -> None:\n        from .contract import FROZEN_PRODUCTION_BUNDLE_SHA256, validate_frozen_bundle_authenticity\n\n        if bundle.artifact_sha256 == FROZEN_PRODUCTION_BUNDLE_SHA256:\n            validate_frozen_bundle_authenticity(bundle)\n'''
          replacement = '''        wta_neighbor_bank: tuple[ResidualRecord, ...],\n        _production_bank_token: object | None = None,\n    ) -> None:\n        from .contract import FROZEN_PRODUCTION_BUNDLE_SHA256, validate_frozen_bundle_authenticity\n\n        if bundle.artifact_sha256 == FROZEN_PRODUCTION_BUNDLE_SHA256:\n            validate_frozen_bundle_authenticity(bundle)\n            if _production_bank_token is not _VERIFIED_PRODUCTION_BANKS:\n                raise ValueError(\n                    "sealed production neighbor banks must be loaded through "\n                    "MatchupCalculator.from_bundle_path(...)"\n                )\n'''
          if text.count(anchor) != 1:
              raise SystemExit('engine constructor anchor missing')
          text = text.replace(anchor, replacement, 1)
          anchor = '''        return cls(\n            bundle,\n            atp_neighbor_bank=load_neighbor_bank(path, bundle.atp.neighbor_bank),\n            wta_neighbor_bank=load_neighbor_bank(path, bundle.wta.neighbor_bank),\n        )\n'''
          replacement = '''        return cls(\n            bundle,\n            atp_neighbor_bank=load_neighbor_bank(path, bundle.atp.neighbor_bank),\n            wta_neighbor_bank=load_neighbor_bank(path, bundle.wta.neighbor_bank),\n            _production_bank_token=_VERIFIED_PRODUCTION_BANKS,\n        )\n'''
          if text.count(anchor) != 1:
              raise SystemExit('engine from_bundle_path anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))

          # Keep the public production loader on the one authenticated path.
          replace_once(
              'src/tennis_genome/calculator/contract.py',
              '''    from .engine import MatchupCalculator, load_neighbor_bank\n\n    bundle = load_bundle(path, verify_banks=True)\n    validate_frozen_bundle_contract(bundle)\n    return MatchupCalculator(\n        bundle,\n        atp_neighbor_bank=load_neighbor_bank(path, bundle.atp.neighbor_bank),\n        wta_neighbor_bank=load_neighbor_bank(path, bundle.wta.neighbor_bank),\n    )\n''',
              '''    from .engine import MatchupCalculator\n\n    return MatchupCalculator.from_bundle_path(path)\n''',
          )

          # Regression probes for both reported seams.
          path = Path('tests/test_matchup_calculator.py')
          text = path.read_text()
          addition = '''\n\ndef test_direct_production_constructor_rejects_unverified_in_memory_banks() -> None:\n    from pathlib import Path\n\n    from tennis_genome.independent.production import load_bundle\n\n    bundle_path = (\n        Path(__file__).resolve().parents[1]\n        / "artifacts/tge_independent_v1_production/tge_independent_v1_production.json"\n    )\n    bundle = load_bundle(bundle_path, verify_banks=False)\n    with pytest.raises(ValueError, match="must be loaded through MatchupCalculator.from_bundle_path"):\n        MatchupCalculator(bundle, atp_neighbor_bank=(), wta_neighbor_bank=())\n\n\ndef test_direct_matchup_input_rejects_nonfinite_nested_state() -> None:\n    _, _, wta_input = _calculator_and_inputs()\n    bad_serve_return = replace(\n        wta_input.serve_return,\n        prior_serve_points_a=float("nan"),\n    )\n    with pytest.raises(ValueError, match="serve_return.prior_serve_points_a.*non-finite"):\n        replace(wta_input, serve_return=bad_serve_return)\n'''
          if 'test_direct_production_constructor_rejects_unverified_in_memory_banks' in text:
              raise SystemExit('regression tests already present')
          path.write_text(text.rstrip() + addition + '\n')

          # Freeze the runtime used for calculator/prospective evidence generation.
          requirements = Path('requirements')
          requirements.mkdir(exist_ok=True)
          (requirements / 'runtime.lock').write_text('''# Frozen runtime for TGE-Independent-v1 supervised calculation / prospective evidence.\n# Python is pinned separately to CPython 3.11.16.\nannotated-types==0.8.0\ncloudpickle==3.1.2\nduckdb==1.5.5\njoblib==1.6.0\nnarwhals==2.26.0\nnumpy==2.4.6\npandas==3.0.5\npyarrow==25.0.1\npydantic==2.13.5\npydantic-core==2.46.5\npython-dateutil==2.9.0.post0\nscikit-learn==1.9.1\nscipy==1.17.1\nsix==1.17.0\nthreadpoolctl==3.6.0\ntyping-extensions==4.16.0\ntyping-inspection==0.4.4\n''')
          (requirements / 'ci.lock').write_text('''-r runtime.lock\ncoverage==7.16.1\niniconfig==2.3.0\npackaging==26.3\npluggy==1.6.0\nPygments==2.21.0\npytest==9.1.1\npytest-cov==7.1.0\nruff==0.16.7\n''')

          # Make normal CI exercise the pinned runtime rather than latest-compatible deps.
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = text.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04', 1)
          text = text.replace('python-version: "3.11"', 'python-version: "3.11.16"', 1)
          text = text.replace(
              '      - name: Install package\n        run: pip install -e .[dev]\n',
              '      - name: Install pinned runtime and test tools\n        run: |\n          python -m pip install -r requirements/ci.lock\n          python -m pip install -e . --no-deps\n',
              1,
          )
          path.write_text(text)

          Path('docs/runtime_reproducibility.md').write_text('''# Runtime reproducibility\n\nThe supported frozen calculator and prospective-evidence runtime is CPython **3.11.16** with the exact package versions in `requirements/runtime.lock`. Normal CI installs that runtime through `requirements/ci.lock`, then installs the project itself with `--no-deps`.\n\nThis pin does not change any frozen scientific coefficient or model artifact. It makes computational verification and future prospective records attributable to a concrete interpreter/dependency environment rather than to a moving `>=` dependency resolution.\n\nFor production-style supervised calculation, use the pinned JSON/file-loading path. An in-memory object that claims the sealed production bundle fingerprint is not permitted to attach caller-supplied neighbor records; the neighbor-bank byte digests are verified only by the path loader. Synthetic non-production bundles remain available for unit and research tests.\n''')
          PY
      - name: Install pinned runtime and test tools
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Format touched Python
        run: |
          ruff format src/tennis_genome/calculator/types.py src/tennis_genome/calculator/engine.py src/tennis_genome/calculator/contract.py tests/test_matchup_calculator.py
      - name: Targeted regressions
        run: |
          pytest -q tests/test_matchup_calculator.py tests/test_matchup_calculator_contract.py tests/test_matchup_calculator_io.py
      - name: Ruff
        run: ruff check .
      - name: Full pytest
        run: pytest -q
      - name: Remove one-shot verifier
        run: rm .github/workflows/final_calculator_api_hardening.yml
      - name: Commit verified hardening
        run: |
          git config user.name 'Aidan Miller'
          git config user.email 'aidandcmiller@live.com'
          git add -A
          git commit -m 'Close final calculator API seams and pin runtime'
          git push origin HEAD:dev/prospective-pilot-boundary-hardening
