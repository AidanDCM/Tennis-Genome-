name: Provider Cadence Live Gate 001

on:
  push:
    branches:
      - dev/provider-capture-cadence-current

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  live-cadence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PROVIDER_ARTIFACT_ID: "10408107392"
      PROVIDER_RUN_ID: "34997744882"
      PROVIDER_ANCHOR_COMMENT_ID: "5684381781"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Download genuine trusted provider artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVIDER_ARTIFACT_ID}/zip" \
            --output trusted-provider-capture.zip
          unzip -q trusted-provider-capture.zip -d trusted-provider-artifact
          test -f trusted-provider-artifact/trusted-provider-capture/provider-batch-store/records/00000001-5f23498164f45f03c2d79133e4e28d59d3ff51dd0ef105d70cd760bc3458ad10.json
      - name: Authenticate and admit genuine provider capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from tennis_genome.prospective.provider_batch import ProviderBatchStore
          from tennis_genome.prospective.provider_capture_cadence_live import (
              LiveProviderCaptureCadenceStore,
              attest_live_provider_batch,
              verify_live_capture_cadence,
          )

          batch_store = ProviderBatchStore(
              Path("trusted-provider-artifact/trusted-provider-capture/provider-batch-store")
          )
          cadence_store = LiveProviderCaptureCadenceStore(Path("live-cadence-store"))
          comment_id = int(os.environ["PROVIDER_ANCHOR_COMMENT_ID"])

          attestation = attest_live_provider_batch(
              batch_store=batch_store,
              cadence_store=cadence_store,
              github_comment_id=comment_id,
          )
          report = verify_live_capture_cadence(
              batch_store=batch_store,
              cadence_store=cadence_store,
              complete_through=datetime.now(UTC),
          )
          if report.get("status") != "LIVE_CADENCE_VERIFIED":
              raise SystemExit("live cadence gate did not verify")
          if report.get("attested_batch_count") != 1:
              raise SystemExit("live cadence gate expected exactly one admitted batch")
          if str(attestation.get("batch_record_sha256")) != "5f23498164f45f03c2d79133e4e28d59d3ff51dd0ef105d70cd760bc3458ad10":
              raise SystemExit("live cadence admitted the wrong provider batch")

          Path("live-cadence-report.json").write_text(
              json.dumps(
                  {"attestation": attestation, "verification": report},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload live cadence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-cadence-live-gate-001
          path: |
            live-cadence-store/
            live-cadence-report.json
          retention-days: 90
