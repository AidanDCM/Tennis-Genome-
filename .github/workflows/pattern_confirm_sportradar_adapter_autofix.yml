name: PATTERN-CONFIRM Sportradar Adapter Autofix

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_sportradar_adapter_autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harden adapter semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('src/tennis_genome/experiments/pattern_confirm_sportradar_state.py')
          text = module.read_text()
          text = text.replace('import json\nimport math\nimport re\n', 'import json\nimport re\n')
          text = text.replace(
              '''def _text(value: object) -> str:\n    return str(value).strip()\n''',
              '''def _text(value: object) -> str:\n    if value is None:\n        return ""\n    return str(value).strip()\n''',
          )
          text = text.replace(
              '''def _stats_side(raw: dict[str, object]) -> MatchStats | None:\n    raise RuntimeError("_stats_side is not called directly")\n\n\n''',
              '',
          )
          old_sig = '''def _summary_stats(summary: dict[str, object], match_id: str) -> MatchStats | None:\n'''
          new_sig = '''def _summary_stats(\n    summary: dict[str, object],\n    match_id: str,\n    *,\n    expected_home_id: str,\n    expected_away_id: str,\n) -> MatchStats | None:\n'''
          if old_sig not in text:
              raise SystemExit('summary stats signature marker not found')
          text = text.replace(old_sig, new_sig)
          old_rows = '''    home = side("home")\n    away = side("away")\n\n    def derived_service_points(values: dict[str, object], qualifier: str) -> int | None:\n'''
          new_rows = '''    home_row = competitors["home"]\n    away_row = competitors["away"]\n    if _required_text(home_row, "id") != expected_home_id:\n        raise ValueError("statistics home competitor ID mismatch")\n    if _required_text(away_row, "id") != expected_away_id:\n        raise ValueError("statistics away competitor ID mismatch")\n    home = side("home")\n    away = side("away")\n\n    def derived_service_points(values: dict[str, object], qualifier: str) -> int | None:\n'''
          if old_rows not in text:
              raise SystemExit('summary stats orientation marker not found')
          text = text.replace(old_rows, new_rows)
          old_call = '''    stats = None if outcome.retirement or outcome.walkover else _summary_stats(summary, event_id)\n'''
          new_call = '''    stats = (\n        None\n        if outcome.retirement or outcome.walkover\n        else _summary_stats(\n            summary,\n            event_id,\n            expected_home_id=home_sr,\n            expected_away_id=away_sr,\n        )\n    )\n'''
          if old_call not in text:
              raise SystemExit('summary stats call marker not found')
          text = text.replace(old_call, new_call)
          module.write_text(text)

          tests = Path('tests/test_pattern_confirm_sportradar_state.py')
          test_text = tests.read_text().replace('from dataclasses import replace\n\n', '')
          append = '''\n\ndef test_state_bundle_rejects_statistics_orientation_mismatch() -> None:\n    crosswalk = {\n        "sr:competitor:11": "canonical-a",\n        "sr:competitor:22": "canonical-b",\n    }\n    payload = _summary(\n        event_id="sr:sport_event:stats-swap",\n        status="closed",\n        winner_id="sr:competitor:11",\n    )\n    totals = payload["statistics"]["totals"]["competitors"]\n    totals[0]["id"], totals[1]["id"] = totals[1]["id"], totals[0]["id"]\n    bundle = build_state_bundle(summaries=[payload], crosswalk=crosswalk)\n    assert bundle.accepted_count == 0\n    assert bundle.excluded_count == 1\n    assert "statistics home competitor ID mismatch" in bundle.exclusions[0].reason\n'''
          if 'test_state_bundle_rejects_statistics_orientation_mismatch' not in test_text:
              test_text += append
          tests.write_text(test_text)
          PY
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format \
            src/tennis_genome/experiments/pattern_confirm_sportradar_state.py \
            tests/test_pattern_confirm_sportradar_state.py
          ruff check --fix \
            src/tennis_genome/experiments/pattern_confirm_sportradar_state.py \
            tests/test_pattern_confirm_sportradar_state.py
          ruff check .
          pytest
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add \
            src/tennis_genome/experiments/pattern_confirm_sportradar_state.py \
            tests/test_pattern_confirm_sportradar_state.py
          git commit -m "Harden Sportradar context and state adapters"
          git push origin HEAD:dev/pattern-confirm-provider-dryrun
