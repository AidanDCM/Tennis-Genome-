name: WTA Web Shadow

on:
  push:
    branches:
      - main
    paths:
      - "web-shadow/active-candidate.json"
  workflow_dispatch:
    inputs:
      fixture_path:
        description: "Repository path under web-shadow/fixtures/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wta-web-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      PINNED_2026_MATCHES_BLOB: 4989661bc24d621417b344d22c5e5a2b8ef5119e
      PINNED_2026_QUAL_ITF_BLOB: 429fe4fc3a7736fda1d5c711ae587a6146490cf0
      PINNED_HISTORY_MAX_DATE: 2026-06-02
      WEB_SHADOW_HISTORY_MODE: PINNED_PUBLIC_HISTORY_THROUGH_2026_06_02

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve fixture path
        shell: bash
        env:
          DISPATCH_FIXTURE_PATH: ${{ inputs.fixture_path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            FIXTURE_PATH="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("web-shadow/active-candidate.json").read_text(encoding="utf-8")
          )
          print(payload["fixture_path"])
          PY
            )"
          else
            FIXTURE_PATH="${DISPATCH_FIXTURE_PATH}"
          fi
          case "${FIXTURE_PATH}" in
            web-shadow/fixtures/*.json) ;;
            *) echo "fixture_path must be under web-shadow/fixtures/" >&2; exit 1 ;;
          esac
          test -f "${FIXTURE_PATH}"
          echo "FIXTURE_PATH=${FIXTURE_PATH}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Download pinned WTA history through June 2 2026
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors               "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv"               --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_2026.csv"             --output data/wta-live-raw/wta_matches_2026.csv
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_qual_itf_2026.csv"             --output data/wta-live-raw/wta_matches_qual_itf_2026.csv
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv"             --output data/wta_players.csv
          test "$(git hash-object data/wta-live-raw/wta_matches_2026.csv)" = "${PINNED_2026_MATCHES_BLOB}"
          test "$(git hash-object data/wta-live-raw/wta_matches_qual_itf_2026.csv)" = "${PINNED_2026_QUAL_ITF_BLOB}"
          test "$(find data/wta-live-raw -type f -name 'wta_matches_*.csv' | wc -l)" -eq 28
          test -s data/wta_players.csv

      - name: Reconcile overlapping pinned 2026 sources
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.reconcile_web_shadow_2026_history \
            --primary data/wta-live-raw/wta_matches_2026.csv \
            --secondary data/wta-live-raw/wta_matches_qual_itf_2026.csv \
            --output data/wta-live-raw/wta_matches_qual_itf_2026_reconciled.csv \
            --receipt data/wta-live-base/2026-source-reconciliation.json \
            --expected-exact-duplicate-rows 216 \
            --expected-cross-source-overlap-rows 0

      - name: Rebuild canonical pinned WTA history
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2026); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          args+=(--input data/wta-live-raw/wta_matches_qual_itf_2026_reconciled.csv)
          python -m tennis_genome.pipeline.build_dataset             "${args[@]}"             --tour WTA             --output-dir data/wta-live-base             --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-through-20260602"             --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror"             --source-version "${PINNED_ARCHIVE_COMMIT}"             --license-name "CC BY-NC-SA 4.0"             --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/"             --allowed-use-status research_allowed             > data/wta-live-base/build_output.json

      - name: Resolve canonical target identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-shadow-run
          python scripts/build_web_shadow_target_state.py             --fixture "${FIXTURE_PATH}"             --registry data/wta_players.csv             --target-state web-shadow-run/target-state.json             --normalized-fixture web-shadow-run/normalized-fixture.json

      - name: Build provider-free matchup input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_web_shadow_local_input.py             --fixture web-shadow-run/normalized-fixture.json             --target-state web-shadow-run/target-state.json             --output web-shadow-run/matchup-input.json             --manifest web-shadow-run/local-input-manifest.json             --history-mode "${WEB_SHADOW_HISTORY_MODE}"             --expected-history-max-date "${PINNED_HISTORY_MAX_DATE}"

      - name: Freeze sealed Genome prediction
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_A_ID="$(python -c 'import json; print(json.load(open("web-shadow-run/target-state.json"))["player_a_id"])')"
          PLAYER_B_ID="$(python -c 'import json; print(json.load(open("web-shadow-run/target-state.json"))["player_b_id"])')"
          COMMITTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python scripts/run_web_shadow_prediction.py             --fixture web-shadow-run/normalized-fixture.json             --matchup-input web-shadow-run/matchup-input.json             --bundle artifacts/tge_independent_v1_production/tge_independent_v1_production.json             --player-a-id "${PLAYER_A_ID}"             --player-b-id "${PLAYER_B_ID}"             --model-source-sha "${GITHUB_SHA}"             --committed-at "${COMMITTED_AT}"             --output web-shadow-run/prediction.json

      - name: Retain raw source fixture and history reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cp "${FIXTURE_PATH}" web-shadow-run/source-fixture.json
          cp data/wta-live-base/2026-source-reconciliation.json \
            web-shadow-run/2026-source-reconciliation.json

      - name: Verify non-production receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path("web-shadow-run/prediction.json").read_text())
          manifest = json.loads(
              Path("web-shadow-run/local-input-manifest.json").read_text()
          )
          assert record["production_eligible"] is False
          assert manifest["production_eligible"] is False
          assert manifest["history_mode"] == "PINNED_PUBLIC_HISTORY_THROUGH_2026_06_02"
          assert manifest["base_history_max_event_date"] == "2026-06-02"
          PY

      - name: Upload Web Shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-shadow-${{ github.run_id }}
          path: web-shadow-run/
          if-no-files-found: error
          retention-days: 90
