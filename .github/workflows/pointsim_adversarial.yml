name: Tennis Genome POINTSIM Adversarial Research

on:
  push:
    branches:
      - dev/pointsim-adv-wta
    paths:
      - ".github/workflows/pointsim_adversarial.yml"
      - "src/tennis_genome/experiments/pointsim_adversarial.py"
      - "src/tennis_genome/experiments/pointsim.py"
      - "src/tennis_genome/experiments/genome_adversarial_controls.py"
      - "src/tennis_genome/simulation/**"
      - "src/tennis_genome/ratings/**"
      - "src/tennis_genome/features/**"
      - "src/tennis_genome/profiles/**"
      - "src/tennis_genome/models/**"
      - "src/tennis_genome/data/**"
      - "tests/test_pointsim_adversarial.py"
      - "research/installment_01/pointsim_adversarial*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointsim-adversarial-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout Tennis Genome
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Assert spent 2026 holdout is excluded
        shell: bash
        run: |
          set -euo pipefail
          test "$START_YEAR" = "2000"
          test "$END_YEAR" = "2025"

      - name: Download pinned WTA 2000-2025 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            filename="wta_matches_${year}.csv"
            url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/wta/${filename}"
            curl --fail --location --silent --show-error --retry 3 \
              --output "data/research_raw/wta/${filename}" "$url"
          done
          test "$(find data/research_raw/wta -type f | wc -l)" -eq 26

      - name: Build canonical WTA dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_processed/wta
          args=()
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            args+=(--input "data/research_raw/wta/wta_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset \
            "${args[@]}" \
            --tour WTA \
            --output-dir data/research_processed/wta \
            --source-id "sackmann-archive-${ARCHIVE_COMMIT}-wta-${START_YEAR}-${END_YEAR}" \
            --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
            --source-version "$ARCHIVE_COMMIT" \
            --license-name "$LICENSE_NAME" \
            --license-url "$LICENSE_URL" \
            --allowed-use-status research_allowed \
            > data/research_processed/wta/build_output.json

      - name: Run POINTSIM-ADV-001 WTA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pointsim_adversarial
          python -m tennis_genome.experiments.pointsim_adversarial \
            --manifest data/research_processed/wta/wta_manifest.json \
            --pre-match data/research_processed/wta/wta_pre_match.parquet \
            --outcomes data/research_processed/wta/wta_outcomes.parquet \
            --stats data/research_processed/wta/wta_stats.parquet \
            --min-core-train-matches 1000 \
            --min-neighbor-pool 1000 \
            --min-meta-train-rows 1000 \
            --min-pointsim-train-rows 1000 \
            --min-adversary-train-rows 1000 \
            > artifacts/pointsim_adversarial/pointsim_adversarial_wta.json

      - name: Copy provenance manifest
        run: cp data/research_processed/wta/wta_manifest.json artifacts/pointsim_adversarial/

      - name: Write POINTSIM-ADV-001 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/pointsim_adversarial")
          data = json.loads((root / "pointsim_adversarial_wta.json").read_text())
          c = data["comparison"]
          g = data["gate"]
          recent = data["recent_comparison"]
          lines = [
              "# POINTSIM-ADV-001",
              "",
              "Coverage: **WTA 2000-2025 only**. The spent partial-2026 holdout remains excluded.",
              "",
              "| Population | Control Brier | Challenger Brier | Δ Brier | Control LL | Challenger LL | Δ LL |",
              "|---|---:|---:|---:|---:|---:|---:|",
              f"| Aggregate ({data['prediction_population_n']}) | {c['alignment_recalibration_control']['brier']:.6f} | {c['alignment_plus_pointsim']['brier']:.6f} | {c['challenger_vs_control_brier_improvement']:+.6f} | {c['alignment_recalibration_control']['log_loss']:.6f} | {c['alignment_plus_pointsim']['log_loss']:.6f} | {c['challenger_vs_control_log_loss_improvement']:+.6f} |",
          ]
          if recent is not None:
              lines.append(
                  f"| 2021-2025 ({recent['n']}) | {recent['alignment_recalibration_control']['brier']:.6f} | {recent['alignment_plus_pointsim']['brier']:.6f} | {recent['challenger_vs_control_brier_improvement']:+.6f} | {recent['alignment_recalibration_control']['log_loss']:.6f} | {recent['alignment_plus_pointsim']['log_loss']:.6f} | {recent['challenger_vs_control_log_loss_improvement']:+.6f} |"
              )
          lines.extend([
              "",
              f"Joint proper-score year wins: **{g['joint_year_win_count']}/{g['evaluated_year_count']} ({g['joint_year_win_rate']:.1%})**",
              "",
              f"Promotion gate: **{g['passed']}**",
              "",
              "This is historical development evidence only; no market/profitability claim is tested.",
          ])
          summary = "\n".join(lines) + "\n"
          (root / "SUMMARY.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload POINTSIM-ADV-001 reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-pointsim-adversarial
          path: artifacts/pointsim_adversarial/
          if-no-files-found: warn
          retention-days: 30
