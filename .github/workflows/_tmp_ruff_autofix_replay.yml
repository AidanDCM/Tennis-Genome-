name: TEMP Ruff Autofix Replay Test

on:
  push:
    branches:
      - dev/api-tennis-filtered-replay-v1
    paths:
      - ".github/workflows/_tmp_ruff_autofix_replay.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev/api-tennis-filtered-replay-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Install pinned Ruff
        run: python -m pip install -r requirements/ci.lock
      - name: Apply Ruff import autofix only
        run: ruff check tests/test_api_tennis_filtered_replay.py --select I --fix
      - name: Commit canonical import order
        shell: bash
        run: |
          set -euo pipefail
          git diff -- tests/test_api_tennis_filtered_replay.py
          if git diff --quiet -- tests/test_api_tennis_filtered_replay.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api_tennis_filtered_replay.py
          git commit -m "Apply Ruff canonical import ordering"
          git push origin HEAD:dev/api-tennis-filtered-replay-v1
