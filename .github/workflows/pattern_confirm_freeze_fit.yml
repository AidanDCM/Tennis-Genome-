name: PATTERN-CONFIRM-001 Freeze Baseline

on:
  push:
    branches: [dev/pattern-confirm-001]
    paths:
      - .github/workflows/pattern_confirm_freeze_fit.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Recheck confirmation implementation
        run: |
          ruff check src/tennis_genome/experiments/pattern_confirm.py tests/test_pattern_confirm.py
          pytest tests/test_pattern_confirm.py
      - name: Download frozen confirmatory bundle
        uses: actions/download-artifact@v4
        with:
          name: bookmaker-confirmatory-6d62014eeb1549c0bda09cb5987695ac7c2be2a1
          path: inputs/confirmatory
          github-token: ${{ github.token }}
          run-id: 34623630174
      - name: Verify parent result bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '6419f5fbfa24ed6399771ce9a8ed23a46aa8720406acf987498eb24ed139e88d  inputs/confirmatory/market_validation_results.json' | sha256sum --check
      - name: Freeze historical Market plus Core calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen
          python -m tennis_genome.experiments.pattern_confirm freeze-fit \
            --results inputs/confirmatory/market_validation_results.json \
            --output frozen/pattern_confirm_market_core_fit.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('frozen/pattern_confirm_market_core_fit.json')
          payload = json.loads(path.read_text())
          assert payload['experiment_id'] == 'PATTERN-CONFIRM-001'
          assert payload['version'] == 'pattern-confirm-v1'
          assert payload['training_end_year'] <= 2025
          assert payload['training_n'] == 22604
          stored = payload['artifact_sha256']
          unsigned = dict(payload)
          unsigned.pop('artifact_sha256')
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode('utf-8')
          assert hashlib.sha256(encoded).hexdigest() == stored
          Path('frozen/FIT_SUMMARY.json').write_text(
              json.dumps(
                  {
                      'experiment_id': payload['experiment_id'],
                      'version': payload['version'],
                      'artifact_sha256': stored,
                      'source_bundle_sha256': payload['source_bundle_sha256'],
                      'training_rows_sha256': payload['training_rows_sha256'],
                      'training_n': payload['training_n'],
                      'training_start_year': payload['training_start_year'],
                      'training_end_year': payload['training_end_year'],
                      'intercept': payload['intercept'],
                      'market_logit_slope': payload['market_logit_slope'],
                      'core_logit_slope': payload['core_logit_slope'],
                  },
                  indent=2,
                  sort_keys=True,
                  allow_nan=False,
              ) + '\n'
          )
          print(Path('frozen/FIT_SUMMARY.json').read_text())
          PY
      - name: Preserve frozen baseline fit
        uses: actions/upload-artifact@v4
        with:
          name: pattern-confirm-001-baseline-${{ github.sha }}
          path: frozen/
          retention-days: 90
