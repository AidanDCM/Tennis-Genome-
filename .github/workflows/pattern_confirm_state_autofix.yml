name: PATTERN-CONFIRM Prospective State Autofix

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_state_autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix duplicate-ID fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_pattern_confirm_live_state.py')
          text = path.read_text()
          old = '''def test_target_identity_cannot_already_exist_in_history() -> None:\n    duplicate = replace(_history()[0], pre_match=replace(_history()[0].pre_match, match_id="target"))\n    duplicate = replace(duplicate, outcome=replace(duplicate.outcome, match_id="target"))\n    with pytest.raises(ValueError, match="already exists"):\n'''
          new = '''def test_target_identity_cannot_already_exist_in_history() -> None:\n    base = _history()[0]\n    assert base.stats is not None\n    duplicate = HistoricalMatch(\n        pre_match=replace(base.pre_match, match_id="target"),\n        outcome=replace(base.outcome, match_id="target"),\n        stats=replace(base.stats, match_id="target"),\n    )\n    with pytest.raises(ValueError, match="already exists"):\n'''
          if old not in text:
              raise SystemExit('expected duplicate-ID fixture block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format \
            src/tennis_genome/experiments/pattern_confirm_live_state.py \
            tests/test_pattern_confirm_live_state.py
          ruff check --fix \
            src/tennis_genome/experiments/pattern_confirm_live_state.py \
            tests/test_pattern_confirm_live_state.py
          ruff check .
          pytest
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add \
            src/tennis_genome/experiments/pattern_confirm_live_state.py \
            tests/test_pattern_confirm_live_state.py
          git commit -m "Fix prospective state verification fixtures"
          git push origin HEAD:dev/pattern-confirm-provider-dryrun
