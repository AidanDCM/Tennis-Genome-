name: WTA API Schema Probe

on:
  pull_request:
    paths:
      - ".github/workflows/wta_api_schema_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe official WTA Singapore endpoints
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            -H "Accept: application/json"
            -H "Accept-Language: en"
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
          )
          curl --fail --location --silent --show-error --retry 3             "${headers[@]}"             "https://api.wtatennis.com/tennis/tournaments/1152/2026"             -o tournament.json
          curl --fail --location --silent --show-error --retry 3             "${headers[@]}"             "https://api.wtatennis.com/tennis/tournaments/1152/2026/matches"             -o matches.json
          echo "=== tournament keys ==="
          jq 'keys' tournament.json
          echo "=== tournament ==="
          jq '{tournamentGroup,year,title,startDate,endDate,surface,inOutdoor,city,country,level,status,liveScoringId}' tournament.json
          echo "=== matches root keys ==="
          jq 'keys' matches.json
          echo "=== match count ==="
          jq '.matches | length' matches.json
          echo "=== first 8 match key sets ==="
          jq '[.matches[:8][] | keys]' matches.json
          echo "=== upcoming-like match samples ==="
          jq '[.matches[] | select((.MatchState // .matchState // "") | tostring | test("UP|SCHED|NOT|LIVE"; "i"))][0:8]' matches.json
          echo "=== last 12 match samples ==="
          jq '.matches[-12:]' matches.json

          curl --fail --location --silent --show-error --retry 3 \
            "${headers[@]}" \
            "https://api.wtatennis.com/tennis/tournaments/1152/2026/draw" \
            -o draw.json
          echo "=== draw root keys ==="
          jq 'keys' draw.json
          echo "=== draw structural summary ==="
          jq 'walk(if type == "object" then with_entries(select(.key | test("round|Round|event|Event|match|Match|description|Description|type|Type"))) else . end) | .[0:3]?' draw.json || true
          echo "=== drawInfo type and decoded root keys ==="
          jq '.drawInfo | type' draw.json
          jq -r '.drawInfo[0]' draw.json | jq 'keys'
          echo "=== decoded draw round-bearing nodes ==="
          jq -r '.drawInfo[0]' draw.json | jq '[.. | objects | select(any(keys[]?; test("Round|round"))) | with_entries(select(.key | test("Round|round|Match|match|Description|description|Name|name|ID|Id|id")))] | .[:40]'
          echo "=== draw strings containing round labels ==="
          grep -Eo '"[^"]*(Round of|Quarter|Semi|Final|R32|R16)[^"]*"' draw.json | head -80 || true
