name: PATTERN-CONFIRM Provider Dry-run Autofix

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_provider_dryrun_autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch verifier boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tennis_genome/experiments/pattern_confirm_provider_dryrun.py')
          text = path.read_text()
          text = text.replace(
              'import time\nfrom dataclasses import asdict, dataclass\nfrom datetime import UTC, date, datetime, timedelta\nfrom pathlib import Path\nfrom typing import Callable\n',
              'import time\nfrom collections.abc import Callable\nfrom dataclasses import asdict, dataclass\nfrom datetime import UTC, datetime, timedelta\nfrom pathlib import Path\n',
          )
          old = '''    normalized["odds_candidates"] = tuple(\n        OddsCandidate(**item)\n        for item in _as_list(payload.get("odds_candidates", []), field="odds_candidates")\n        if isinstance(item, dict)\n    )\n    normalized["alignments"] = tuple(\n        ProviderAlignment(**item)\n        for item in _as_list(payload.get("alignments", []), field="alignments")\n        if isinstance(item, dict)\n    )\n'''
          new = '''    raw_candidates = payload.get("odds_candidates", ())\n    if not isinstance(raw_candidates, (list, tuple)):\n        raise ValueError("odds_candidates must be an array")\n    normalized["odds_candidates"] = tuple(\n        OddsCandidate(**item) for item in raw_candidates if isinstance(item, dict)\n    )\n    raw_alignments = payload.get("alignments", ())\n    if not isinstance(raw_alignments, (list, tuple)):\n        raise ValueError("alignments must be an array")\n    normalized["alignments"] = tuple(\n        ProviderAlignment(**item) for item in raw_alignments if isinstance(item, dict)\n    )\n'''
          if old not in text:
              raise SystemExit('expected verifier block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format src/tennis_genome/experiments/pattern_confirm_provider_dryrun.py tests/test_pattern_confirm_provider_dryrun.py
          ruff check --fix src/tennis_genome/experiments/pattern_confirm_provider_dryrun.py tests/test_pattern_confirm_provider_dryrun.py
          ruff check .
          pytest
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add src/tennis_genome/experiments/pattern_confirm_provider_dryrun.py tests/test_pattern_confirm_provider_dryrun.py
          git commit -m "Fix provider dry-run verification boundary"
          git push origin HEAD:dev/pattern-confirm-provider-dryrun
