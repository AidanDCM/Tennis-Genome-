name: API-Tennis One-Request Seven-Day Range Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/api-tennis-range-probe-request.json"

permissions:
  contents: read

concurrency:
  group: api-tennis-seven-day-range-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      API_TENNIS_API: ${{ secrets.API_TENNIS_API }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Validate seven-day one-request contract
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          path = Path('.github/api-tennis-range-probe-request.json')
          raw = path.read_bytes()
          request = json.loads(raw)
          expected = {
              'schema_version',
              'request_id',
              'date_start',
              'date_stop',
              'provider_request_budget',
          }
          if not isinstance(request, dict) or set(request) != expected:
              raise SystemExit('API-Tennis range probe request has unexpected fields')
          if request['schema_version'] != 'tennis-genome-api-tennis-range-probe-request-v1':
              raise SystemExit('unsupported API-Tennis range probe request schema')
          request_id = str(request['request_id'])
          if re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', request_id) is None:
              raise SystemExit('request_id has unsupported format')
          try:
              start = date.fromisoformat(str(request['date_start']))
              stop = date.fromisoformat(str(request['date_stop']))
          except ValueError as exc:
              raise SystemExit('range dates must use YYYY-MM-DD') from exc
          span_days = (stop - start).days + 1
          if span_days != 7:
              raise SystemExit('first API-Tennis range probe must span exactly seven days')
          if request['provider_request_budget'] != 1:
              raise SystemExit('API-Tennis range probe must spend exactly one request')
          if os.environ.get('GITHUB_REF_NAME') != 'main':
              raise SystemExit('API-Tennis range probe must run from main')
          if os.environ.get('GITHUB_REPOSITORY') != 'AidanDCM/Tennis-Genome-':
              raise SystemExit('unexpected repository')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'request_id={request_id}\n')
              handle.write(f'date_start={start.isoformat()}\n')
              handle.write(f'date_stop={stop.isoformat()}\n')
              handle.write(f'request_sha256={hashlib.sha256(raw).hexdigest()}\n')
          PY

      - name: Require API-Tennis credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_TENNIS_API:-}"

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Execute exactly one seven-day fixtures request
        env:
          DATE_START: ${{ steps.request.outputs.date_start }}
          DATE_STOP: ${{ steps.request.outputs.date_stop }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_api_tennis_range.py \
            --date-start "${DATE_START}" \
            --date-stop "${DATE_STOP}" \
            --output-dir api-tennis-range-probe \
            | tee range-probe-summary.json

      - name: Verify request budget and range invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('api-tennis-range-probe/audit.json').read_text(encoding='utf-8'))
          manifest = json.loads(
              Path('api-tennis-range-probe/manifest.json').read_text(encoding='utf-8')
          )
          if audit.get('provider_request_count') != 1:
              raise SystemExit('provider request count is not exactly one')
          if audit.get('span_days') != 7 or manifest.get('span_days') != 7:
              raise SystemExit('range probe did not retain the frozen seven-day span')
          if audit.get('historical_actual_start_admissible') is not False:
              raise SystemExit('scheduled time may not be promoted to historical actual start')
          if manifest.get('historical_actual_start_admissible') is not False:
              raise SystemExit('manifest chronology policy mismatch')
          if not Path('api-tennis-range-probe/raw-fixtures.json').is_file():
              raise SystemExit('raw range evidence is missing')
          PY

      - name: Build GitHub provenance receipt
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          DATE_START: ${{ steps.request.outputs.date_start }}
          DATE_STOP: ${{ steps.request.outputs.date_stop }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          audit_bytes = Path('api-tennis-range-probe/audit.json').read_bytes()
          raw_bytes = Path('api-tennis-range-probe/raw-fixtures.json').read_bytes()
          audit = json.loads(audit_bytes)
          receipt = {
              'schema_version': 'tennis-genome-api-tennis-range-probe-github-receipt-v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_source_sha': os.environ['GITHUB_SHA'],
              'request_id': os.environ['REQUEST_ID'],
              'date_start': os.environ['DATE_START'],
              'date_stop': os.environ['DATE_STOP'],
              'request_sha256': os.environ['REQUEST_SHA256'],
              'provider_request_count': audit['provider_request_count'],
              'audit_file_sha256': hashlib.sha256(audit_bytes).hexdigest(),
              'audit_semantic_sha256': audit.get('semantic_sha256'),
              'raw_response_sha256': hashlib.sha256(raw_bytes).hexdigest(),
              'response_bytes': len(raw_bytes),
              'fixture_count': audit['fixture_count'],
              'atp_singles_count': audit['atp_singles_count'],
              'wta_singles_count': audit['wta_singles_count'],
              'created_at_utc': datetime.now(UTC).isoformat(),
          }
          Path('api-tennis-range-probe-github-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload range-probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-tennis-range-probe-${{ github.run_id }}
          path: |
            api-tennis-range-probe/
            range-probe-summary.json
            api-tennis-range-probe-github-receipt.json
          if-no-files-found: error
          retention-days: 90
