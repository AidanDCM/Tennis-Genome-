name: Tennis Genome POINTSIM Research

on:
  push:
    branches:
      - dev/pointsim-v1
    paths:
      - ".github/workflows/pointsim.yml"
      - "src/tennis_genome/experiments/pointsim.py"
      - "src/tennis_genome/simulation/**"
      - "src/tennis_genome/ratings/serve_return.py"
      - "src/tennis_genome/experiments/genome_neighborhood.py"
      - "src/tennis_genome/features/**"
      - "src/tennis_genome/profiles/**"
      - "src/tennis_genome/models/**"
      - "src/tennis_genome/data/**"
      - "tests/test_point_simulation.py"
      - "tests/test_pointsim_experiment.py"
      - "research/installment_01/pointsim*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointsim-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout Tennis Genome
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Assert spent 2026 holdout is excluded
        shell: bash
        run: |
          set -euo pipefail
          test "$START_YEAR" = "2000"
          test "$END_YEAR" = "2025"

      - name: Download pinned 2000-2025 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/atp data/research_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            for tour in atp wta; do
              filename="${tour}_matches_${year}.csv"
              url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/${tour}/${filename}"
              curl --fail --location --silent --show-error --retry 3 \
                --output "data/research_raw/${tour}/${filename}" "$url"
            done
          done
          test "$(find data/research_raw -type f | wc -l)" -eq 52

      - name: Build canonical ATP and WTA datasets
        shell: bash
        run: |
          set -euo pipefail
          for tour in atp wta; do
            mkdir -p "data/research_processed/${tour}"
            args=()
            for year in $(seq "$START_YEAR" "$END_YEAR"); do
              args+=(--input "data/research_raw/${tour}/${tour}_matches_${year}.csv")
            done
            upper=$(echo "$tour" | tr '[:lower:]' '[:upper:]')
            python -m tennis_genome.pipeline.build_dataset \
              "${args[@]}" \
              --tour "$upper" \
              --output-dir "data/research_processed/${tour}" \
              --source-id "sackmann-archive-${ARCHIVE_COMMIT}-${tour}-${START_YEAR}-${END_YEAR}" \
              --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
              --source-version "$ARCHIVE_COMMIT" \
              --license-name "$LICENSE_NAME" \
              --license-url "$LICENSE_URL" \
              --allowed-use-status research_allowed \
              > "data/research_processed/${tour}/build_output.json"
          done

      - name: Run POINTSIM-001 ATP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pointsim
          python -m tennis_genome.experiments.pointsim \
            --manifest data/research_processed/atp/atp_manifest.json \
            --pre-match data/research_processed/atp/atp_pre_match.parquet \
            --outcomes data/research_processed/atp/atp_outcomes.parquet \
            --stats data/research_processed/atp/atp_stats.parquet \
            --tour ATP \
            --min-core-train-matches 1000 \
            --min-model-train-rows 1000 \
            > artifacts/pointsim/pointsim_atp.json

      - name: Run POINTSIM-001 WTA
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.pointsim \
            --manifest data/research_processed/wta/wta_manifest.json \
            --pre-match data/research_processed/wta/wta_pre_match.parquet \
            --outcomes data/research_processed/wta/wta_outcomes.parquet \
            --stats data/research_processed/wta/wta_stats.parquet \
            --tour WTA \
            --min-core-train-matches 1000 \
            --min-model-train-rows 1000 \
            > artifacts/pointsim/pointsim_wta.json

      - name: Copy provenance manifests
        shell: bash
        run: |
          set -euo pipefail
          cp data/research_processed/atp/atp_manifest.json artifacts/pointsim/
          cp data/research_processed/wta/wta_manifest.json artifacts/pointsim/

      - name: Write POINTSIM-001 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/pointsim")
          loaded = [
              ("ATP", json.loads((root / "pointsim_atp.json").read_text())),
              ("WTA", json.loads((root / "pointsim_wta.json").read_text())),
          ]
          lines = [
              "# POINTSIM-001",
              "",
              "Pinned source: `Aneeshers/tennis-sackmann-archive@83733587353df8a41f2fd4f516147d5aa83f5a8d`",
              "",
              "Coverage: **2000-2025 only**. The spent partial-2026 holdout remains excluded.",
              "",
              "## Promotion gates",
              "",
              "| Tour | OOF N | Format coverage | H-018A mechanics | H-018B incremental | Mechanics year wins | Incremental year wins |",
              "|---|---:|---:|---|---|---:|---:|",
          ]
          for label, data in loaded:
              a = data["mechanics_gate"]
              b = data["incremental_gate"]
              lines.append(
                  f"| {label} | {data['oof_population_n']} | {data['supported_format_coverage']:.2%} | "
                  f"{a['passed']} | {b['passed']} | "
                  f"{a['joint_year_win_count']}/{a['evaluated_year_count']} | "
                  f"{b['joint_year_win_count']}/{b['evaluated_year_count']} |"
              )

          lines.extend([
              "",
              "## Aggregate probability quality",
              "",
              "| Tour | Model | Brier | Log loss | Accuracy | ECE-10 |",
              "|---|---|---:|---:|---:|---:|",
          ])
          for label, data in loaded:
              for key, name in (
                  ("same_input_control", "S0 same-input statistical"),
                  ("pointsim", "S1 POINTSIM"),
                  ("core_control", "M0 Core recalibration"),
                  ("core_plus_pointsim", "M1 Core + POINTSIM"),
              ):
                  score = data[key]
                  lines.append(
                      f"| {label} | {name} | {score['brier']:.6f} | "
                      f"{score['log_loss']:.6f} | {score['accuracy']:.4%} | "
                      f"{score['ece_10']:.6f} |"
                  )

          lines.append("")
          lines.append(
              "POINTSIM-001 is historical probability-development evidence only; "
              "it is not a market or profitability test."
          )
          summary = "\n".join(lines) + "\n"
          (root / "SUMMARY.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload POINTSIM-001 reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-pointsim
          path: artifacts/pointsim/
          if-no-files-found: warn
          retention-days: 30
