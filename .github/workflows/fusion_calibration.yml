name: Tennis Genome Fusion Calibration Research

on:
  push:
    branches:
      - dev/ensemble-cal-v1
    paths:
      - ".github/workflows/fusion_calibration.yml"
      - "src/tennis_genome/experiments/fusion_calibration.py"
      - "src/tennis_genome/experiments/genome_adversarial_controls.py"
      - "src/tennis_genome/experiments/genome_neighborhood.py"
      - "src/tennis_genome/calibration/**"
      - "src/tennis_genome/features/**"
      - "src/tennis_genome/neighbors/**"
      - "src/tennis_genome/profiles/**"
      - "src/tennis_genome/models/**"
      - "src/tennis_genome/ratings/**"
      - "src/tennis_genome/data/**"
      - "tests/test_fusion_calibration.py"
      - "research/installment_01/fusion_calibration*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-calibration-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout Tennis Genome
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Assert spent 2026 holdout is excluded
        shell: bash
        run: |
          set -euo pipefail
          test "$START_YEAR" = "2000"
          test "$END_YEAR" = "2025"

      - name: Download pinned 2000-2025 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/atp data/research_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            for tour in atp wta; do
              filename="${tour}_matches_${year}.csv"
              url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/${tour}/${filename}"
              curl --fail --location --silent --show-error --retry 3 \
                --output "data/research_raw/${tour}/${filename}" "$url"
            done
          done
          test "$(find data/research_raw -type f | wc -l)" -eq 52

      - name: Build canonical ATP and WTA datasets
        shell: bash
        run: |
          set -euo pipefail
          for tour in atp wta; do
            mkdir -p "data/research_processed/${tour}"
            args=()
            for year in $(seq "$START_YEAR" "$END_YEAR"); do
              args+=(--input "data/research_raw/${tour}/${tour}_matches_${year}.csv")
            done
            upper=$(echo "$tour" | tr '[:lower:]' '[:upper:]')
            python -m tennis_genome.pipeline.build_dataset \
              "${args[@]}" \
              --tour "$upper" \
              --output-dir "data/research_processed/${tour}" \
              --source-id "sackmann-archive-${ARCHIVE_COMMIT}-${tour}-${START_YEAR}-${END_YEAR}" \
              --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
              --source-version "$ARCHIVE_COMMIT" \
              --license-name "$LICENSE_NAME" \
              --license-url "$LICENSE_URL" \
              --allowed-use-status research_allowed \
              > "data/research_processed/${tour}/build_output.json"
          done

      - name: Run FUSION-CAL-001 ATP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fusion_calibration
          python -m tennis_genome.experiments.fusion_calibration \
            --manifest data/research_processed/atp/atp_manifest.json \
            --pre-match data/research_processed/atp/atp_pre_match.parquet \
            --outcomes data/research_processed/atp/atp_outcomes.parquet \
            --stats data/research_processed/atp/atp_stats.parquet \
            --tour ATP \
            --min-core-train-matches 1000 \
            --min-neighbor-pool 1000 \
            --min-meta-train-rows 1000 \
            --min-fusion-train-rows 1000 \
            --min-calibration-rows 1000 \
            > artifacts/fusion_calibration/fusion_cal_atp.json

      - name: Run FUSION-CAL-001 WTA
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.fusion_calibration \
            --manifest data/research_processed/wta/wta_manifest.json \
            --pre-match data/research_processed/wta/wta_pre_match.parquet \
            --outcomes data/research_processed/wta/wta_outcomes.parquet \
            --stats data/research_processed/wta/wta_stats.parquet \
            --tour WTA \
            --min-core-train-matches 1000 \
            --min-neighbor-pool 1000 \
            --min-meta-train-rows 1000 \
            --min-fusion-train-rows 1000 \
            --min-calibration-rows 1000 \
            > artifacts/fusion_calibration/fusion_cal_wta.json

      - name: Copy provenance manifests
        shell: bash
        run: |
          set -euo pipefail
          cp data/research_processed/atp/atp_manifest.json artifacts/fusion_calibration/
          cp data/research_processed/wta/wta_manifest.json artifacts/fusion_calibration/

      - name: Write FUSION-CAL-001 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/fusion_calibration")
          loaded = [
              ("ATP", json.loads((root / "fusion_cal_atp.json").read_text())),
              ("WTA", json.loads((root / "fusion_cal_wta.json").read_text())),
          ]
          lines = [
              "# FUSION-CAL-001",
              "",
              "Pinned source: `Aneeshers/tennis-sackmann-archive@83733587353df8a41f2fd4f516147d5aa83f5a8d`",
              "",
              "Coverage: **2000-2025 only**. The spent partial-2026 holdout remains excluded.",
              "",
              "## Fusion gate",
              "",
              "F1 is the alignment-only chronological recalibration control. F3 is the two-view Core + alignment fusion model.",
              "",
              "| Tour | Alignment | N | F0 Brier | F1 Brier | F3 Brier | F3-F1 ΔB | F0 LL | F1 LL | F3 LL | F3-F1 ΔLL | Joint year wins | Recent Brier gate | Recent LL gate | Fusion pass |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|---|",
          ]
          for label, data in loaded:
              c = data["comparison"]
              g = data["fusion_gate"]
              lines.append(
                  f"| {label} | {data['alignment_representation']} | {c['n']} | "
                  f"{c['f0']['brier']:.6f} | {c['f1']['brier']:.6f} | {c['f3']['brier']:.6f} | "
                  f"{c['f3_vs_f1_brier_improvement']:+.6f} | {c['f0']['log_loss']:.6f} | "
                  f"{c['f1']['log_loss']:.6f} | {c['f3']['log_loss']:.6f} | "
                  f"{c['f3_vs_f1_log_loss_improvement']:+.6f} | "
                  f"{g['joint_year_win_count']}/{g['evaluated_year_count']} | "
                  f"{g['recent_brier_not_worse']} | {g['recent_log_loss_not_worse']} | {g['passed']} |"
              )

          lines.extend([
              "",
              "## Architecture decision",
              "",
              "| Tour | Fusion promoted | Probability candidate | Calibration candidate |",
              "|---|---|---|---|",
          ])
          for label, data in loaded:
              d = data["architecture_decision"]
              lines.append(
                  f"| {label} | {d['fusion_promoted']} | {d['selected_probability_candidate']} | {d['selected_calibrator']} |"
              )

          lines.extend([
              "",
              "## Calibration promotion matrix",
              "",
              "| Tour | Candidate | Selected | Method | Brier | LL | ECE10 | ΔB vs Identity | ΔLL vs Identity | Year wins | Recent ΔB | Recent ΔLL | Pass |",
              "|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|",
          ])
          for label, data in loaded:
              for candidate in data["calibration"]:
                  for method in candidate["methods"]:
                      rb = method["recent_brier_improvement_vs_identity"]
                      rl = method["recent_log_loss_improvement_vs_identity"]
                      rb_text = "n/a" if rb is None else f"{rb:+.6f}"
                      rl_text = "n/a" if rl is None else f"{rl:+.6f}"
                      selected = method["name"] == candidate["selected_calibrator"]
                      lines.append(
                          f"| {label} | {candidate['candidate']} | {selected} | {method['name']} | "
                          f"{method['score']['brier']:.6f} | {method['score']['log_loss']:.6f} | "
                          f"{method['score']['ece_10']:.6f} | "
                          f"{method['aggregate_brier_improvement_vs_identity']:+.6f} | "
                          f"{method['aggregate_log_loss_improvement_vs_identity']:+.6f} | "
                          f"{method['joint_year_win_count']}/{method['evaluated_year_count']} | "
                          f"{rb_text} | {rl_text} | {method['passed_promotion_gate']} |"
                      )

          lines.extend([
              "",
              "This is historical development evidence only. Fusion is not independent model diversification, the calibration decision is not forward-confirmed, and no market/profitability claim is tested here.",
          ])
          summary = "\n".join(lines) + "\n"
          (root / "SUMMARY.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload FUSION-CAL-001 reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-fusion-calibration
          path: artifacts/fusion_calibration/
          if-no-files-found: warn
          retention-days: 30
