name: Bookmaker real-data QA

on:
  workflow_dispatch:
  push:
    branches:
      - dev/bookmaker-real-source-preflight-v1
    paths:
      - "src/tennis_genome/market/providers/bookmaker_historical.py"
      - "tests/test_bookmaker_historical.py"
      - "research/installment_01/market_book_001_amendment_001.md"
      - "scripts/run_bookmaker_real_qa.sh"
      - ".github/workflows/bookmaker_real_qa.yml"

permissions:
  contents: read

jobs:
  bookmaker-real-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Run outcome-blind real bookmaker QA
        run: bash scripts/run_bookmaker_real_qa.sh

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-real-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bookmaker-real/source-manifest.json
            ${{ runner.temp }}/bookmaker-real/market-book-001/market_book_001_records.jsonl
            ${{ runner.temp }}/bookmaker-real/market-book-001/market_book_001_summary.json
            ${{ runner.temp }}/bookmaker-real/market_book_qa_001.json
            ${{ runner.temp }}/canonical-processed/atp/atp_manifest.json
            ${{ runner.temp }}/canonical-processed/wta/wta_manifest.json
            ${{ runner.temp }}/canonical-combined/pre_match.parquet
            ${{ runner.temp }}/canonical-combined/outcomes.parquet
          retention-days: 90
          if-no-files-found: error
