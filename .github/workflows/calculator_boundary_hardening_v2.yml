name: Calculator boundary hardening v2

on:
  push:
    branches:
      - dev/calculator-boundary-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .[dev]
      - name: Fix redundant patcher assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_calculator_boundary_hardening.py')
          text = p.read_text()
          block = '''replace_once(
              "src/tennis_genome/calculator/market.py",
              \'\'\'        "player_a_id": calculation.player_a_id,\\n        "player_b_id": calculation.player_b_id,\\n\'\'\',
              \'\'\'        "player_a_id": selection_a_id,\\n        "player_b_id": selection_b_id,\\n\'\'\',
          )
          '''
          if text.count(block) != 1:
              raise SystemExit(f'expected redundant block once, found {text.count(block)}')
          p.write_text(text.replace(block, '', 1))
          PY
      - name: Apply boundary hardening
        run: python scripts/apply_calculator_boundary_hardening.py
      - name: Format touched code
        run: |
          ruff format \
            src/tennis_genome/calculator/types.py \
            src/tennis_genome/calculator/io.py \
            src/tennis_genome/calculator/cli.py \
            src/tennis_genome/calculator/contract.py \
            src/tennis_genome/calculator/engine.py \
            src/tennis_genome/calculator/market.py \
            src/tennis_genome/experiments/pattern_confirm_live.py \
            tests/test_matchup_calculator.py \
            tests/test_matchup_calculator_contract.py \
            tests/test_matchup_calculator_io.py \
            tests/test_manual_market_comparison.py \
            tests/test_pattern_confirm_live.py
      - name: Targeted regressions
        run: |
          pytest -q \
            tests/test_matchup_calculator.py \
            tests/test_matchup_calculator_contract.py \
            tests/test_matchup_calculator_io.py \
            tests/test_manual_market_comparison.py \
            tests/test_pattern_confirm_live.py
      - name: Ruff
        run: ruff check .
      - name: Full pytest
        run: pytest -q
      - name: Remove one-shot machinery
        run: |
          rm scripts/apply_calculator_boundary_hardening.py
          rm .github/workflows/calculator_boundary_hardening.yml
          rm .github/workflows/calculator_boundary_hardening_v2.yml
      - name: Commit verified hardening
        run: |
          git config user.name 'Aidan Miller'
          git config user.email 'aidandcmiller@live.com'
          git add -A
          git commit -m 'Harden calculator inputs, market identity, and live settlement'
          git push origin HEAD:dev/calculator-boundary-hardening
