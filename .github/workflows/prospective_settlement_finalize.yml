name: Prospective Trusted Settlement Finalize

on:
  workflow_dispatch:
    inputs:
      prediction_artifact_id:
        description: Artifact containing the immutable prospective prediction store
        required: true
        type: string
      provider_artifact_id:
        description: Artifact containing the authenticated pre-match provider batch store
        required: true
        type: string
      settlement_artifact_id:
        description: Artifact from the trusted settlement capture workflow
        required: true
        type: string
      prediction_record_sha256:
        description: Immutable prediction record SHA-256
        required: true
        type: string
      prediction_anchor_comment_id:
        description: Canonical trusted pre-match prediction anchor comment ID
        required: true
        type: string
      settlement_comment_id:
        description: Canonical trusted settlement anchor comment ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREDICTION_ARTIFACT_ID: ${{ inputs.prediction_artifact_id }}
      PROVIDER_ARTIFACT_ID: ${{ inputs.provider_artifact_id }}
      SETTLEMENT_ARTIFACT_ID: ${{ inputs.settlement_artifact_id }}
      PREDICTION_RECORD_SHA256: ${{ inputs.prediction_record_sha256 }}
      PREDICTION_ANCHOR_COMMENT_ID: ${{ inputs.prediction_anchor_comment_id }}
      SETTLEMENT_COMMENT_ID: ${{ inputs.settlement_comment_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Validate immutable finalization inputs
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import os
          import re

          if os.environ.get("GITHUB_REF_NAME") != "main":
              raise SystemExit("trusted settlement finalizer must run from main")
          if os.environ.get("GITHUB_REPOSITORY") != "AidanDCM/Tennis-Genome-":
              raise SystemExit("unexpected repository")
          for key in (
              "PREDICTION_ARTIFACT_ID",
              "PROVIDER_ARTIFACT_ID",
              "SETTLEMENT_ARTIFACT_ID",
              "PREDICTION_ANCHOR_COMMENT_ID",
              "SETTLEMENT_COMMENT_ID",
          ):
              value = os.environ[key].strip()
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  raise SystemExit(f"{key} must be a positive integer")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["PREDICTION_RECORD_SHA256"]) is None:
              raise SystemExit("PREDICTION_RECORD_SHA256 must be lowercase SHA-256")
          PY

      - name: Download retained immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prediction-artifact provider-artifact settlement-artifact finalized
          download_artifact() {
            artifact_id="$1"
            zip_path="$2"
            out_dir="$3"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$zip_path"
            unzip -q "$zip_path" -d "$out_dir"
          }
          download_artifact "$PREDICTION_ARTIFACT_ID" prediction.zip prediction-artifact
          download_artifact "$PROVIDER_ARTIFACT_ID" provider.zip provider-artifact
          download_artifact "$SETTLEMENT_ARTIFACT_ID" settlement.zip settlement-artifact
          test -f "prediction-artifact/prediction-work/prospective-pilot-store/records/00000001-${PREDICTION_RECORD_SHA256}.json"
          test -f provider-artifact/trusted-provider-capture/provider-batch-store/records/00000001-5f23498164f45f03c2d79133e4e28d59d3ff51dd0ef105d70cd760bc3458ad10.json
          test -f settlement-artifact/github_comment_id.txt
          test -f settlement-artifact/github_comment_response.json
          test -f settlement-artifact/sportradar_timeline.json
          test -f settlement-artifact/sportradar_response_headers.json
          test -f settlement-artifact/trusted_settlement_receipt.json
          observed_comment_id=$(tr -d '\r\n' < settlement-artifact/github_comment_id.txt)
          test "$observed_comment_id" = "$SETTLEMENT_COMMENT_ID"
          sha256sum prediction.zip provider.zip settlement.zip | tee finalized/input-artifact-sha256.txt

      - name: Re-attest original trusted pre-match prediction anchor
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.prospective.prediction_anchor_live attest \
            --pilot-store prediction-artifact/prediction-work/prospective-pilot-store \
            --live-store finalized/live-prediction-anchor-store \
            --prediction-record-sha256 "$PREDICTION_RECORD_SHA256" \
            --github-comment-id "$PREDICTION_ANCHOR_COMMENT_ID" \
            | tee finalized/prediction-anchor-attest.json

      - name: Admit authenticated trusted settlement and append pilot settlement
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.prospective.settlement_capture_live admit \
            --pilot-store prediction-artifact/prediction-work/prospective-pilot-store \
            --prediction-anchor-store finalized/live-prediction-anchor-store \
            --provider-batch-store provider-artifact/trusted-provider-capture/provider-batch-store \
            --trusted-settlement-store finalized/trusted-settlement-store \
            --prediction-record-sha256 "$PREDICTION_RECORD_SHA256" \
            --github-comment-id "$SETTLEMENT_COMMENT_ID" \
            --timeline settlement-artifact/sportradar_timeline.json \
            --response-headers settlement-artifact/sportradar_response_headers.json \
            | tee finalized/trusted-settlement-admit.json

      - name: Re-verify complete prospective and trusted chains
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.prospective.pilot verify \
            --store prediction-artifact/prediction-work/prospective-pilot-store \
            | tee finalized/pilot-verify.json
          python -m tennis_genome.prospective.prediction_anchor_live verify \
            --pilot-store prediction-artifact/prediction-work/prospective-pilot-store \
            --live-store finalized/live-prediction-anchor-store \
            | tee finalized/prediction-anchor-verify.json
          python -m tennis_genome.prospective.settlement_capture_live verify \
            --pilot-store prediction-artifact/prediction-work/prospective-pilot-store \
            --prediction-anchor-store finalized/live-prediction-anchor-store \
            --provider-batch-store provider-artifact/trusted-provider-capture/provider-batch-store \
            --trusted-settlement-store finalized/trusted-settlement-store \
            | tee finalized/trusted-settlement-verify.json

      - name: Build verified settlement dossier and scoring metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          from tennis_genome.evaluation.metrics import binary_log_loss, brier_score
          from tennis_genome.prospective.pilot import ProspectivePilotStore

          pilot = ProspectivePilotStore(
              Path("prediction-artifact/prediction-work/prospective-pilot-store")
          )
          report = pilot.verify()
          records = pilot.records()
          prediction_sha = os.environ["PREDICTION_RECORD_SHA256"]
          prediction = next(
              record
              for record in records
              if record.get("record_type") == "PREDICTION_COMMIT"
              and record.get("record_sha256") == prediction_sha
          )
          settlement = next(
              record
              for record in records
              if record.get("record_type") == "SETTLEMENT"
              and record.get("prediction_record_sha256") == prediction_sha
          )
          trusted_report = json.loads(
              Path("finalized/trusted-settlement-verify.json").read_text(encoding="utf-8")
          )
          live_anchor_report = json.loads(
              Path("finalized/prediction-anchor-verify.json").read_text(encoding="utf-8")
          )
          timeline = json.loads(
              Path("settlement-artifact/sportradar_timeline.json").read_text(encoding="utf-8")
          )
          p_a = float(prediction["final_probability_a"])
          outcome_a = int(settlement["winner_player_id"] == prediction["player_a_id"])
          predicted_a = p_a >= 0.5
          correctness = int(predicted_a == bool(outcome_a))
          brier = brier_score([outcome_a], [p_a])
          log_loss = binary_log_loss([outcome_a], [p_a])
          qualified = bool(settlement["primary_evaluation_eligible"])
          qualified_n = sum(
              1
              for record in records
              if record.get("record_type") == "SETTLEMENT"
              and bool(record.get("primary_evaluation_eligible"))
          )
          if int(trusted_report["primary_evaluation_eligible_count"]) != qualified_n:
              raise SystemExit("trusted/pilot qualified settlement counts disagree")
          if qualified and int(trusted_report["trusted_settlement_count"]) < qualified_n:
              raise SystemExit("qualified pilot settlement lacks trusted settlement proof")
          if not math.isfinite(brier) or not math.isfinite(log_loss):
              raise SystemExit("non-finite scoring metric")

          status = timeline.get("sport_event_status") or {}
          dossier = {
              "schema_version": "full-stack-forward-verified-settlement-dossier-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "finalizer_workflow_source_sha": os.environ["GITHUB_SHA"],
              "finalizer_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "prediction_artifact_id": int(os.environ["PREDICTION_ARTIFACT_ID"]),
              "provider_artifact_id": int(os.environ["PROVIDER_ARTIFACT_ID"]),
              "settlement_artifact_id": int(os.environ["SETTLEMENT_ARTIFACT_ID"]),
              "prediction_record_sha256": prediction_sha,
              "prediction_anchor_comment_id": int(os.environ["PREDICTION_ANCHOR_COMMENT_ID"]),
              "settlement_comment_id": int(os.environ["SETTLEMENT_COMMENT_ID"]),
              "match_id": prediction["match_id"],
              "prediction_id": prediction["prediction_id"],
              "player_a_id": prediction["player_a_id"],
              "player_b_id": prediction["player_b_id"],
              "p_player_a": p_a,
              "p_player_b": float(prediction["final_probability_b"]),
              "predicted_winner_player_id": (
                  prediction["player_a_id"] if predicted_a else prediction["player_b_id"]
              ),
              "winner_player_id": settlement["winner_player_id"],
              "provider_winner_sportradar_id": status.get("winner_id"),
              "provider_status": status.get("status"),
              "period_scores": status.get("period_scores"),
              "actual_start": settlement["actual_start"],
              "timing_status": settlement["timing_status"],
              "anchor_status": settlement["anchor_status"],
              "finish_status": settlement["finish_status"],
              "primary_evaluation_eligible": qualified,
              "correctness": correctness,
              "brier_score": brier,
              "log_loss": log_loss,
              "qualified_forward_n": qualified_n,
              "pilot_report": report,
              "live_prediction_anchor_report": live_anchor_report,
              "trusted_settlement_report": trusted_report,
          }
          rendered = json.dumps(dossier, indent=2, sort_keys=True) + "\n"
          path = Path("finalized/verified-settlement-dossier.json")
          path.write_text(rendered, encoding="utf-8")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("finalized/verified-settlement-dossier.sha256").write_text(
              f"{digest}\n", encoding="utf-8"
          )
          print(rendered, end="")
          PY

      - name: Upload complete verified settlement state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-stack-forward-verified-settlement
          path: |
            finalized/
            prediction-artifact/prediction-work/prospective-pilot-store/
            settlement-artifact/trusted_settlement_receipt.json
            settlement-artifact/github_comment_response.json
            settlement-artifact/github_comment_id.txt
            settlement-artifact/sportradar_timeline.json
            settlement-artifact/sportradar_response_headers.json
          if-no-files-found: error
          retention-days: 90
