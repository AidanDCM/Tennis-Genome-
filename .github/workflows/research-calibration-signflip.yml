name: Research-only WTA calibration sign-flip
on:
  push:
    branches:
      - research/2026-11-09-calibration-audit
    paths:
      - scripts/research_calibration_signflip_real.py
      - tests/test_research_calibration_signflip_real.py
      - .github/workflows/research-calibration-signflip.yml
  workflow_dispatch:
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute real-data read-only sign-flip sensitivity
        run: python scripts/research_calibration_signflip_real.py --repo-root . | tee date-cluster-sensitivity.json
      - name: Upload read-only sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-date-cluster-sensitivity
          path: date-cluster-sensitivity.json
          if-no-files-found: warn
