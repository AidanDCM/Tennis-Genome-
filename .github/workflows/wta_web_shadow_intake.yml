name: WTA Web Shadow Intake

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: wta-web-shadow-intake
  cancel-in-progress: false

jobs:
  acquire-and-propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse parallel or orphan intake proposals
        id: pr_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_count="$(
            gh pr list \
              --state open \
              --limit 100 \
              --json headRefName \
              --jq '[.[] | select(
                .headRefName
                | startswith("automation/wta-web-shadow-intake-")
              )] | length'
          )"
          if [ "${open_count}" -gt 0 ]; then
            echo "blocked=true" >> "${GITHUB_OUTPUT}"
            echo "An intake proposal is already open; leaving it immutable."
            exit 0
          fi

          orphan_branches=()
          while IFS= read -r remote_ref; do
            [ -n "${remote_ref}" ] || continue
            branch="${remote_ref#origin/}"
            prior_pr_count="$(
              gh pr list \
                --state all \
                --head "${branch}" \
                --limit 1 \
                --json number \
                --jq 'length'
            )"
            if [ "${prior_pr_count}" -gt 0 ]; then
              echo "Cleaning stale intake branch with an existing closed/merged PR: ${branch}"
              git push origin --delete "${branch}"
              continue
            fi
            orphan_branches+=("${branch}")
          done < <(
            git for-each-ref \
              --format='%(refname:short)' \
              'refs/remotes/origin/automation/wta-web-shadow-intake-*'
          )

          if [ "${#orphan_branches[@]}" -gt 0 ]; then
            echo "blocked=true" >> "${GITHUB_OUTPUT}"
            echo "An unpublished intake proposal branch already exists:" >&2
            printf '  %s\n' "${orphan_branches[@]}" >&2
            echo "Open or delete that proposal before acquiring another snapshot." >&2
            exit 0
          fi

          echo "blocked=false" >> "${GITHUB_OUTPUT}"

      - name: Set acquisition identity
        id: stamp
        if: steps.pr_gate.outputs.blocked != 'true'
        shell: bash
        run: |
          set -euo pipefail
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          snapshot_id="$(date -u +'wta-%Y%m%dt%H%M%Sz')"
          source_root="${RUNNER_TEMP}/wta-source-${GITHUB_RUN_ID}"
          echo "observed_at=${observed_at}" >> "${GITHUB_OUTPUT}"
          echo "snapshot_id=${snapshot_id}" >> "${GITHUB_OUTPUT}"
          echo "source_root=${source_root}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v5
        if: steps.pr_gate.outputs.blocked != 'true'
        with:
          python-version: "3.11.16"
          check-latest: false
          cache: "pip"
          cache-dependency-path: requirements/ci.lock

      - name: Install pinned runtime
        if: steps.pr_gate.outputs.blocked != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Fetch retained official WTA sources
        if: steps.pr_gate.outputs.blocked != 'true'
        shell: bash
        env:
          OBSERVED_AT: ${{ steps.stamp.outputs.observed_at }}
          SOURCE_ROOT: ${{ steps.stamp.outputs.source_root }}
        run: |
          set -euo pipefail
          python -m scripts.fetch_web_shadow_wta_source \
            --config web-shadow/intake-config.json \
            --source-root "${SOURCE_ROOT}" \
            --observed-at "${OBSERVED_AT}" \
            --manifest-out "${SOURCE_ROOT}/acquisition-manifest.json"

      - name: Build deterministic intake proposal
        id: intake
        if: steps.pr_gate.outputs.blocked != 'true'
        shell: bash
        env:
          OBSERVED_AT: ${{ steps.stamp.outputs.observed_at }}
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
          SOURCE_ROOT: ${{ steps.stamp.outputs.source_root }}
        run: |
          set -euo pipefail
          stdout="${RUNNER_TEMP}/wta-intake-stdout.json"
          stderr="${RUNNER_TEMP}/wta-intake-stderr.log"
          set +e
          python -m scripts.build_web_shadow_wta_intake \
            --config web-shadow/intake-config.json \
            --source-root "${SOURCE_ROOT}" \
            --repo-root . \
            --observed-at "${OBSERVED_AT}" \
            --snapshot-id "${SNAPSHOT_ID}" \
            > "${stdout}" 2> "${stderr}"
          status=$?
          set -e

          if [ "${status}" -ne 0 ]; then
            if grep -Fq \
              "deterministic WTA intake found no eligible unseen matches" \
              "${stderr}"; then
              echo "selected=false" >> "${GITHUB_OUTPUT}"
              echo "No eligible unseen matches in the frozen intake window."
              exit 0
            fi
            cat "${stderr}" >&2
            exit "${status}"
          fi

          cat "${stdout}"
          echo "selected=true" >> "${GITHUB_OUTPUT}"

      - name: Bind acquisition evidence to selected intake
        if: >-
          steps.pr_gate.outputs.blocked != 'true' &&
          steps.intake.outputs.selected == 'true'
        shell: bash
        env:
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
          SOURCE_ROOT: ${{ steps.stamp.outputs.source_root }}
        run: |
          set -euo pipefail
          evidence_root="web-shadow/intake-evidence/${SNAPSHOT_ID}"
          test -d "${evidence_root}"
          cp \
            "${SOURCE_ROOT}/acquisition-manifest.json" \
            "${evidence_root}/acquisition-manifest.json"
          cp \
            "${SOURCE_ROOT}"/tournament-index-*.json \
            "${evidence_root}/"

      - name: Verify full repository contract before proposal
        if: >-
          steps.pr_gate.outputs.blocked != 'true' &&
          steps.intake.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m pytest -q
          git diff --check

      - name: Upload acquisition attempt
        if: >-
          always() &&
          steps.pr_gate.outputs.blocked != 'true' &&
          steps.stamp.outputs.source_root != ''
        uses: actions/upload-artifact@v4
        with:
          name: wta-intake-source-${{ github.run_id }}
          path: ${{ steps.stamp.outputs.source_root }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit immutable intake proposal
        id: commit
        if: >-
          steps.pr_gate.outputs.blocked != 'true' &&
          steps.intake.outputs.selected == 'true'
        shell: bash
        env:
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          branch="automation/wta-web-shadow-intake-${SNAPSHOT_ID}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add \
            web-shadow/active-slate.json \
            web-shadow/fixtures \
            web-shadow/intake-evidence
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            echo "No repository changes survived intake validation."
            exit 0
          fi
          git commit -m "Refresh WTA Web Shadow intake ${SNAPSHOT_ID}"
          git push origin "${branch}"
          echo "selected=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open paper-only intake PR
        id: publish
        if: >-
          steps.commit.outputs.selected == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.commit.outputs.branch }}
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
          OBSERVED_AT: ${{ steps.stamp.outputs.observed_at }}
        run: |
          set -euo pipefail
          manifest="web-shadow/intake-evidence/${SNAPSHOT_ID}/intake-manifest.json"
          selected_count="$(jq -r '.selected_match_count' "${manifest}")"
          source_count="$(jq -r '.source_match_count' "${manifest}")"
          body="${RUNNER_TEMP}/wta-intake-pr.md"
          cat > "${body}" <<EOF
          Automated **non-production** WTA Web Shadow intake proposal.

          - Snapshot: \`${SNAPSHOT_ID}\`
          - Observed at: \`${OBSERVED_AT}\`
          - Raw official WTA rows: ${source_count}
          - Deterministically selected unseen matches: ${selected_count}
          - Tournament index role: audit/discovery only
          - Selection authority: \`web-shadow/intake-config.json\`
          - Merge policy: automatic only after the source, fixture, full-test,
            exact-head CI, and pre-start gates pass; otherwise the PR remains for review

          The official provider bytes, their SHA-256 values, the frozen
          selection manifest, and generated fixtures are retained in this PR.
          Merging this PR allows the existing
          \`WTA Web Shadow Slate\` workflow to run on \`main\`.
          EOF

          set +e
          pr_output="$(
            gh pr create \
              --base main \
              --head "${BRANCH_NAME}" \
              --title "Refresh WTA Web Shadow intake ${SNAPSHOT_ID}" \
              --body-file "${body}" \
              2>&1
          )"
          status=$?
          set -e

          if [ "${status}" -ne 0 ]; then
            echo "${pr_output}" >&2
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1"
            {
              echo "### WTA intake proposal requires manual PR publication"
              echo
              echo "GitHub preserved the validated proposal branch but blocked automated PR creation."
              echo
              echo "- Branch: \`${BRANCH_NAME}\`"
              echo "- Snapshot: \`${SNAPSHOT_ID}\`"
              echo "- Open PR: ${compare_url}"
              echo
              echo "The next scheduled intake run will stop at the orphan-branch gate rather than create a duplicate snapshot."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi

          echo "${pr_output}"
          echo "pr_number=$(gh pr view "${BRANCH_NAME}" --json number --jq .number)" >> "${GITHUB_OUTPUT}"
          echo "head_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Run CI on the exact intake commit
        if: steps.publish.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml \
            --ref "${BRANCH_NAME}" \
            -f intake_snapshot_id="${SNAPSHOT_ID}"
          ci_run_id=""
          for attempt in {1..30}; do
            ci_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title == \"CI ${SNAPSHOT_ID}\" and .head_sha == \"${HEAD_SHA}\") | .id" \
              | head -n 1)"
            [ -n "${ci_run_id}" ] && break
            sleep 4
          done
          if [ -z "${ci_run_id}" ]; then
            echo "::error::exact-head CI dispatch did not create an identifiable run"
            exit 1
          fi
          gh run watch "${ci_run_id}" --exit-status

      - name: Merge validated intake while predictions are still possible
        if: success() && steps.publish.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          pr_state="$(gh pr view "${PR_NUMBER}" --json state,headRefOid,baseRefName)"
          test "$(jq -r .state <<<"${pr_state}")" = "OPEN"
          test "$(jq -r .headRefOid <<<"${pr_state}")" = "${HEAD_SHA}"
          test "$(jq -r .baseRefName <<<"${pr_state}")" = "main"

          python -S - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          root = Path('web-shadow')
          manifest = json.loads((root / 'intake-evidence' / os.environ['SNAPSHOT_ID'] / 'intake-manifest.json').read_text())
          slate = json.loads((root / 'active-slate.json').read_text())
          selected = manifest['selected']
          paths = slate['fixture_paths']
          if (manifest['production_eligible'] is not False
                  or len(selected) != manifest['selected_match_count']
                  or not selected
                  or paths != [item['fixture_path'] for item in selected]
                  or len(set(paths)) != len(paths)):
              raise SystemExit('intake selection and active slate disagree')
          cutoff = datetime.now(UTC) + timedelta(minutes=10)
          future = 0
          for item in selected:
              path = Path(item['fixture_path'])
              if path.parts[:2] != ('web-shadow', 'fixtures') or '..' in path.parts:
                  raise SystemExit('fixture path escapes the paper-only lane')
              fixture = json.loads(path.read_text())
              if (fixture['match_id'] != item['match_id']
                      or fixture['scheduled_start'] != item['scheduled_start']
                      or fixture['tour'] != 'WTA'):
                  raise SystemExit('frozen fixture differs from intake selection')
              scheduled = datetime.fromisoformat(fixture['scheduled_start'])
              observed = datetime.fromisoformat(fixture['source_observed_at'])
              if observed >= scheduled:
                  raise SystemExit('official fixture observation was not pre-start')
              future += scheduled > cutoff
          if not future:
              raise SystemExit('no fixture has ten minutes of pre-start runway')
          print(f'{future} of {len(selected)} fixtures retain pre-start runway')
          PY

          # The intake job has already run Ruff and the full test suite on
          # these exact generated files. The slate runner independently skips
          # fixtures whose scheduled start has passed at prediction time.
          gh pr merge "${PR_NUMBER}" --squash --delete-branch

      - name: Run the merged slate and request its evidence freeze
        if: steps.publish.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          SNAPSHOT_ID: ${{ steps.stamp.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          merged_sha="$(gh pr view "${PR_NUMBER}" --json mergeCommit --jq .mergeCommit.oid)"
          [[ "${merged_sha}" =~ ^[0-9a-f]{40}$ ]]

          # GITHUB_TOKEN merges do not reliably produce a push-triggered
          # downstream workflow. Dispatch both stages explicitly.
          gh workflow run wta_web_shadow_slate.yml \
            --ref main \
            -f slate_path=web-shadow/active-slate.json \
            -f intake_snapshot_id="${SNAPSHOT_ID}"

          source_run_id=""
          for attempt in {1..30}; do
            source_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/wta_web_shadow_slate.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title == \"WTA Web Shadow Slate ${SNAPSHOT_ID}\" and .head_sha == \"${merged_sha}\") | .id" \
              | head -n 1)"
            [ -n "${source_run_id}" ] && break
            sleep 4
          done
          if [ -z "${source_run_id}" ]; then
            echo "::error::slate dispatch did not create an identifiable run"
            exit 1
          fi
          gh run watch "${source_run_id}" --exit-status
          gh workflow run wta_web_shadow_auto_freeze.yml \
            --ref main \
            -f source_run_id="${source_run_id}" \
            -f source_head_sha="${merged_sha}"
          echo "Dispatched evidence freeze for slate run ${source_run_id}." >> "${GITHUB_STEP_SUMMARY}"
