name: Recover Web Shadow Freeze 35758950241

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wta_web_shadow_freeze_recovery_35758950241.yml"

permissions:
  actions: read
  contents: write

jobs:
  recover-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "35758950241"
      SOURCE_HEAD_SHA: "66cf7a8f6664d5142b8c1493a61af823e34eaa0c"
      BOUND_ARTIFACT_ID: "10709640666"
      BOUND_ARTIFACT_SHA256: "72ca1acfd380390fe97611d4185377c3869cfa4d09ff590e3320528b86bab91d"
      EXPECTED_SLATE_ID: "2026-09-22-run-35758950241"
      RECOVERY_BRANCH: "ops/web-shadow-auto-freeze-35758950241"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse overwrite
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${RECOVERY_BRANCH}" >/dev/null 2>&1; then
            echo "recovery branch already exists: ${RECOVERY_BRANCH}" >&2
            exit 1
          fi
          if [ -d "web-shadow/slates/${EXPECTED_SLATE_ID}" ]; then
            echo "target slate is already frozen on main: ${EXPECTED_SLATE_ID}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          check-latest: false
          cache: "pip"
          cache-dependency-path: requirements/ci.lock

      - name: Install pinned runtime and test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Verify exact immutable bound artifact
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/actions/artifacts/${BOUND_ARTIFACT_ID}")"
          observed_name="$(jq -r '.name // empty' <<<"${metadata}")"
          observed_digest="$(jq -r '.digest // empty' <<<"${metadata}")"
          observed_run="$(jq -r '.workflow_run.id // empty' <<<"${metadata}")"
          observed_sha="$(jq -r '.workflow_run.head_sha // empty' <<<"${metadata}")"
          if [ "${observed_name}" != "web-shadow-bound-evidence-${SOURCE_RUN_ID}" ]; then
            echo "bound artifact name mismatch" >&2
            exit 1
          fi
          if [ "${observed_digest}" != "sha256:${BOUND_ARTIFACT_SHA256}" ]; then
            echo "bound artifact digest metadata mismatch" >&2
            exit 1
          fi
          if [ "${observed_run}" != "${SOURCE_RUN_ID}" ]; then
            echo "bound artifact workflow run mismatch" >&2
            exit 1
          fi
          if [ "${observed_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "bound artifact source SHA mismatch" >&2
            exit 1
          fi

      - name: Download exact bound artifact
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/web-shadow-bound-evidence.zip"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${BOUND_ARTIFACT_ID}/zip" \
            --output "${destination}"
          observed="$(sha256sum "${destination}" | awk '{print $1}')"
          if [ "${observed}" != "${BOUND_ARTIFACT_SHA256}" ]; then
            echo "downloaded bound artifact digest mismatch" >&2
            exit 1
          fi

      - name: Freeze bound evidence transactionally
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/web-shadow-freeze-summary.json"
          python -m scripts.freeze_web_shadow_bound_evidence \
            --artifact-zip "${RUNNER_TEMP}/web-shadow-bound-evidence.zip" \
            --repo-root . \
            --scorecard web-shadow/scorecard.json \
            --bound-artifact-id "${BOUND_ARTIFACT_ID}" \
            --bound-artifact-sha256 "${BOUND_ARTIFACT_SHA256}" \
            | tee "${summary}"
          slate_id="$(jq -r '.slate_id // empty' "${summary}")"
          raw_run_id="$(jq -r '.raw_workflow_run_id // empty' "${summary}")"
          source_sha="$(jq -r '.workflow_source_sha // empty' "${summary}")"
          predicted="$(jq -r '.predicted_target_count // empty' "${summary}")"
          if [ "${slate_id}" != "${EXPECTED_SLATE_ID}" ]; then
            echo "recovered slate ID mismatch" >&2
            exit 1
          fi
          if [ "${raw_run_id}" != "${SOURCE_RUN_ID}" ]; then
            echo "recovered source run mismatch" >&2
            exit 1
          fi
          if [ "${source_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "recovered source SHA mismatch" >&2
            exit 1
          fi
          if [ "${predicted}" != "6" ]; then
            echo "recovered prediction denominator mismatch" >&2
            exit 1
          fi
          echo "summary_path=${summary}" >> "${GITHUB_OUTPUT}"

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          slate_id = os.environ["EXPECTED_SLATE_ID"]
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "-z"]
          ).decode("utf-8")
          entries = [entry for entry in raw.split("\0") if entry]
          allowed_prefix = f"web-shadow/slates/{slate_id}/"
          saw_scorecard = False
          saw_slate = False
          for entry in entries:
              path = entry[3:]
              if " -> " in path:
                  raise SystemExit(f"recovery produced rename: {path}")
              if path == "web-shadow/scorecard.json":
                  saw_scorecard = True
                  continue
              if path.startswith(allowed_prefix):
                  saw_slate = True
                  continue
              raise SystemExit(f"recovery changed unexpected path: {path}")
          if not saw_scorecard or not saw_slate:
              raise SystemExit("recovery must change scorecard and one immutable slate")
          PY

      - name: Run full repository checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          pytest
          git diff --check

      - name: Commit preserved recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${RECOVERY_BRANCH}"
          git add web-shadow/scorecard.json "web-shadow/slates/${EXPECTED_SLATE_ID}"
          git diff --cached --check
          git commit -m "Freeze Web Shadow slate ${EXPECTED_SLATE_ID}"
          git push origin "HEAD:${RECOVERY_BRANCH}"
          compare_url="https://github.com/${REPO}/compare/main...${RECOVERY_BRANCH}?expand=1"
          {
            echo "## Web Shadow recovery branch ready"
            echo
            echo "Recovered immutable bound artifact ${BOUND_ARTIFACT_ID} into \`${RECOVERY_BRANCH}\`."
            echo
            echo "Manual review PR: ${compare_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload recovery summary
        uses: actions/upload-artifact@v4
        with:
          name: web-shadow-freeze-recovery-${{ github.run_id }}
          path: ${{ steps.freeze.outputs.summary_path }}
          if-no-files-found: error
          retention-days: 90
