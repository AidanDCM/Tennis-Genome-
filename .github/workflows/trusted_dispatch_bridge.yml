name: Trusted Workflow Dispatch Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/trusted-dispatch-request.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: trusted-workflow-dispatch-bridge
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate trusted dispatch request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          path = Path('.github/trusted-dispatch-request.json')
          raw = path.read_bytes()
          try:
              request = json.loads(raw)
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit('trusted dispatch request must be UTF-8 JSON') from exc
          if not isinstance(request, dict):
              raise SystemExit('trusted dispatch request must be an object')

          expected_top = {'schema_version', 'request_id', 'target_workflow', 'ref', 'inputs'}
          if set(request) != expected_top:
              raise SystemExit(
                  f'trusted dispatch request fields must equal {sorted(expected_top)}'
              )
          if request['schema_version'] != 'tennis-genome-trusted-dispatch-request-v1':
              raise SystemExit('unsupported trusted dispatch request schema')
          request_id = str(request['request_id'])
          if re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', request_id) is None:
              raise SystemExit('request_id has unsupported format')
          if request['ref'] != 'main':
              raise SystemExit('trusted dispatch target ref must be main')
          if os.environ.get('GITHUB_REF_NAME') != 'main':
              raise SystemExit('trusted dispatch bridge must run from main')
          if os.environ.get('GITHUB_REPOSITORY') != 'AidanDCM/Tennis-Genome-':
              raise SystemExit('unexpected repository')

          workflow = str(request['target_workflow'])
          inputs = request['inputs']
          if not isinstance(inputs, dict):
              raise SystemExit('trusted dispatch inputs must be an object')

          contracts = {
              'prospective_provider_capture_anchor.yml': {
                  'schedule_date',
                  'sportradar_access_level',
              },
              'prospective_evidence_anchor.yml': {
                  'prediction_record_sha256',
                  'chain_head_sha256',
              },
              'api_tennis_prospective_evidence.yml': {
                  'prediction_artifact_id',
                  'history_artifact_id',
              },
              'prospective_settlement_capture.yml': {
                  'prediction_record_sha256',
                  'identity_binding_sha256',
                  'sportradar_event_id',
                  'sportradar_access_level',
              },
              'prospective_settlement_finalize.yml': {
                  'prediction_artifact_id',
                  'provider_artifact_id',
                  'settlement_artifact_id',
                  'prediction_record_sha256',
                  'prediction_anchor_comment_id',
                  'settlement_comment_id',
              },
          }
          if workflow not in contracts:
              raise SystemExit('target workflow is not in the trusted allowlist')
          if set(inputs) != contracts[workflow]:
              raise SystemExit(
                  f'inputs for {workflow} must equal {sorted(contracts[workflow])}'
              )

          sha_re = re.compile(r'^[0-9a-f]{64}$')
          for key in (
              'prediction_record_sha256',
              'chain_head_sha256',
              'identity_binding_sha256',
          ):
              if key in inputs and sha_re.fullmatch(str(inputs[key])) is None:
                  raise SystemExit(f'{key} must be a lowercase SHA-256')
          if 'prediction_record_sha256' in inputs and 'chain_head_sha256' in inputs:
              if inputs['prediction_record_sha256'] != inputs['chain_head_sha256']:
                  raise SystemExit('prediction anchor requires prediction SHA == chain head')
          if 'sportradar_event_id' in inputs:
              if re.fullmatch(r'sr:sport_event:[0-9]+', str(inputs['sportradar_event_id'])) is None:
                  raise SystemExit('sportradar_event_id has unsupported format')
          if 'sportradar_access_level' in inputs:
              if inputs['sportradar_access_level'] not in {'trial', 'production'}:
                  raise SystemExit('sportradar_access_level must be trial or production')
          if 'schedule_date' in inputs:
              try:
                  parsed = date.fromisoformat(str(inputs['schedule_date']))
              except ValueError as exc:
                  raise SystemExit('schedule_date must be YYYY-MM-DD') from exc
              if parsed.isoformat() != str(inputs['schedule_date']):
                  raise SystemExit('schedule_date must use canonical YYYY-MM-DD form')
          for key in (
              'prediction_artifact_id',
              'history_artifact_id',
              'provider_artifact_id',
              'settlement_artifact_id',
              'prediction_anchor_comment_id',
              'settlement_comment_id',
          ):
              if key in inputs and re.fullmatch(r'[1-9][0-9]*', str(inputs[key])) is None:
                  raise SystemExit(f'{key} must be a positive integer')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'workflow={workflow}\n')
              handle.write(f'request_id={request_id}\n')
              handle.write(f'request_sha256={hashlib.sha256(raw).hexdigest()}\n')
              handle.write(
                  'payload='
                  + json.dumps({'ref': 'main', 'inputs': inputs}, separators=(',', ':'))
                  + '\n'
              )
          PY

      - name: Dispatch frozen trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ steps.request.outputs.workflow }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output dispatch-response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d "${PAYLOAD}")
          if [ "$code" != "204" ]; then
            cat dispatch-response.txt
            echo "::error::trusted workflow dispatch returned HTTP ${code}"
            exit 1
          fi
          printf 'trusted_dispatch_request_id=%s\n' "$REQUEST_ID"
          printf 'trusted_dispatch_request_sha256=%s\n' "$REQUEST_SHA256"
          printf 'trusted_dispatch_target=%s\n' "$TARGET_WORKFLOW"
          printf 'trusted_dispatch_target_ref=main\n'
