name: Tennis Genome Adversarial Controls

on:
  push:
    branches:
      - dev/genome-adversarial-controls
    paths:
      - ".github/workflows/genome_adversarial_controls.yml"
      - "src/tennis_genome/experiments/genome_adversarial_controls.py"
      - "src/tennis_genome/experiments/genome_neighborhood.py"
      - "src/tennis_genome/features/genome.py"
      - "src/tennis_genome/neighbors/**"
      - "src/tennis_genome/profiles/**"
      - "src/tennis_genome/features/foundational.py"
      - "src/tennis_genome/models/core_v1_spec.py"
      - "src/tennis_genome/models/feature_probability.py"
      - "src/tennis_genome/ratings/**"
      - "src/tennis_genome/data/**"
      - "research/installment_01/genome_adversarial_controls*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genome-adversarial-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout Tennis Genome
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Assert spent 2026 holdout is excluded
        shell: bash
        run: |
          set -euo pipefail
          test "$START_YEAR" = "2000"
          test "$END_YEAR" = "2025"

      - name: Download pinned 2000-2025 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/atp data/research_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            for tour in atp wta; do
              filename="${tour}_matches_${year}.csv"
              url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/${tour}/${filename}"
              curl --fail --location --silent --show-error --retry 3 \
                --output "data/research_raw/${tour}/${filename}" "$url"
            done
          done
          test "$(find data/research_raw -type f | wc -l)" -eq 52

      - name: Build canonical ATP and WTA datasets
        shell: bash
        run: |
          set -euo pipefail
          for tour in atp wta; do
            mkdir -p "data/research_processed/${tour}"
            args=()
            for year in $(seq "$START_YEAR" "$END_YEAR"); do
              args+=(--input "data/research_raw/${tour}/${tour}_matches_${year}.csv")
            done
            upper=$(echo "$tour" | tr '[:lower:]' '[:upper:]')
            python -m tennis_genome.pipeline.build_dataset \
              "${args[@]}" \
              --tour "$upper" \
              --output-dir "data/research_processed/${tour}" \
              --source-id "sackmann-archive-${ARCHIVE_COMMIT}-${tour}-${START_YEAR}-${END_YEAR}" \
              --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
              --source-version "$ARCHIVE_COMMIT" \
              --license-name "$LICENSE_NAME" \
              --license-url "$LICENSE_URL" \
              --allowed-use-status research_allowed \
              > "data/research_processed/${tour}/build_output.json"
          done

      - name: Run GENOME-ADV-001 ATP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/genome_adversarial_controls
          python -m tennis_genome.experiments.genome_adversarial_controls \
            --manifest data/research_processed/atp/atp_manifest.json \
            --pre-match data/research_processed/atp/atp_pre_match.parquet \
            --outcomes data/research_processed/atp/atp_outcomes.parquet \
            --stats data/research_processed/atp/atp_stats.parquet \
            --tour ATP \
            --min-core-train-matches 1000 \
            --min-neighbor-pool 1000 \
            --min-meta-train-rows 1000 \
            > artifacts/genome_adversarial_controls/genome_adv_atp.json

      - name: Run GENOME-ADV-001 WTA
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.genome_adversarial_controls \
            --manifest data/research_processed/wta/wta_manifest.json \
            --pre-match data/research_processed/wta/wta_pre_match.parquet \
            --outcomes data/research_processed/wta/wta_outcomes.parquet \
            --stats data/research_processed/wta/wta_stats.parquet \
            --tour WTA \
            --min-core-train-matches 1000 \
            --min-neighbor-pool 1000 \
            --min-meta-train-rows 1000 \
            > artifacts/genome_adversarial_controls/genome_adv_wta.json

      - name: Copy provenance manifests
        shell: bash
        run: |
          set -euo pipefail
          cp data/research_processed/atp/atp_manifest.json artifacts/genome_adversarial_controls/
          cp data/research_processed/wta/wta_manifest.json artifacts/genome_adversarial_controls/

      - name: Write GENOME-ADV-001 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/genome_adversarial_controls")
          reports = [
              ("ATP", "genome_adv_atp.json"),
              ("WTA", "genome_adv_wta.json"),
          ]
          loaded = [
              (label, json.loads((root / filename).read_text()))
              for label, filename in reports
          ]

          lines = [
              "# GENOME-ADV-001",
              "",
              "Pinned source: `Aneeshers/tennis-sackmann-archive@83733587353df8a41f2fd4f516147d5aa83f5a8d`",
              "",
              "Coverage: **2000-2025 only**. The spent partial-2026 holdout remains excluded.",
              "",
              "Primary k: **100** for probability-only, strict-Core-only, and full-Genome neighborhoods.",
              "",
              "## Matched-population probability quality",
              "",
              "| Tour | N | Calibration Brier | Probability-NN Brier | Core-NN Brier | Full Genome Brier | Full vs Prob ΔB | Full vs Core ΔB | Calibration LL | Probability-NN LL | Core-NN LL | Full Genome LL | Full vs Prob ΔLL | Full vs Core ΔLL |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for label, data in loaded:
              c = data["comparison"]
              lines.append(
                  f"| {label} | {c['n']} | {c['calibration_control']['brier']:.6f} | "
                  f"{c['probability_neighborhood']['brier']:.6f} | {c['core_neighborhood']['brier']:.6f} | "
                  f"{c['full_genome']['brier']:.6f} | {c['full_vs_probability_brier_improvement']:+.6f} | "
                  f"{c['full_vs_core_brier_improvement']:+.6f} | {c['calibration_control']['log_loss']:.6f} | "
                  f"{c['probability_neighborhood']['log_loss']:.6f} | {c['core_neighborhood']['log_loss']:.6f} | "
                  f"{c['full_genome']['log_loss']:.6f} | {c['full_vs_probability_log_loss_improvement']:+.6f} | "
                  f"{c['full_vs_core_log_loss_improvement']:+.6f} |"
              )

          lines.extend([
              "",
              "## Registered interpretation gates",
              "",
              "| Tour | Gate A: full > probability-only | Gate A year wins | Gate B: full > Core-only | Gate B year wins | Interpretation |",
              "|---|---|---:|---|---:|---|",
          ])
          for label, data in loaded:
              p = data["promotion_diagnostics"]
              a = p["gate_a_full_vs_probability"]
              b = p["gate_b_full_vs_core"]
              lines.append(
                  f"| {label} | {a['passed']} | {a['joint_year_win_count']}/{a['evaluated_year_count']} | "
                  f"{b['passed']} | {b['joint_year_win_count']}/{b['evaluated_year_count']} | "
                  f"{p['interpretation_class']} |"
              )

          lines.extend([
              "",
              "## Residual signal diagnostics",
              "",
              "| Tour | Representation | N | Slope | Q5-Q1 Core residual | Recent slope | Recent Q5-Q1 |",
              "|---|---|---:|---:|---:|---:|---:|",
          ])
          for label, data in loaded:
              for key, display, recent_key in [
                  ("probability_signal", "Probability-only", "recent_probability_signal"),
                  ("core_signal", "Strict Core", "recent_core_signal"),
                  ("full_genome_signal", "Full Genome", "recent_full_genome_signal"),
              ]:
                  signal = data[key]
                  recent = data[recent_key]
                  slope = signal["residual_slope_on_signal"]
                  spread = signal["top_minus_bottom_core_residual"]
                  rslope = None if recent is None else recent["residual_slope_on_signal"]
                  rspread = None if recent is None else recent["top_minus_bottom_core_residual"]
                  lines.append(
                      f"| {label} | {display} | {signal['n']} | "
                      f"{('n/a' if slope is None else f'{slope:.6f}')} | "
                      f"{('n/a' if spread is None else f'{spread:.6f}')} | "
                      f"{('n/a' if rslope is None else f'{rslope:.6f}')} | "
                      f"{('n/a' if rspread is None else f'{rspread:.6f}')} |"
                  )

          lines.extend([
              "",
              "This is historical adversarial development evidence only. It is not independent forward confirmation and is not a market/profitability test.",
          ])
          summary = "\n".join(lines) + "\n"
          (root / "SUMMARY.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload GENOME-ADV-001 reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-adversarial-controls
          path: artifacts/genome_adversarial_controls/
          if-no-files-found: warn
          retention-days: 30
