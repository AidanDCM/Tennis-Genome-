name: PATTERN-CONFIRM Season Capture Autofix

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_season_capture_autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format src/tennis_genome/experiments/pattern_confirm_sportradar_client.py src/tennis_genome/experiments/pattern_confirm_sportradar_pipeline.py src/tennis_genome/experiments/pattern_confirm_sportradar_source_package.py src/tennis_genome/experiments/pattern_confirm_sportradar_state_capture.py tests/test_pattern_confirm_sportradar_client.py tests/test_pattern_confirm_sportradar_pipeline.py tests/test_pattern_confirm_sportradar_source_package.py tests/test_pattern_confirm_sportradar_state_capture.py
          ruff check --fix src/tennis_genome/experiments/pattern_confirm_sportradar_client.py src/tennis_genome/experiments/pattern_confirm_sportradar_pipeline.py src/tennis_genome/experiments/pattern_confirm_sportradar_source_package.py src/tennis_genome/experiments/pattern_confirm_sportradar_state_capture.py tests/test_pattern_confirm_sportradar_client.py tests/test_pattern_confirm_sportradar_pipeline.py tests/test_pattern_confirm_sportradar_source_package.py tests/test_pattern_confirm_sportradar_state_capture.py
          ruff check .
          pytest
      - name: Commit formatting fixes
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add src/tennis_genome/experiments/pattern_confirm_sportradar_client.py src/tennis_genome/experiments/pattern_confirm_sportradar_pipeline.py src/tennis_genome/experiments/pattern_confirm_sportradar_source_package.py src/tennis_genome/experiments/pattern_confirm_sportradar_state_capture.py tests/test_pattern_confirm_sportradar_client.py tests/test_pattern_confirm_sportradar_pipeline.py tests/test_pattern_confirm_sportradar_source_package.py tests/test_pattern_confirm_sportradar_state_capture.py
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "Format and verify complete season-state capture"
            git push origin HEAD:dev/pattern-confirm-provider-dryrun
          fi
