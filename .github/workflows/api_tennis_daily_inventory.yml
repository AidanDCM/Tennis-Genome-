name: API-Tennis Daily Fixture Inventory

on:
  workflow_dispatch:
    inputs:
      schedule_date:
        description: UTC fixture date in YYYY-MM-DD form
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: api-tennis-daily-inventory-${{ inputs.schedule_date }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      API_TENNIS_API: ${{ secrets.API_TENNIS_API }}
      SCHEDULE_DATE: ${{ inputs.schedule_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Validate date, credential, and duplicate guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_TENNIS_API:-}"
          python -S - <<'PY'
          import os
          from datetime import date

          raw = os.environ["SCHEDULE_DATE"]
          parsed = date.fromisoformat(raw)
          if parsed.isoformat() != raw:
              raise SystemExit("schedule_date must use canonical YYYY-MM-DD")
          PY
          name="api-tennis-daily-inventory-${SCHEDULE_DATE}"
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "$count" -gt 0 ]; then
            echo "::error::daily API-Tennis inventory already exists for date"
            exit 1
          fi

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Capture exactly one complete daily fixture response
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_api_tennis_daily_inventory.py \
            --schedule-date "$SCHEDULE_DATE" \
            --output-dir api-tennis-daily-inventory \
            | tee api-tennis-daily-inventory/summary.json

      - name: Verify inventory contract
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("api-tennis-daily-inventory")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          filtered = json.loads(
              (root / "atp-wta-singles.json").read_text(encoding="utf-8")
          )
          if manifest["schedule_date"] != os.environ["SCHEDULE_DATE"]:
              raise SystemExit("inventory date mismatch")
          if manifest.get("provider_request_count") != 1:
              raise SystemExit("daily inventory did not use exactly one provider request")
          if manifest.get("query_event_type_filter") is not None:
              raise SystemExit("daily inventory unexpectedly used an event-type provider filter")
          if manifest.get("market_blind") is not True:
              raise SystemExit("daily inventory market-blind flag drifted")
          rows = filtered.get("result")
          if not isinstance(rows, list):
              raise SystemExit("ATP/WTA singles subset is malformed")
          allowed = {"atp singles", "wta singles"}
          for row in rows:
              event_type = str(row.get("event_type_type", "")).strip().casefold()
              if event_type not in allowed:
                  raise SystemExit("filtered inventory contains non ATP/WTA singles row")
              if str(row.get("event_date", "")) != os.environ["SCHEDULE_DATE"]:
                  raise SystemExit("filtered inventory contains a wrong-date row")
          if len(rows) != int(manifest["atp_wta_singles_count"]):
              raise SystemExit("filtered inventory count differs from manifest")
          PY

      - name: Build GitHub receipt
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("api-tennis-daily-inventory")
          manifest_bytes = (root / "manifest.json").read_bytes()
          manifest = json.loads(manifest_bytes)
          receipt = {
              "schema_version": "tennis-genome-api-tennis-daily-inventory-receipt-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_source_sha": os.environ["GITHUB_SHA"],
              "schedule_date": manifest["schedule_date"],
              "provider_request_count": manifest["provider_request_count"],
              "raw_sha256": manifest["raw_sha256"],
              "atp_wta_singles_sha256": manifest["atp_wta_singles_sha256"],
              "manifest_file_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
              "created_at_utc": datetime.now(UTC).isoformat(),
          }
          (root / "github-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained daily inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-tennis-daily-inventory-${{ inputs.schedule_date }}
          path: |
            api-tennis-daily-inventory/raw-fixtures.json
            api-tennis-daily-inventory/atp-wta-singles.json
            api-tennis-daily-inventory/manifest.json
            api-tennis-daily-inventory/summary.json
            api-tennis-daily-inventory/github-receipt.json
          if-no-files-found: error
          retention-days: 90
