name: Calibration Selective Prediction

on:
  push:
    branches:
      - dev/calibration-selective-prediction
    paths:
      - ".github/workflows/calibration_selective.yml"
      - "src/**"
      - "tests/**"
      - "research/installment_01/calibration_selective*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-selective-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout Tennis Genome
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Assert spent 2026 holdout is excluded
        shell: bash
        run: |
          set -euo pipefail
          test "$END_YEAR" = "2025"
          if grep -q 'END_YEAR: "2026"' .github/workflows/calibration_selective.yml; then
            echo "CAL-SEL-001 must not consume the spent 2026 holdout."
            exit 1
          fi

      - name: Download pinned 2000-2025 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/atp data/research_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            for tour in atp wta; do
              filename="${tour}_matches_${year}.csv"
              url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/${tour}/${filename}"
              curl --fail --location --silent --show-error --retry 3 \
                --output "data/research_raw/${tour}/${filename}" "$url"
            done
          done
          test "$(find data/research_raw -type f | wc -l)" -eq 52

      - name: Build canonical ATP and WTA datasets
        shell: bash
        run: |
          set -euo pipefail
          for tour in atp wta; do
            mkdir -p "data/research_processed/${tour}"
            args=()
            for year in $(seq "$START_YEAR" "$END_YEAR"); do
              args+=(--input "data/research_raw/${tour}/${tour}_matches_${year}.csv")
            done
            upper=$(echo "$tour" | tr '[:lower:]' '[:upper:]')
            python -m tennis_genome.pipeline.build_dataset \
              "${args[@]}" \
              --tour "$upper" \
              --output-dir "data/research_processed/${tour}" \
              --source-id "sackmann-archive-${ARCHIVE_COMMIT}-${tour}-${START_YEAR}-${END_YEAR}" \
              --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
              --source-version "$ARCHIVE_COMMIT" \
              --license-name "$LICENSE_NAME" \
              --license-url "$LICENSE_URL" \
              --allowed-use-status research_allowed \
              > "data/research_processed/${tour}/build_output.json"
          done

      - name: Run CAL-SEL-001 ATP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/calibration_selective
          python -m tennis_genome.experiments.calibration_selective \
            --manifest data/research_processed/atp/atp_manifest.json \
            --pre-match data/research_processed/atp/atp_pre_match.parquet \
            --outcomes data/research_processed/atp/atp_outcomes.parquet \
            --stats data/research_processed/atp/atp_stats.parquet \
            --tour ATP \
            --min-train-matches 1000 \
            --min-calibration-predictions 1000 \
            > artifacts/calibration_selective/cal_sel_atp.json

      - name: Run CAL-SEL-001 WTA
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.calibration_selective \
            --manifest data/research_processed/wta/wta_manifest.json \
            --pre-match data/research_processed/wta/wta_pre_match.parquet \
            --outcomes data/research_processed/wta/wta_outcomes.parquet \
            --stats data/research_processed/wta/wta_stats.parquet \
            --tour WTA \
            --min-train-matches 1000 \
            --min-calibration-predictions 1000 \
            > artifacts/calibration_selective/cal_sel_wta.json

      - name: Copy provenance manifests
        run: |
          cp data/research_processed/atp/atp_manifest.json artifacts/calibration_selective/
          cp data/research_processed/wta/wta_manifest.json artifacts/calibration_selective/

      - name: Write CAL-SEL-001 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/calibration_selective")
          lines = [
              "# CAL-SEL-001",
              "",
              "Pinned research source: `Aneeshers/tennis-sackmann-archive@83733587353df8a41f2fd4f516147d5aa83f5a8d`",
              "",
              "Coverage: 2000-2025 only. The spent partial-2026 holdout is excluded.",
              "",
              "## Calibration",
              "",
              "| Tour | Method | N | Brier | Log loss | ECE-10 | Accuracy | Recent Brier | Recent log loss | Recent ECE |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for tour in ("atp", "wta"):
              data = json.loads((root / f"cal_sel_{tour}.json").read_text())
              for method in data["calibrators"]:
                  score = method["score"]
                  recent = method["recent_score"]
                  lines.append(
                      f"| {tour.upper()} | {method['name']} | {score['n']} | "
                      f"{score['brier']:.6f} | {score['log_loss']:.6f} | "
                      f"{score['ece_10']:.6f} | {score['accuracy']:.4%} | "
                      f"{recent['brier']:.6f} | {recent['log_loss']:.6f} | "
                      f"{recent['ece_10']:.6f} |"
                  )

          lines.extend(["", "## Selective prediction (identity control)", ""])
          lines.append(
              "| Tour | Coverage | N | Accuracy | Brier | Log loss | ECE-10 | Mean favorite p | Favorite win rate |"
          )
          lines.append("|---|---:|---:|---:|---:|---:|---:|---:|---:|")
          for tour in ("atp", "wta"):
              data = json.loads((root / f"cal_sel_{tour}.json").read_text())
              identity = next(
                  item for item in data["selective_prediction"]
                  if item["calibrator"] == "identity"
              )
              for row in identity["coverage"]:
                  score = row["score"]
                  lines.append(
                      f"| {tour.upper()} | {row['requested_coverage']:.0%} | {row['n']} | "
                      f"{score['accuracy']:.4%} | {score['brier']:.6f} | "
                      f"{score['log_loss']:.6f} | {score['ece_10']:.6f} | "
                      f"{row['mean_favorite_probability']:.4%} | "
                      f"{row['realized_favorite_win_rate']:.4%} |"
                  )

          lines.extend(["", "## Disagreement quintiles", ""])
          lines.append(
              "| Tour | Quintile | N | Mean disagreement | Mean confidence | Brier | Log loss | Accuracy |"
          )
          lines.append("|---|---:|---:|---:|---:|---:|---:|---:|")
          for tour in ("atp", "wta"):
              data = json.loads((root / f"cal_sel_{tour}.json").read_text())
              for row in data["disagreement"]["by_disagreement_quintile"]:
                  score = row["strict_core_score"]
                  lines.append(
                      f"| {tour.upper()} | {row['quintile']} | {row['n']} | "
                      f"{row['mean_disagreement']:.6f} | "
                      f"{row['mean_probability_confidence']:.6f} | "
                      f"{score['brier']:.6f} | {score['log_loss']:.6f} | "
                      f"{score['accuracy']:.4%} |"
                  )

          summary = "\n".join(lines) + "\n"
          (root / "SUMMARY.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Upload CAL-SEL-001 reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-calibration-selective
          path: artifacts/calibration_selective/
          if-no-files-found: warn
          retention-days: 30
