name: PATTERN-CONFIRM-001 Final Input Hardening

on:
  push:
    branches: [dev/pattern-confirm-production-hardening]
    paths:
      - .github/workflows/pattern_confirm_final_input_hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-production-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin exact preregistered champion artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('src/tennis_genome/experiments/pattern_confirm_live.py')
          text = live.read_text()
          constants_marker = '''_EVENT_PROVIDER = "SPORTRADAR_TENNIS_V3"\n_REQUIRED_MATCH_STATE = "PREMATCH"\n'''
          constants = '''_EVENT_PROVIDER = "SPORTRADAR_TENNIS_V3"\n_FROZEN_PROFILE_ARTIFACT_SHA256 = (\n    "cc82e93a8465f9430b16316a1f9bf770951631de0aff7d17f8374e5cff523351"\n)\n_FROZEN_CORE_ARTIFACT_SHA256 = (\n    "5097257e2c7e5cf7225b4ce7fd08b405b494766d0c9126427f476fd7b952dbb7"\n)\n_FROZEN_MARKET_CORE_FIT_SHA256 = (\n    "622d07e4a5d010b927ddf1c37900868a61d2e81d67c287f2a41dddaf4932b732"\n)\n_REQUIRED_MATCH_STATE = "PREMATCH"\n'''
          if constants_marker not in text:
              raise SystemExit('expected live constants marker not found')
          text = text.replace(constants_marker, constants)

          function_marker = '''def _devig_probability(odds_a: float, odds_b: float) -> float:\n    q_a = 1.0 / odds_a\n    q_b = 1.0 / odds_b\n    return q_a / (q_a + q_b)\n\n\n'''
          function = '''def _devig_probability(odds_a: float, odds_b: float) -> float:\n    q_a = 1.0 / odds_a\n    q_b = 1.0 / odds_b\n    return q_a / (q_a + q_b)\n\n\ndef _require_frozen_model_contract(\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n) -> None:\n    if fit.artifact_sha256 != _FROZEN_MARKET_CORE_FIT_SHA256:\n        raise ValueError("Market+Core fit is not the frozen PATTERN-CONFIRM-001 champion")\n    if profile_artifact.artifact_sha256 != _FROZEN_PROFILE_ARTIFACT_SHA256:\n        raise ValueError("Profile artifact is not the frozen PATTERN-CONFIRM-001 champion")\n    if core_artifact.artifact_sha256 != _FROZEN_CORE_ARTIFACT_SHA256:\n        raise ValueError("Core artifact is not the frozen PATTERN-CONFIRM-001 champion")\n\n\n'''
          if function_marker not in text:
              raise SystemExit('expected de-vig function marker not found')
          text = text.replace(function_marker, function)

          verify_marker = '''def verify_live_record(\n    payload: dict[str, object],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    identity_mapping: IdentityMapping,\n) -> LiveProspectiveRecord:\n    stored = str(payload.get("record_sha256", ""))\n'''
          verify_replacement = '''def verify_live_record(\n    payload: dict[str, object],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    identity_mapping: IdentityMapping,\n) -> LiveProspectiveRecord:\n    _require_frozen_model_contract(fit, profile_artifact, core_artifact)\n    stored = str(payload.get("record_sha256", ""))\n'''
          if verify_marker not in text:
              raise SystemExit('expected verify_live_record marker not found')
          text = text.replace(verify_marker, verify_replacement)

          build_marker = '''def build_live_record(\n    raw: dict[str, object],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    identity_mapping: IdentityMapping,\n) -> LiveProspectiveRecord:\n    match_id = _required_text(raw, "match_id")\n'''
          build_replacement = '''def build_live_record(\n    raw: dict[str, object],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    identity_mapping: IdentityMapping,\n) -> LiveProspectiveRecord:\n    _require_frozen_model_contract(fit, profile_artifact, core_artifact)\n    match_id = _required_text(raw, "match_id")\n'''
          if build_marker not in text:
              raise SystemExit('expected build_live_record marker not found')
          text = text.replace(build_marker, build_replacement)

          evaluate_marker = '''def evaluate_live_family(\n    records: list[LiveProspectiveRecord],\n    settlements: dict[str, LiveSettlement],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    ledger_sha256: str,\n    settlement_sha256: str,\n) -> LiveConfirmationReport:\n    eligible_records: list[ProspectiveRecord] = []\n'''
          evaluate_replacement = '''def evaluate_live_family(\n    records: list[LiveProspectiveRecord],\n    settlements: dict[str, LiveSettlement],\n    *,\n    fit: FrozenMarketCoreFit,\n    profile_artifact: ProfileProductionArtifact,\n    core_artifact: CoreProductionArtifact,\n    ledger_sha256: str,\n    settlement_sha256: str,\n) -> LiveConfirmationReport:\n    _require_frozen_model_contract(fit, profile_artifact, core_artifact)\n    eligible_records: list[ProspectiveRecord] = []\n'''
          if evaluate_marker not in text:
              raise SystemExit('expected evaluate_live_family marker not found')
          text = text.replace(evaluate_marker, evaluate_replacement)

          load_marker = '''    fit = verify_fit_payload(json.loads(fit_path.read_text()))\n    profile = verify_profile_artifact(json.loads(profile_path.read_text()))\n    core = verify_core_artifact(json.loads(core_path.read_text()))\n    return fit, profile, core\n'''
          load_replacement = '''    fit = verify_fit_payload(json.loads(fit_path.read_text()))\n    profile = verify_profile_artifact(json.loads(profile_path.read_text()))\n    core = verify_core_artifact(json.loads(core_path.read_text()))\n    _require_frozen_model_contract(fit, profile, core)\n    return fit, profile, core\n'''
          if load_marker not in text:
              raise SystemExit('expected contract loader marker not found')
          live.write_text(text.replace(load_marker, load_replacement))

          tests = Path('tests/test_pattern_confirm_live.py')
          text = tests.read_text()
          text = text.replace(
              'from __future__ import annotations\n\nimport hashlib\n',
              'from __future__ import annotations\n\nimport hashlib\nfrom dataclasses import replace\n',
          )
          text = text.replace(
              'artifact_sha256="f" * 64,',
              'artifact_sha256="622d07e4a5d010b927ddf1c37900868a61d2e81d67c287f2a41dddaf4932b732",',
          )
          text = text.replace(
              'artifact_sha256="3" * 64,',
              'artifact_sha256="cc82e93a8465f9430b16316a1f9bf770951631de0aff7d17f8374e5cff523351",',
          )
          text = text.replace(
              'artifact_sha256="4" * 64,',
              'artifact_sha256="5097257e2c7e5cf7225b4ce7fd08b405b494766d0c9126427f476fd7b952dbb7",',
          )
          text = text.replace(
              '"profile_model_sha256": "3" * 64,',
              '"profile_model_sha256": "cc82e93a8465f9430b16316a1f9bf770951631de0aff7d17f8374e5cff523351",',
          )
          text = text.replace(
              '"core_model_sha256": "4" * 64,',
              '"core_model_sha256": "5097257e2c7e5cf7225b4ce7fd08b405b494766d0c9126427f476fd7b952dbb7",',
          )
          text = text.replace(
              'assert record.profile_model_sha256 == "3" * 64',
              'assert record.profile_model_sha256 == "cc82e93a8465f9430b16316a1f9bf770951631de0aff7d17f8374e5cff523351"',
          )
          text = text.replace(
              'assert record.core_model_sha256 == "4" * 64',
              'assert record.core_model_sha256 == "5097257e2c7e5cf7225b4ce7fd08b405b494766d0c9126427f476fd7b952dbb7"',
          )
          addition = '''\n\ndef test_exact_champion_artifact_hashes_are_runtime_pinned() -> None:\n    with pytest.raises(ValueError, match="Market\\+Core fit is not the frozen"):\n        build_live_record(\n            _raw(),\n            fit=replace(_fit(), artifact_sha256="9" * 64),\n            profile_artifact=_profile(),\n            core_artifact=_core(),\n            identity_mapping=_mapping(),\n        )\n    with pytest.raises(ValueError, match="Profile artifact is not the frozen"):\n        build_live_record(\n            _raw(),\n            fit=_fit(),\n            profile_artifact=replace(_profile(), artifact_sha256="9" * 64),\n            core_artifact=_core(),\n            identity_mapping=_mapping(),\n        )\n    with pytest.raises(ValueError, match="Core artifact is not the frozen"):\n        build_live_record(\n            _raw(),\n            fit=_fit(),\n            profile_artifact=_profile(),\n            core_artifact=replace(_core(), artifact_sha256="9" * 64),\n            identity_mapping=_mapping(),\n        )\n'''
          if 'def test_exact_champion_artifact_hashes_are_runtime_pinned' not in text:
              text += addition
          tests.write_text(text)
          PY
      - name: Format, lint and test
        run: |
          pip install -e .[dev]
          ruff format src/tennis_genome/experiments/pattern_confirm_live.py tests/test_pattern_confirm_live.py
          ruff check --fix src/tennis_genome/experiments/pattern_confirm_live.py tests/test_pattern_confirm_live.py
          ruff check .
          pytest
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add src/tennis_genome/experiments/pattern_confirm_live.py tests/test_pattern_confirm_live.py
          git commit -m "Pin exact PATTERN-CONFIRM champion artifact hashes"
          git push origin HEAD:dev/pattern-confirm-production-hardening
