name: Challenger Shadow Dispatch Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/challenger-shadow-request.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: challenger-shadow-dispatch-bridge
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate challenger shadow request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          path = Path('.github/challenger-shadow-request.json')
          raw = path.read_bytes()
          try:
              request = json.loads(raw)
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit('challenger shadow request must be UTF-8 JSON') from exc
          expected = {'schema_version', 'request_id', 'prediction_artifact_id'}
          if not isinstance(request, dict) or set(request) != expected:
              raise SystemExit(f'challenger shadow request fields must equal {sorted(expected)}')
          if request['schema_version'] != 'tennis-genome-challenger-shadow-request-v1':
              raise SystemExit('unsupported challenger shadow request schema')
          request_id = str(request['request_id'])
          if re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', request_id) is None:
              raise SystemExit('request_id has unsupported format')
          artifact_id = str(request['prediction_artifact_id'])
          if re.fullmatch(r'[1-9][0-9]*', artifact_id) is None:
              raise SystemExit('prediction_artifact_id must be a positive integer')
          if os.environ.get('GITHUB_REF_NAME') != 'main':
              raise SystemExit('challenger shadow bridge must run from main')
          if os.environ.get('GITHUB_REPOSITORY') != 'AidanDCM/Tennis-Genome-':
              raise SystemExit('unexpected repository')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'request_id={request_id}\n')
              handle.write(f'request_sha256={hashlib.sha256(raw).hexdigest()}\n')
              handle.write(f'artifact_id={artifact_id}\n')
          PY

      - name: Dispatch trusted shadow workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python -S - <<'PY'
          import json
          import os
          print(json.dumps({
              'ref': 'main',
              'inputs': {'prediction_artifact_id': os.environ['ARTIFACT_ID']},
          }, separators=(',', ':')))
          PY
          )
          code=$(curl --silent --show-error --output dispatch-response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/challenger_shadow_from_prediction_artifact.yml/dispatches" \
            -d "$payload")
          if [ "$code" != "204" ]; then
            cat dispatch-response.txt
            echo "::error::challenger shadow dispatch returned HTTP ${code}"
            exit 1
          fi
          printf 'challenger_shadow_request_id=%s\n' "$REQUEST_ID"
          printf 'challenger_shadow_request_sha256=%s\n' "$REQUEST_SHA256"
          printf 'challenger_shadow_prediction_artifact_id=%s\n' "$ARTIFACT_ID"
