name: WTA Live Lint Cleanup 001

on:
  push:
    branches:
      - dev/wta-live-prediction-001
    paths:
      - ".github/workflows/wta_live_lint_cleanup_001.yml"

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/wta-live-prediction-001
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned CI tools
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Clean temporary live prediction scripts
        shell: bash
        run: |
          set -euo pipefail
          ruff check scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py --fix --exit-zero
          ruff format scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py
          python - <<'PY'
          from pathlib import Path

          p1 = Path("scripts/wta_live_prediction_001.py")
          s1 = p1.read_text(encoding="utf-8")
          replacements1 = {
              '            f"Parry provider history mapping incomplete: {target_player_accepted[PARRY_SR]}/{target_player_seen[PARRY_SR]}"\n': (
                  '            "Parry provider history mapping incomplete: "\n'
                  '            f"{target_player_accepted[PARRY_SR]}/{target_player_seen[PARRY_SR]}"\n'
              ),
              '            f"Stearns provider history mapping incomplete: {target_player_accepted[STEARNS_SR]}/{target_player_seen[STEARNS_SR]}"\n': (
                  '            "Stearns provider history mapping incomplete: "\n'
                  '            f"{target_player_accepted[STEARNS_SR]}/{target_player_seen[STEARNS_SR]}"\n'
              ),
              '    prediction_id = f"FULL-STACK-FORWARD-001-{TARGET_EVENT_ID.replace(\':\', \'-\')}-{created_at.strftime(\'%Y%m%dT%H%M%SZ\')}"\n': (
                  '    prediction_id = (\n'
                  '        f"FULL-STACK-FORWARD-001-{TARGET_EVENT_ID.replace(\':\', \'-\')}-"\n'
                  '        f"{created_at.strftime(\'%Y%m%dT%H%M%SZ\')}"\n'
                  '    )\n'
              ),
          }
          for old, new in replacements1.items():
              if old not in s1:
                  raise SystemExit(f"expected _001 formatting target missing: {old!r}")
              s1 = s1.replace(old, new, 1)
          p1.write_text(s1, encoding="utf-8")

          p2 = Path("scripts/wta_live_prediction_002.py")
          s2 = p2.read_text(encoding="utf-8")
          replacements2 = {
              '                f"{label} provider-history accounting mismatch: accepted={target_player_accepted[sr_id]} exclusions={dict(exclusions)} seen={target_player_seen[sr_id]}"\n': (
                  '                f"{label} provider-history accounting mismatch: "\n'
                  '                f"accepted={target_player_accepted[sr_id]} "\n'
                  '                f"exclusions={dict(exclusions)} "\n'
                  '                f"seen={target_player_seen[sr_id]}"\n'
              ),
              '    prediction_id = f"FULL-STACK-FORWARD-001-{h.TARGET_EVENT_ID.replace(\':\', \'-\')}-{created_at.strftime(\'%Y%m%dT%H%M%SZ\')}"\n': (
                  '    prediction_id = (\n'
                  '        f"FULL-STACK-FORWARD-001-{h.TARGET_EVENT_ID.replace(\':\', \'-\')}-"\n'
                  '        f"{created_at.strftime(\'%Y%m%dT%H%M%SZ\')}"\n'
                  '    )\n'
              ),
          }
          for old, new in replacements2.items():
              if old not in s2:
                  raise SystemExit(f"expected _002 formatting target missing: {old!r}")
              s2 = s2.replace(old, new, 1)
          p2.write_text(s2, encoding="utf-8")
          PY
          ruff format scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py
          ruff check .
          pytest
      - name: Commit verified lint-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py
          git commit -m "Clean WTA live prediction lint without semantic changes"
          git push origin HEAD:dev/wta-live-prediction-001
