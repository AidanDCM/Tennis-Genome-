name: WTA Live Lint Cleanup 001

on:
  push:
    branches:
      - dev/wta-live-prediction-001
    paths:
      - ".github/workflows/wta_live_lint_cleanup_001.yml"

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/wta-live-prediction-001
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned CI tools
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Clean temporary live prediction scripts
        shell: bash
        run: |
          set -euo pipefail
          ruff check scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py --fix
          ruff format scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py
          ruff check .
          pytest
      - name: Commit verified lint-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/wta_live_prediction_001.py scripts/wta_live_prediction_002.py
          git commit -m "Clean WTA live prediction lint without semantic changes"
          git push origin HEAD:dev/wta-live-prediction-001
