name: WTA Forward 002 Stephens-Tjen Lock

on:
  push:
    branches:
      - dev/wta-live-prediction-002
    paths:
      - ".github/forward-002-trigger.txt"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: wta-forward-002-stephens-tjen
  cancel-in-progress: false

jobs:
  capture-predict-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONPATH: src
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: trial
      SCHEDULE_DATE: "2026-09-16"
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Require provider credential and exact UTC capture date
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPORTRADAR_API_KEY:-}"
          test "$(date -u +%F)" = "$SCHEDULE_DATE"
      - name: Capture complete authenticated Sportradar Sep 16 batch
        shell: bash
        run: |
          set -euo pipefail
          python -S -m tennis_genome.prospective.trusted_provider_capture \
            --output-dir trusted-provider-capture \
            --schedule-date "${SCHEDULE_DATE}" \
            --access-level "${SPORTRADAR_ACCESS_LEVEL}"
      - name: Build trusted provider anchor receipt
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from tennis_genome.prospective.provider_batch_operator import ANCHOR_INPUT_FIELDS
          from tennis_genome.prospective.trusted_provider_capture import (
              TRUSTED_CAPTURE_SCHEMA,
              TRUSTED_CAPTURE_WORKFLOW_PATH,
          )

          capture_dir = Path("trusted-provider-capture")
          packet = json.loads((capture_dir / "anchor_packet.json").read_text(encoding="utf-8"))
          capture_receipt_bytes = (capture_dir / "trusted_capture_receipt.json").read_bytes()
          capture_receipt = json.loads(capture_receipt_bytes)
          inputs = packet.get("inputs")
          if not isinstance(inputs, dict) or set(inputs) != set(ANCHOR_INPUT_FIELDS):
              raise SystemExit("trusted capture anchor packet input contract drifted")
          if inputs["schedule_date"] != os.environ["SCHEDULE_DATE"]:
              raise SystemExit("trusted capture schedule date differs from workflow input")
          if capture_receipt.get("schema_version") != TRUSTED_CAPTURE_SCHEMA:
              raise SystemExit("trusted capture receipt schema drifted")
          if capture_receipt.get("workflow_path") != TRUSTED_CAPTURE_WORKFLOW_PATH:
              raise SystemExit("trusted capture receipt workflow path drifted")
          if capture_receipt.get("access_level") != os.environ["SPORTRADAR_ACCESS_LEVEL"]:
              raise SystemExit("trusted capture access level differs from workflow input")

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          receipt = {
              "schema_version": "full-stack-forward-provider-batch-github-anchor-v1",
              "provider": "GITHUB_ACTIONS",
              "repository": repository,
              "workflow_source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(run_id),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_run_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "batch_record_sha256": inputs["batch_record_sha256"],
              "batch_chain_head_sha256": inputs["batch_chain_head_sha256"],
              "schedule_date": inputs["schedule_date"],
              "raw_payload_sha256": inputs["raw_payload_sha256"],
              "manifest_sha256": inputs["manifest_sha256"],
              "observed_at": inputs["observed_at"],
              "runner_receipt_created_at_utc": datetime.now(UTC).isoformat(),
              "trusted_capture_schema": TRUSTED_CAPTURE_SCHEMA,
              "trusted_capture_receipt_sha256": hashlib.sha256(capture_receipt_bytes).hexdigest(),
              "sportradar_access_level": os.environ["SPORTRADAR_ACCESS_LEVEL"],
              "forward_protocol": "FULL-STACK-FORWARD-002",
          }
          Path("provider_batch_anchor_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum provider_batch_anchor_receipt.json > provider_batch_anchor_receipt.sha256
      - name: Publish trusted provider capture anchor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_ISSUE_NUMBER: "111"
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          marker = "<!-- FULL-STACK-FORWARD-002-PROVIDER-BATCH-ANCHOR-V1 -->"
          receipt = json.loads(Path("provider_batch_anchor_receipt.json").read_text(encoding="utf-8"))
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
          body = f"{marker}\n```json\n{canonical}\n```"
          repository = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["LEDGER_ISSUE_NUMBER"]
          url = f"https://api.github.com/repos/{repository}/issues/{issue_number}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "tennis-genome-wta-forward-002-provider-capture",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              response_bytes = response.read()
          Path("provider_batch_anchor_comment.json").write_bytes(response_bytes)
          comment = json.loads(response_bytes.decode("utf-8"))
          expected_issue_url = f"https://api.github.com/repos/{repository}/issues/{issue_number}"
          actor = comment.get("user")
          if comment.get("issue_url") != expected_issue_url:
              raise SystemExit("trusted capture anchor was written to wrong ledger issue")
          if not isinstance(actor, dict) or actor.get("login") != "github-actions[bot]" or actor.get("type") != "Bot":
              raise SystemExit("trusted capture anchor actor is not github-actions[bot]")
          if comment.get("body") != body:
              raise SystemExit("trusted capture anchor comment body does not reproduce")
          if comment.get("updated_at") != comment.get("created_at"):
              raise SystemExit("new trusted capture anchor comment is unexpectedly edited")
          Path("provider_batch_anchor_comment_id.txt").write_text(f"{int(comment['id'])}\n", encoding="utf-8")
          PY
          sha256sum provider_batch_anchor_comment.json > provider_batch_anchor_comment.sha256
      - name: Install pinned prediction runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Download frozen 2000-2025 WTA source and player registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
              "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv" \
              --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv" \
            --output data/wta_players.csv
          test "$(find data/wta-live-raw -type f | wc -l)" -eq 26
      - name: Rebuild canonical frozen WTA history
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2025); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset \
            "${args[@]}" \
            --tour WTA \
            --output-dir data/wta-live-base \
            --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-2000-2025" \
            --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
            --source-version "$PINNED_ARCHIVE_COMMIT" \
            --license-name "CC BY-NC-SA 4.0" \
            --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/" \
            --allowed-use-status research_allowed \
            > data/wta-live-base/build_output.json
      - name: Stage trusted provider evidence for prediction binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted-provider-artifact
          cp -a trusted-provider-capture trusted-provider-artifact/trusted-provider-capture
      - name: Calculate and immutably commit Stephens-Tjen prediction
        id: prediction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/wta_live_prediction_forward_002.py | tee prediction-summary.json
          record=$(find prediction-work/prospective-pilot-store/records -type f -name '*.json' | sort | tail -1)
          prediction_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["record_sha256"])' "$record")
          chain_head=$(python - <<'PY'
          from pathlib import Path
          from tennis_genome.prospective.pilot import ProspectivePilotStore
          print(ProspectivePilotStore(Path("prediction-work/prospective-pilot-store")).verify()["chain_head_sha256"])
          PY
          )
          test "$prediction_sha" = "$chain_head"
          echo "prediction_sha=$prediction_sha" >> "$GITHUB_OUTPUT"
          echo "chain_head=$chain_head" >> "$GITHUB_OUTPUT"
      - name: Dispatch trusted prediction anchor on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICTION_SHA: ${{ steps.prediction.outputs.prediction_sha }}
          CHAIN_HEAD: ${{ steps.prediction.outputs.chain_head }}
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_record_sha256": os.environ["PREDICTION_SHA"],
                  "chain_head_sha256": os.environ["CHAIN_HEAD"],
              },
          }))
          PY
          )
          code=$(curl --silent --show-error --output prediction-anchor-dispatch-response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/prospective_evidence_anchor.yml/dispatches" \
            -d "$payload")
          test "$code" = "204"
          printf '%s\n' "$PREDICTION_SHA" > prediction-work/prediction-record-sha256.txt
          printf '%s\n' "$CHAIN_HEAD" > prediction-work/chain-head-sha256.txt
      - name: Upload complete forward 002 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wta-forward-002-stephens-tjen
          path: |
            trusted-provider-capture/
            provider_batch_anchor_receipt.json
            provider_batch_anchor_receipt.sha256
            provider_batch_anchor_comment.json
            provider_batch_anchor_comment.sha256
            provider_batch_anchor_comment_id.txt
            forward-002-target-resolution.json
            prediction-work/
            prediction-summary.json
            prediction-anchor-dispatch-response.txt
          if-no-files-found: warn
          retention-days: 90
