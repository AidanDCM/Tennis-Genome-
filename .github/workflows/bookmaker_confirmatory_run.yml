name: Bookmaker Confirmatory Validation

on:
  push:
    branches:
      - dev/bookmaker-real-source-preflight-v1
    paths:
      - ".github/workflows/bookmaker_confirmatory_run.yml"

permissions:
  contents: read
  actions: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  confirmatory:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .[dev]

      - name: Download frozen real bookmaker QA
        uses: actions/download-artifact@v4
        with:
          name: bookmaker-real-qa-e2faeb9794225f1b72f0f826620afaf4e4eb187d
          path: inputs/qa
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34616782073

      - name: Download accepted Profile Gap artifact
        uses: actions/download-artifact@v4
        with:
          name: tennis-genome-profile-gap
          path: inputs/profile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34427178193

      - name: Download accepted Genome adversarial artifact
        uses: actions/download-artifact@v4
        with:
          name: tennis-genome-adversarial-controls
          path: inputs/genome
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34433553870

      - name: Verify every frozen parent and market input hash
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/frozen.sha256 <<'EOF'
          532ff66304914f0962e5747f20790916c70e082efedba695d26717632db946fd  inputs/profile/profile_gap_atp_strict.json
          343903af5f53cd1d519ebafdabf6ddb2dd0645847ff77e1820a156caf012bc55  inputs/profile/profile_gap_wta_strict.json
          37671b15b4f7bb4db98767f09a10f57dd43eb61baeacd2aed0713e8a67b298fa  inputs/genome/genome_adv_atp.json
          08df00ce43bed558f8d479f14e74bdb05504864ab0c4310aa3f3979029d0e2a3  inputs/genome/genome_adv_wta.json
          0b02e33be720b9becff770d8527b25c3fe33f464bb4e83c7bf70f02715c16be6  inputs/qa/bookmaker-real/source-manifest.json
          6b8b04f7bf261bca68818260e62b00549012b5a9408a4a399544ac91c52fea4c  inputs/qa/bookmaker-real/market-book-001/market_book_001_records.jsonl
          9304c4c3208dc8ab2df9e96f57bef4c3f8be3df18440c2d019c3c11b356c5304  inputs/qa/bookmaker-real/market_book_qa_001.json
          557e579cd69b04b7436fee342d90d44a3a7e982f128b586ca0e6d1e01b0eec9e  inputs/qa/canonical-combined/pre_match.parquet
          c509dff1bbe4b1e10944f5b361138790f85ccdb21b7d12aafb03ddc0b1e8c63d  inputs/qa/canonical-combined/outcomes.parquet
          EOF
          sha256sum --check /tmp/frozen.sha256

      - name: Build the four result-free signal/Core projections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/signals
          python -m tennis_genome.experiments.market_signal_projection \
            --spec atp_profile_gap \
            --input inputs/profile/profile_gap_atp_strict.json \
            --output run/signals/profile_gap_atp.json > /dev/null
          python -m tennis_genome.experiments.market_signal_projection \
            --spec wta_profile_gap \
            --input inputs/profile/profile_gap_wta_strict.json \
            --output run/signals/profile_gap_wta.json > /dev/null
          python -m tennis_genome.experiments.market_signal_projection \
            --spec atp_genome \
            --input inputs/genome/genome_adv_atp.json \
            --output run/signals/genome_atp.json > /dev/null
          python -m tennis_genome.experiments.market_signal_projection \
            --spec wta_genome \
            --input inputs/genome/genome_adv_wta.json \
            --output run/signals/genome_wta.json > /dev/null

      - name: Verify projection-v2 firewall and self-digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          specs = {
              "run/signals/profile_gap_atp.json": ("profile_gap_match", "strict_core_probability"),
              "run/signals/profile_gap_wta.json": ("profile_gap_match", "strict_core_probability"),
              "run/signals/genome_atp.json": ("full_neighbor_residual", "core_probability_a"),
              "run/signals/genome_wta.json": ("core_neighbor_residual", "core_probability_a"),
          }
          forbidden = {"outcome_a", "winner", "score", "brier", "log_loss", "comparison"}
          for filename, (signal, core) in specs.items():
              payload = json.loads(Path(filename).read_text())
              assert payload["projection_version"] == "market-signal-projection-v2"
              assert payload["signal_field"] == signal
              assert payload["core_probability_field"] == core
              digest = payload["artifact_sha256"]
              unsigned = dict(payload)
              unsigned.pop("artifact_sha256")
              encoded = json.dumps(
                  unsigned,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              assert hashlib.sha256(encoded).hexdigest() == digest
              for row in payload["predictions"]:
                  assert set(row) == {"match_id", signal, core}
                  assert not forbidden.intersection(row)
          PY

      - name: Run frozen outcome-blind POWER-MDE-001
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.power_mde_bookmaker \
            --market-book-qa inputs/qa/bookmaker-real/market_book_qa_001.json \
            --market-book-records inputs/qa/bookmaker-real/market-book-001/market_book_001_records.jsonl \
            --pre-match inputs/qa/canonical-combined/pre_match.parquet \
            --profile-gap-atp run/signals/profile_gap_atp.json \
            --profile-gap-wta run/signals/profile_gap_wta.json \
            --genome-atp run/signals/genome_atp.json \
            --genome-wta run/signals/genome_wta.json \
            --min-prior-rows 1000 \
            --output run/power_mde_001.json > /dev/null

      - name: Assert POWER-MDE four-claim identifiability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("run/power_mde_001.json").read_text())
          assert payload["outcome_blind"] is True
          assert payload["family_size"] == 4
          assert payload["family_alpha"] == 0.05
          assert payload["conservative_planning_alpha"] == 0.0125
          assert len(payload["claims"]) == 4
          required = {2021, 2022, 2023, 2024, 2025}
          for claim in payload["claims"]:
              assert claim["min_prior_rows"] == 1000
              identifiable = {
                  int(plan["evaluation_year"])
                  for plan in claim["year_plans"]
                  if plan["identifiable"] is True
              }
              assert required.issubset(identifiable)
          PY

      - name: Create Stage-A outcome-lock seal
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.market_validation_bookmaker_run seal \
            --source-manifest inputs/qa/bookmaker-real/source-manifest.json \
            --market-book-records inputs/qa/bookmaker-real/market-book-001/market_book_001_records.jsonl \
            --pre-match inputs/qa/canonical-combined/pre_match.parquet \
            --market-book-qa inputs/qa/bookmaker-real/market_book_qa_001.json \
            --power-mde run/power_mde_001.json \
            --profile-gap-atp run/signals/profile_gap_atp.json \
            --profile-gap-wta run/signals/profile_gap_wta.json \
            --genome-atp run/signals/genome_atp.json \
            --genome-wta run/signals/genome_wta.json \
            --output run/outcome_unlock_seal.json > /dev/null

      - name: Verify Stage-A seal before opening outcomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          seal = json.loads(Path("run/outcome_unlock_seal.json").read_text())
          assert seal["stage"] == "OUTCOME_LOCKED_COMPLETE"
          assert seal["market_policy"] == "BOOKMAKER_CLOSE_V1"
          assert seal["qa_overall_status"] == "ELIGIBLE_CONFIRMATORY"
          assert set(seal["qa_tour_status"]) == {"ATP", "WTA"}
          assert all(value == "ELIGIBLE_CONFIRMATORY" for value in seal["qa_tour_status"].values())
          assert seal["qa_outcomes_sha256"] == "c509dff1bbe4b1e10944f5b361138790f85ccdb21b7d12aafb03ddc0b1e8c63d"
          assert len(seal["power_claims"]) == 4
          print(json.dumps({
              "stage": seal["stage"],
              "seal_sha256": seal["seal_sha256"],
              "power_mde_artifact_sha256": seal["power_mde_artifact_sha256"],
          }, sort_keys=True))
          PY

      - name: Open Stage B exactly once and run frozen four-claim family
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.market_validation_bookmaker_run run \
            --seal run/outcome_unlock_seal.json \
            --source-manifest inputs/qa/bookmaker-real/source-manifest.json \
            --market-book-records inputs/qa/bookmaker-real/market-book-001/market_book_001_records.jsonl \
            --pre-match inputs/qa/canonical-combined/pre_match.parquet \
            --market-book-qa inputs/qa/bookmaker-real/market_book_qa_001.json \
            --power-mde run/power_mde_001.json \
            --outcomes inputs/qa/canonical-combined/outcomes.parquet \
            --profile-gap-atp run/signals/profile_gap_atp.json \
            --profile-gap-wta run/signals/profile_gap_wta.json \
            --genome-atp run/signals/genome_atp.json \
            --genome-wta run/signals/genome_wta.json \
            --min-prior-rows 1000 \
            --output run/market_validation_results.json > /dev/null

      - name: Apply frozen combined promotion rule and reliability diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m tennis_genome.experiments.market_validation_decision \
            --results run/market_validation_results.json \
            --output run/market_validation_decision.json > /dev/null

      - name: Write compact immutable run summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("run/market_validation_results.json").read_text())
          decision = json.loads(Path("run/market_validation_decision.json").read_text())
          summary = {
              "validation_bundle_sha256": results["bundle_sha256"],
              "stage_a_seal_sha256": results["stage_a_seal_sha256"],
              "outcomes_sha256": results["outcomes_sha256"],
              "market_edge_001_sha256": results["market_edge_001_sha256"],
              "market_edge_adv_001_sha256": results["market_edge_adv_001_sha256"],
              "decision_artifact_sha256": decision["artifact_sha256"],
              "decisions": decision["decisions"],
          }
          Path("run/CONFIRMATORY_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve exact confirmatory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-confirmatory-${{ github.sha }}
          path: run/
          if-no-files-found: warn
          retention-days: 90
