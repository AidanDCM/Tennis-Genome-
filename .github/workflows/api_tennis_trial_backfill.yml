name: API-Tennis Trial Historical Backfill

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: First UTC fixture date (YYYY-MM-DD)
        required: true
        type: string
      date_stop:
        description: Last UTC fixture date (YYYY-MM-DD, at most 31 days total)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: api-tennis-trial-backfill
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      API_TENNIS_API: ${{ secrets.API_TENNIS_KEY }}
      DATE_START: ${{ inputs.date_start }}
      DATE_STOP: ${{ inputs.date_stop }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Validate historical window and prevent duplicate capture
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_TENNIS_API:-}"
          python -S - <<'PY'
          import os
          from datetime import UTC, date, datetime

          start_raw = os.environ["DATE_START"]
          stop_raw = os.environ["DATE_STOP"]
          start = date.fromisoformat(start_raw)
          stop = date.fromisoformat(stop_raw)
          if start.isoformat() != start_raw or stop.isoformat() != stop_raw:
              raise SystemExit("dates must use canonical YYYY-MM-DD format")
          if not 1 <= (stop - start).days + 1 <= 31:
              raise SystemExit("window must contain one to 31 days")
          if stop >= datetime.now(UTC).date():
              raise SystemExit("historical backfill must end before today UTC")
          PY
          name="api-tennis-trial-backfill-${DATE_START}-${DATE_STOP}"
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "$count" -gt 0 ]; then
            echo "::error::retained backfill artifact already exists for this window"
            exit 1
          fi

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Capture one ATP and one WTA filtered response
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_api_tennis_filtered_range.py \
            --date-start "$DATE_START" \
            --date-stop "$DATE_STOP" \
            --output-dir api-tennis-filtered-range \
            | tee filtered-range-summary.json

      - name: Retain sanitized provider rejection if capture failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-tennis-trial-rejection-${{ github.run_id }}
          path: api-tennis-filtered-range/provider-rejection.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify raw evidence and write run receipt
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("api-tennis-filtered-range")
          manifest_path = root / "manifest.json"
          audit_path = root / "audit.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest["date_start"] != os.environ["DATE_START"]:
              raise SystemExit("manifest start date differs from request")
          if manifest["date_stop"] != os.environ["DATE_STOP"]:
              raise SystemExit("manifest stop date differs from request")
          if manifest["provider_request_count"] != 2:
              raise SystemExit("expected exactly two provider requests")
          if manifest["historical_actual_start_admissible"] is not False:
              raise SystemExit("scheduled clock time is not verified actual start")
          raw_hashes = {}
          for tour in ("atp", "wta"):
              raw = (root / f"raw-{tour}-fixtures.json").read_bytes()
              raw_hashes[tour] = hashlib.sha256(raw).hexdigest()
              if raw_hashes[tour] != manifest[f"raw_{tour}_sha256"]:
                  raise SystemExit(f"{tour} response SHA differs from manifest")
          receipt = {
              "schema_version": "tennis-genome-api-tennis-trial-backfill-receipt-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_source_sha": os.environ["GITHUB_SHA"],
              "observed_at_utc": datetime.now(UTC).isoformat(),
              "date_start": os.environ["DATE_START"],
              "date_stop": os.environ["DATE_STOP"],
              "provider_request_count": 2,
              "fixture_count": manifest["fixture_count"],
              "raw_atp_sha256": raw_hashes["atp"],
              "raw_wta_sha256": raw_hashes["wta"],
              "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "audit_sha256": hashlib.sha256(audit_path.read_bytes()).hexdigest(),
          }
          (root / "github-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Retain raw backfill evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-tennis-trial-backfill-${{ inputs.date_start }}-${{ inputs.date_stop }}
          path: |
            api-tennis-filtered-range/
            filtered-range-summary.json
          if-no-files-found: error
          retention-days: 90
