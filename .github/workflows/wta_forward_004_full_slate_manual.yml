name: WTA Forward 004 Full Slate Manual

on:
  workflow_dispatch:
    inputs:
      provider_run_id:
        description: Successful trusted Sportradar provider capture run ID
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: wta-forward-004-full-slate-manual-${{ inputs.provider_run_id }}
  cancel-in-progress: false

jobs:
  predict-slate:
    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
      slate_artifact_id: ${{ steps.upload_slate.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: trial
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Validate trusted provider run
        shell: bash
        run: |
          set -euo pipefail
          case "${PROVIDER_RUN_ID}" in
            ''|*[!0-9]*) echo "provider run id must be a positive integer" >&2; exit 1 ;;
          esac
          test "${PROVIDER_RUN_ID}" -gt 0
          gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVIDER_RUN_ID}"             > provider-run.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("provider-run.json").read_text(encoding="utf-8"))
          expected = int(os.environ["PROVIDER_RUN_ID"])
          if int(run.get("id", 0)) != expected:
              raise SystemExit("provider run id mismatch")
          if run.get("path") != ".github/workflows/prospective_provider_capture_anchor.yml":
              raise SystemExit("source run is not trusted provider capture")
          if run.get("conclusion") != "success":
              raise SystemExit("trusted provider capture did not succeed")
          if run.get("head_branch") != "main":
              raise SystemExit("trusted provider capture did not run on main")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("trusted provider capture was not explicitly dispatched")
          PY

      - name: Require provider credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPORTRADAR_API_KEY:-}"

      - name: Download immutable trusted provider capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted-provider-artifact
          gh run download "${PROVIDER_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "trusted-provider-capture-${PROVIDER_RUN_ID}"             --dir trusted-provider-artifact
          test -f trusted-provider-artifact/provider_batch_anchor_receipt.json
          test -f trusted-provider-artifact/provider_batch_anchor_comment_id.txt
          test -d trusted-provider-artifact/trusted-provider-capture/provider-batch-store
          test -d trusted-provider-artifact/trusted-provider-capture/pages
          sha256sum             trusted-provider-artifact/provider_batch_anchor_receipt.json             trusted-provider-artifact/provider_batch_anchor_comment.json             > trusted-provider-input-sha256.txt

      - name: Install pinned prediction runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Download frozen 2000-2025 WTA source and player registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors               "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv"               --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv"             --output data/wta_players.csv
          test "$(find data/wta-live-raw -type f -name 'wta_matches_*.csv' | wc -l)" -eq 26

      - name: Rebuild canonical frozen WTA history once
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2025); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset             "${args[@]}"             --tour WTA             --output-dir data/wta-live-base             --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-2000-2025"             --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror"             --source-version "${PINNED_ARCHIVE_COMMIT}"             --license-name "CC BY-NC-SA 4.0"             --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/"             --allowed-use-status research_allowed             > data/wta-live-base/build_output.json

      - name: Run cached full-slate Champion executor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wta_live_prediction_forward_004.py             --full-slate             --output-root forward-004-slate-work             | tee forward-004-slate-summary.json

      - name: Verify complete slate execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from tennis_genome.prospective.match_lifecycle import MatchLifecycleLedger

          root = Path("forward-004-slate-work")
          resolution = json.loads(
              (root / "forward-004-slate-resolution.json").read_text(encoding="utf-8")
          )
          execution = json.loads(
              (root / "execution" / "slate-execution-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          target_count = int(execution.get("target_count", -1))
          if target_count <= 0:
              raise SystemExit("full-slate execution produced no Champion predictions")
          if target_count != int(resolution.get("eligible_target_count", -2)):
              raise SystemExit("executed target count differs from deterministic slate")
          results = execution.get("results")
          if not isinstance(results, list) or len(results) != target_count:
              raise SystemExit("slate execution results do not reproduce target count")
          if int(execution.get("provider_cached_path_count", -1)) != int(
              execution.get("provider_unique_request_count", -2)
          ):
              raise SystemExit("provider cache accounting mismatch")

          event_ids = [str(item.get("event_id", "")) for item in results]
          if len(event_ids) != len(set(event_ids)):
              raise SystemExit("duplicate event ID in executed slate")

          for item in results:
              prediction_root = root / "execution" / str(item["prediction_root"])
              for name in (
                  "prediction-dossier.json",
                  "matchup-input.json",
                  "calculation.json",
                  "sportradar-identity-binding.json",
              ):
                  if not (prediction_root / name).is_file():
                      raise SystemExit(f"missing per-match prediction evidence: {name}")

          ledger = MatchLifecycleLedger(root / "execution" / "match-lifecycle-ledger")
          audit = ledger.verify()
          if audit.lifecycle_count != target_count:
              raise SystemExit("lifecycle count differs from executed target count")
          if set(audit.lifecycle_states.values()) != {"CHAMPION_PREDICTED"}:
              raise SystemExit("manual slate lifecycle advanced beyond Champion prediction")
          PY

      - name: Build deterministic per-match packaging matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "forward-004-slate-work/execution/slate-execution-manifest.json"
              ).read_text(encoding="utf-8")
          )
          include = []
          for item in manifest["results"]:
              include.append(
                  {
                      "artifact_stem": item["artifact_stem"],
                      "event_id": item["event_id"],
                      "prediction_record_sha256": item[
                          "prediction_record_sha256"
                      ],
                      "chain_head_sha256": item["chain_head_sha256"],
                      "scheduled_start": item["scheduled_start"],
                  }
              )
          if len(include) != int(manifest["target_count"]):
              raise SystemExit("packaging matrix differs from executed slate")
          payload = json.dumps({"include": include}, separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"target_matrix={payload}\n")
          PY

      - name: Upload experimental full-slate evidence
        id: upload_slate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forward-004-full-slate-bundle-${{ github.run_id }}
          path: |
            provider-run.json
            trusted-provider-input-sha256.txt
            forward-004-slate-summary.json
            forward-004-slate-work/
          if-no-files-found: error
          retention-days: 90

  capture-api-tennis-slate:
    needs: predict-slate
    uses: ./.github/workflows/api_tennis_slate_extension_capture.yml
    with:
      full_slate_artifact_id: ${{ needs.predict-slate.outputs.slate_artifact_id }}
      history_artifact_id: "10531692054"
    secrets: inherit

  package-targets:
    needs:
      - predict-slate
      - capture-api-tennis-slate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      API_TENNIS_HISTORY_ARTIFACT_ID: "10531692054"
      SHARED_EXTENSION_ARTIFACT_ID: ${{ needs.capture-api-tennis-slate.outputs.shared_extension_artifact_id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.predict-slate.outputs.target_matrix) }}
    steps:
      - name: Download parent slate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forward-004-full-slate-bundle-${{ github.run_id }}
          path: full-slate

      - name: Download shared API-Tennis capture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.capture-api-tennis-slate.outputs.shared_extension_artifact_id }}
          path: shared-extension

      - name: Confirm target is still publishable
        id: eligibility
        env:
          EVENT_ID: ${{ matrix.event_id }}
          SCHEDULED_START: ${{ matrix.scheduled_start }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          manifest = json.loads(
              Path("shared-extension/manifest.json").read_text(encoding="utf-8")
          )
          event_id = os.environ["EVENT_ID"]
          scheduled = datetime.fromisoformat(os.environ["SCHEDULED_START"])
          captured = datetime.fromisoformat(str(manifest["captured_at"]))
          if scheduled.tzinfo is None or scheduled.utcoffset() is None:
              raise SystemExit("scheduled start must be timezone-aware")
          if captured.tzinfo is None or captured.utcoffset() is None:
              raise SystemExit("shared capture time must be timezone-aware")
          prestart_ids = set(manifest.get("prestart_target_event_ids", []))
          publish = (
              event_id in prestart_ids
              and captured < scheduled
              and datetime.now(UTC) < scheduled
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(f"publish={'true' if publish else 'false'}\n")
          PY

      - name: Repackage one match into legacy prediction artifact contract
        if: steps.eligibility.outputs.publish == 'true'
        env:
          ARTIFACT_STEM: ${{ matrix.artifact_stem }}
          EVENT_ID: ${{ matrix.event_id }}
          PREDICTION_SHA: ${{ matrix.prediction_record_sha256 }}
          CHAIN_HEAD_SHA: ${{ matrix.chain_head_sha256 }}
          SCHEDULED_START: ${{ matrix.scheduled_start }}
          PARENT_SLATE_ARTIFACT_ID: ${{ needs.predict-slate.outputs.slate_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="full-slate/forward-004-slate-work/execution/matches/${ARTIFACT_STEM}"
          test -f "${source_root}/forward-004-target-resolution.json"
          test -d "${source_root}/prediction-work"
          mkdir -p per-match-artifact
          cp full-slate/provider-run.json per-match-artifact/provider-run.json
          cp full-slate/trusted-provider-input-sha256.txt             per-match-artifact/trusted-provider-input-sha256.txt
          cp "${source_root}/forward-004-target-resolution.json"             per-match-artifact/forward-004-target-resolution.json
          cp -a "${source_root}/prediction-work" per-match-artifact/prediction-work

          printf '%s\n' "${PREDICTION_SHA}"             > per-match-artifact/prediction-work/prediction-record-sha256.txt
          printf '%s\n' "${CHAIN_HEAD_SHA}"             > per-match-artifact/prediction-work/chain-head-sha256.txt
          sha256sum             per-match-artifact/prediction-work/sportradar-identity-binding.json             | awk '{print $1}'             > per-match-artifact/prediction-work/identity-binding-sha256.txt

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = json.loads(
              Path(
                  "per-match-artifact/forward-004-target-resolution.json"
              ).read_text(encoding="utf-8")
          )
          if target.get("event_id") != os.environ["EVENT_ID"]:
              raise SystemExit("per-match package event identity mismatch")
          prediction_sha = Path(
              "per-match-artifact/prediction-work/prediction-record-sha256.txt"
          ).read_text(encoding="utf-8").strip()
          if prediction_sha != os.environ["PREDICTION_SHA"]:
              raise SystemExit("per-match prediction SHA mismatch")
          receipt = {
              "schema_version": "wta-forward-004-slate-child-artifact-v1",
              "parent_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "parent_slate_artifact_id": int(
                  os.environ["PARENT_SLATE_ARTIFACT_ID"]
              ),
              "event_id": os.environ["EVENT_ID"],
              "artifact_stem": os.environ["ARTIFACT_STEM"],
              "prediction_record_sha256": os.environ["PREDICTION_SHA"],
              "chain_head_sha256": os.environ["CHAIN_HEAD_SHA"],
              "scheduled_start": os.environ["SCHEDULED_START"],
              "shared_extension_artifact_id": int(
                  os.environ["SHARED_EXTENSION_ARTIFACT_ID"]
              ),
          }
          Path("per-match-artifact/slate-parent-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload settlement-compatible per-match Champion artifact
        if: steps.eligibility.outputs.publish == 'true'
        id: upload_target
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wta-forward-004-slate-${{ matrix.artifact_stem }}-${{ github.run_id }}
          path: per-match-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch Champion anchor and shared API-Tennis evidence
        if: steps.eligibility.outputs.publish == 'true'
        env:
          CHILD_ARTIFACT_ID: ${{ steps.upload_target.outputs.artifact-id }}
          PREDICTION_SHA: ${{ matrix.prediction_record_sha256 }}
          CHAIN_HEAD_SHA: ${{ matrix.chain_head_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "${CHILD_ARTIFACT_ID}" "${SHARED_EXTENSION_ARTIFACT_ID}"; do
            case "$value" in
              ''|*[!0-9]*) echo "required artifact ID is invalid" >&2; exit 1 ;;
            esac
          done

          anchor_payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_record_sha256": os.environ["PREDICTION_SHA"],
                  "chain_head_sha256": os.environ["CHAIN_HEAD_SHA"],
              },
          }, separators=(",", ":")))
          PY
          )
          code=$(curl --silent --show-error \
            --output anchor-dispatch-response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/prospective_evidence_anchor.yml/dispatches" \
            -d "$anchor_payload")
          if [ "$code" != "204" ]; then
            cat anchor-dispatch-response.txt
            exit 1
          fi

          evidence_payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_artifact_id": os.environ["CHILD_ARTIFACT_ID"],
                  "history_artifact_id": os.environ[
                      "API_TENNIS_HISTORY_ARTIFACT_ID"
                  ],
                  "shared_extension_artifact_id": os.environ[
                      "SHARED_EXTENSION_ARTIFACT_ID"
                  ],
              },
          }, separators=(",", ":")))
          PY
          )
          code=$(curl --silent --show-error \
            --output evidence-dispatch-response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/api_tennis_prospective_evidence_from_shared.yml/dispatches" \
            -d "$evidence_payload")
          if [ "$code" != "204" ]; then
            cat evidence-dispatch-response.txt
            exit 1
          fi
