name: Freeze TGE-Independent-v1 Production Bundle

on:
  push:
    branches:
      - dev/independent-v1-production-freeze
    paths:
      - ".github/workflows/independent_v1_production_freeze.yml"
      - "src/tennis_genome/independent/production.py"
      - "tests/test_independent_production.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-v1-production-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - name: Checkout production-freeze branch
        uses: actions/checkout@v4
        with:
          ref: dev/independent-v1-production-freeze
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Normalize production source formatting
        run: |
          ruff check --fix src/tennis_genome/independent/production.py tests/test_independent_production.py
          ruff format src/tennis_genome/independent/production.py tests/test_independent_production.py
          ruff check src/tennis_genome/independent/production.py tests/test_independent_production.py

      - name: Assert development-only freeze
        run: |
          test "$START_YEAR" = "2000"
          test "$END_YEAR" = "2025"

      - name: Download exact accepted 2000-2025 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/independent_freeze_raw/atp data/independent_freeze_raw/wta
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            for tour in atp wta; do
              filename="${tour}_matches_${year}.csv"
              url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/${tour}/${filename}"
              curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
                --output "data/independent_freeze_raw/${tour}/${filename}" "$url"
            done
          done
          test "$(find data/independent_freeze_raw -type f | wc -l)" -eq 52

      - name: Rebuild canonical ATP and WTA datasets
        shell: bash
        run: |
          set -euo pipefail
          for tour in atp wta; do
            mkdir -p "data/independent_freeze_processed/${tour}"
            args=()
            for year in $(seq "$START_YEAR" "$END_YEAR"); do
              args+=(--input "data/independent_freeze_raw/${tour}/${tour}_matches_${year}.csv")
            done
            upper=$(echo "$tour" | tr '[:lower:]' '[:upper:]')
            python -m tennis_genome.pipeline.build_dataset \
              "${args[@]}" \
              --tour "$upper" \
              --output-dir "data/independent_freeze_processed/${tour}" \
              --source-id "sackmann-archive-${ARCHIVE_COMMIT}-${tour}-${START_YEAR}-${END_YEAR}" \
              --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
              --source-version "$ARCHIVE_COMMIT" \
              --license-name "$LICENSE_NAME" \
              --license-url "$LICENSE_URL" \
              --allowed-use-status research_allowed \
              > "data/independent_freeze_processed/${tour}/build_output.json"
          done

      - name: Freeze production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/tge_independent_v1_production
          mkdir -p artifacts/tge_independent_v1_production
          python -m tennis_genome.independent.production \
            --atp-manifest data/independent_freeze_processed/atp/atp_manifest.json \
            --atp-pre-match data/independent_freeze_processed/atp/atp_pre_match.parquet \
            --atp-outcomes data/independent_freeze_processed/atp/atp_outcomes.parquet \
            --atp-stats data/independent_freeze_processed/atp/atp_stats.parquet \
            --wta-manifest data/independent_freeze_processed/wta/wta_manifest.json \
            --wta-pre-match data/independent_freeze_processed/wta/wta_pre_match.parquet \
            --wta-outcomes data/independent_freeze_processed/wta/wta_outcomes.parquet \
            --wta-stats data/independent_freeze_processed/wta/wta_stats.parquet \
            --output-dir artifacts/tge_independent_v1_production \
            > artifacts/tge_independent_v1_production/freeze_stdout.json

      - name: Verify sealed bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tennis_genome.independent.production import load_bundle

          root = Path("artifacts/tge_independent_v1_production")
          bundle = load_bundle(root / "tge_independent_v1_production.json")
          assert bundle.development_end_year == 2025
          assert bundle.atp.neighbor_bank.k == 100
          assert bundle.wta.neighbor_bank.k == 100
          assert bundle.wta.wta_pointsim_meta is not None
          assert bundle.atp.atp_conditioned_unfamiliarity is not None
          assert bundle.wta.wta_elo_diagnostic is not None
          assert bundle.wta.wta_a_plus_b_diagnostic is not None
          print(json.dumps({
              "artifact_sha256": bundle.artifact_sha256,
              "atp_neighbor_bank_sha256": bundle.atp.neighbor_bank.sha256,
              "wta_neighbor_bank_sha256": bundle.wta.neighbor_bank.sha256,
              "atp_neighbor_rows": bundle.atp.neighbor_bank.row_count,
              "wta_neighbor_rows": bundle.wta.neighbor_bank.row_count,
              "atp_alignment_meta_rows": bundle.atp.alignment_meta.training_n,
              "wta_alignment_meta_rows": bundle.wta.alignment_meta.training_n,
              "wta_pointsim_meta_rows": bundle.wta.wta_pointsim_meta.training_n,
          }, indent=2, sort_keys=True))
          (root / "freeze_stdout.json").unlink()
          PY

      - name: Run production boundary tests
        run: pytest tests/test_independent_production.py tests/test_independent_v1.py tests/test_historical_neighbors.py

      - name: Commit source normalization and frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add src/tennis_genome/independent/production.py tests/test_independent_production.py artifacts/tge_independent_v1_production
          if git diff --cached --quiet; then
            echo "Production source and artifacts are already identical."
            exit 0
          fi
          git commit -m "Seal TGE-Independent-v1 production bundle"
          git push origin HEAD:dev/independent-v1-production-freeze

      - name: Upload production-freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: tge-independent-v1-production-freeze
          path: artifacts/tge_independent_v1_production
          if-no-files-found: error
          retention-days: 30
