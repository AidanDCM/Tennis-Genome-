name: PATTERN-DISCOVERY-001 Real Run

on:
  push:
    branches: [dev/pattern-discovery-001]
    paths:
      - .github/workflows/pattern_discovery_real.yml

permissions:
  contents: read
  actions: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Recheck discovery implementation
        run: |
          ruff check src/tennis_genome/experiments/pattern_discovery.py tests/test_pattern_discovery.py
          pytest tests/test_pattern_discovery.py
      - name: Download frozen confirmatory result bundle
        uses: actions/download-artifact@v4
        with:
          name: bookmaker-confirmatory-6d62014eeb1549c0bda09cb5987695ac7c2be2a1
          path: inputs/confirmatory
          github-token: ${{ github.token }}
          run-id: 34623630174
      - name: Download frozen bookmaker QA/canonical bundle
        uses: actions/download-artifact@v4
        with:
          name: bookmaker-real-qa-e2faeb9794225f1b72f0f826620afaf4e4eb187d
          path: inputs/qa
          github-token: ${{ github.token }}
          run-id: 34616782073
      - name: Verify every frozen discovery input hash
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pattern.sha256 <<'EOF'
          6419f5fbfa24ed6399771ce9a8ed23a46aa8720406acf987498eb24ed139e88d  inputs/confirmatory/market_validation_results.json
          557e579cd69b04b7436fee342d90d44a3a7e982f128b586ca0e6d1e01b0eec9e  inputs/qa/canonical-combined/pre_match.parquet
          8dc6524e70b593fcbc03cc0af0e5d74675dcdff8777af9c693f3df36d07cc472  inputs/confirmatory/signals/profile_gap_atp.json
          315ae83acf91b58200a09f91a466f4b4ef19b03848175afce3fa86b0be1ce795  inputs/confirmatory/signals/profile_gap_wta.json
          4e83ffb4f751d901934a4124d215e4dee9ef9eacd9f5c2b9590fd86334e6965b  inputs/confirmatory/signals/genome_atp.json
          2bc89fbfae1a4ba281fe2f859fb6a72a2ad3962a50e239f  inputs/confirmatory/signals/genome_wta.json
          EOF
          # Correct the WTA Genome line explicitly to avoid accepting a shortened digest.
          sed -i '6c\2bc89fbfae1a4ba281fe2f859fb6a72a2ad9fd9702d4a0c172ad3962a50e239f  inputs/confirmatory/signals/genome_wta.json' /tmp/pattern.sha256
          sha256sum --check /tmp/pattern.sha256
      - name: Run preregistered residual pattern search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          python -m tennis_genome.experiments.pattern_discovery \
            --results inputs/confirmatory/market_validation_results.json \
            --pre-match inputs/qa/canonical-combined/pre_match.parquet \
            --profile-gap-atp inputs/confirmatory/signals/profile_gap_atp.json \
            --profile-gap-wta inputs/confirmatory/signals/profile_gap_wta.json \
            --genome-atp inputs/confirmatory/signals/genome_atp.json \
            --genome-wta inputs/confirmatory/signals/genome_wta.json \
            --output run/pattern_discovery_001.json \
            --residual-ledger run/residual_ledger.jsonl \
            --feature-ledger run/feature_ledger.jsonl
      - name: Verify discovery artifact and write immutable summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('run/pattern_discovery_001.json')
          payload = json.loads(path.read_text())
          assert payload['experiment_id'] == 'PATTERN-DISCOVERY-001'
          assert payload['version'] == 'pattern-discovery-v1'
          assert payload['exploratory_only'] is True
          assert payload['production_promotion_allowed'] is False
          assert payload['discovery_end_year'] == 2022
          assert payload['validation_years'] == [2023, 2024, 2025]
          stored = payload['artifact_sha256']
          unsigned = dict(payload)
          unsigned.pop('artifact_sha256')
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode('utf-8')
          assert hashlib.sha256(encoded).hexdigest() == stored
          candidates = payload['candidates']
          survivors = [item for item in candidates if item['survivor'] is True]
          summary = {
              'experiment_id': payload['experiment_id'],
              'version': payload['version'],
              'artifact_sha256': stored,
              'residual_ledger_sha256': payload['residual_ledger_sha256'],
              'feature_ledger_sha256': payload['feature_ledger_sha256'],
              'candidate_counts': payload['candidate_counts'],
              'total_candidates': len(candidates),
              'total_survivors': len(survivors),
              'survivors': survivors,
              'interpretation': 'exploratory candidate hypotheses only; no production promotion',
          }
          Path('run/PATTERN_DISCOVERY_SUMMARY.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=False) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True, allow_nan=False))
          PY
      - name: Preserve complete discovery run
        uses: actions/upload-artifact@v4
        with:
          name: pattern-discovery-001-${{ github.sha }}
          path: run/
          retention-days: 90
