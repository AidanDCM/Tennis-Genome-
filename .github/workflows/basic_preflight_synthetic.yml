name: BASIC-PREFLIGHT-001 synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - dev/basic-preflight-v1
      - dev/basic-preflight-source-integrity
    paths:
      - "src/tennis_genome/experiments/basic_preflight.py"
      - "tests/test_basic_preflight.py"
      - "schemas/basic_preflight_report.schema.json"
      - "research/installment_01/basic_preflight_001_protocol.md"
      - "research/installment_01/basic_preflight_001_amendment_001.md"
      - ".github/workflows/basic_preflight_synthetic.yml"
  pull_request:
    paths:
      - "src/tennis_genome/experiments/basic_preflight.py"
      - "tests/test_basic_preflight.py"
      - "schemas/basic_preflight_report.schema.json"
      - "research/installment_01/basic_preflight_001_protocol.md"
      - "research/installment_01/basic_preflight_001_amendment_001.md"
      - ".github/workflows/basic_preflight_synthetic.yml"

jobs:
  synthetic-basic-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .[dev]

      - name: Run BASIC-PREFLIGHT regression suite
        run: pytest -q tests/test_basic_preflight.py

      - name: Generate outcome-free BASIC and canonical fixtures
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, date, datetime
          from pathlib import Path

          import pandas as pd

          root = Path("synthetic_basic_preflight")
          basic = root / "basic"
          basic.mkdir(parents=True)
          market_lines = []
          pre_match_rows = []
          market_counter = 0

          for tour_index, tour in enumerate(("ATP", "WTA")):
              for year in range(2019, 2026):
                  per_month = 50 if year <= 2020 else 10
                  for month in range(1, 13):
                      for index in range(per_month):
                          market_counter += 1
                          day = index % 10 + 1
                          event_date = date(year, month, day)
                          match_id = f"{tour.lower()}-{year}-{month:02d}-{index:03d}"
                          player_a = f"{tour} Alpha {market_counter}"
                          player_b = f"{tour} Beta {market_counter}"
                          market_time = datetime(
                              year,
                              month,
                              day,
                              18,
                              0,
                              tzinfo=UTC,
                          )
                          market_id = f"1.{market_counter:09d}"
                          definition = {
                              "eventId": f"e-{market_counter}",
                              "eventTypeId": "2",
                              "marketType": "MATCH_ODDS",
                              "eventName": f"{player_a} v {player_b}",
                              "marketTime": market_time.isoformat(),
                              "status": "OPEN",
                              "inPlay": False,
                              "runners": [
                                  {"id": market_counter * 2 + 1, "name": player_a, "status": "ACTIVE"},
                                  {"id": market_counter * 2 + 2, "name": player_b, "status": "ACTIVE"},
                              ],
                          }
                          market_lines.append(
                              json.dumps(
                                  {
                                      "op": "mcm",
                                      "pt": int(market_time.timestamp() * 1000) - 60_000,
                                      "mc": [
                                          {
                                              "id": market_id,
                                              "marketDefinition": definition,
                                          }
                                      ],
                                  },
                                  sort_keys=True,
                              )
                          )
                          pre_match_rows.append(
                              {
                                  "match_id": match_id,
                                  "tour": tour,
                                  "event_date": event_date,
                                  "source_order": market_counter,
                                  "tournament_id": f"t-{year}-{month:02d}",
                                  "tournament_name": "Synthetic Open",
                                  "tournament_level": "A",
                                  "surface": "Hard",
                                  "round": "R32",
                                  "best_of": 3,
                                  "player_a_id": f"pa-{market_counter}",
                                  "player_b_id": f"pb-{market_counter}",
                                  "player_a_name": player_a,
                                  "player_b_name": player_b,
                                  "rank_a": 10,
                                  "rank_b": 20,
                                  "rank_points_a": 2000,
                                  "rank_points_b": 1500,
                              }
                          )

          (basic / "tennis-basic.jsonl").write_text(
              "\n".join(market_lines) + "\n",
              encoding="utf-8",
          )
          pd.DataFrame(pre_match_rows).to_parquet(root / "pre_match.parquet", index=False)
          assert market_counter == 3600
          assert "a_won" not in pre_match_rows[0]
          assert "outcome" not in pre_match_rows[0]
          PY

      - name: Run BASIC-PREFLIGHT twice
        run: |
          python -m tennis_genome.experiments.basic_preflight \
            --betfair-root synthetic_basic_preflight/basic \
            --pre-match synthetic_basic_preflight/pre_match.parquet \
            --start-date 2019-01-01 \
            --end-date 2025-12-31 \
            --output synthetic_basic_preflight/result-a.json > /dev/null
          python -m tennis_genome.experiments.basic_preflight \
            --betfair-root synthetic_basic_preflight/basic \
            --pre-match synthetic_basic_preflight/pre_match.parquet \
            --start-date 2019-01-01 \
            --end-date 2025-12-31 \
            --output synthetic_basic_preflight/result-b.json > /dev/null

      - name: Enforce deterministic minimum purchase window
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("synthetic_basic_preflight")
          a = (root / "result-a.json").read_text(encoding="utf-8")
          b = (root / "result-b.json").read_text(encoding="utf-8")
          assert a == b
          report = json.loads(a)
          assert report["experiment_id"] == "BASIC-PREFLIGHT-001"
          assert report["data_package"] == "BASIC"
          assert report["markets_reconstructed"] == 3600
          assert report["markets_matched"] == 3600
          assert report["markets_unmatched"] == 0
          assert report["markets_ambiguous"] == 0
          assert report["recommendation_class"] == "CANDIDATE_MINIMUM_WINDOW"
          assert report["recommended_advanced_start_month"] == "2019-05-01"
          assert report["recommended_advanced_end_date"] == "2025-12-31"
          assert len(report["source_bundle_sha256"]) == 64
          assert len(report["pre_match_sha256"]) == 64
          assert len(report["artifact_sha256"]) == 64
          assert "outcome" not in a.lower()
          assert "a_won" not in a.lower()
          for tour in report["tours"]:
              assert tour["latest_start_month_with_1000_prior"] == "2019-05-01"
              assert tour["overall_coverage_pass"] is True
              assert tour["recent_coverage_pass"] is True
              assert tour["recent_count_pass"] is True
              recent = {item["year"]: item for item in tour["yearly"]}
              for year in range(2021, 2026):
                  assert recent[year]["basic_matched_rows"] == 120
                  assert recent[year]["identity_coverage"] == 1.0
          PY

      - name: Enforce outcome-field leakage rejection
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          root = Path("synthetic_basic_preflight")
          frame = pd.read_parquet(root / "pre_match.parquet")
          frame["a_won"] = True
          leaked = root / "pre_match_leaked.parquet"
          frame.to_parquet(leaked, index=False)
          PY
          if python -m tennis_genome.experiments.basic_preflight \
            --betfair-root synthetic_basic_preflight/basic \
            --pre-match synthetic_basic_preflight/pre_match_leaked.parquet \
            --start-date 2019-01-01 \
            --end-date 2025-12-31 \
            --output synthetic_basic_preflight/should-not-exist.json > /dev/null 2>&1; then
            echo "BASIC-PREFLIGHT accepted an outcome field" >&2
            exit 1
          fi

      - name: Enforce ADVANCED and PRO ladder rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("synthetic_basic_preflight")
          source = root / "basic" / "tennis-basic.jsonl"
          first = json.loads(source.read_text(encoding="utf-8").splitlines()[0])
          first["mc"][0]["rc"] = [{"id": 3, "batb": [[0, 2.0, 10.0]]}]
          rich = root / "rich"
          rich.mkdir()
          (rich / "advanced-like.jsonl").write_text(
              json.dumps(first, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          if python -m tennis_genome.experiments.basic_preflight \
            --betfair-root synthetic_basic_preflight/rich \
            --pre-match synthetic_basic_preflight/pre_match.parquet \
            --start-date 2019-01-01 \
            --end-date 2025-12-31 \
            --output synthetic_basic_preflight/rich-should-not-exist.json > /dev/null 2>&1; then
            echo "BASIC-PREFLIGHT accepted an ADVANCED/PRO price ladder" >&2
            exit 1
          fi
          test ! -e synthetic_basic_preflight/rich-should-not-exist.json

      - name: Upload synthetic BASIC preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-basic-preflight-synthetic
          path: synthetic_basic_preflight/result-a.json
