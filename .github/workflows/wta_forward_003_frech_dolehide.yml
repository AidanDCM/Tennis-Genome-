name: WTA Forward 003 Frech-Dolehide Lock

on:
  push:
    branches:
      - ops/wta-forward-003-frech-dolehide
    paths:
      - ".github/forward-003-trigger.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: wta-forward-003-frech-dolehide
  cancel-in-progress: false

jobs:
  predict-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONPATH: src
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: trial
      PROVIDER_RUN_ID: "35121889737"
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Require provider credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPORTRADAR_API_KEY:-}"

      - name: Download frozen trusted Sep 16 provider artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted-provider-artifact
          gh run download "${PROVIDER_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "trusted-provider-capture-${PROVIDER_RUN_ID}" \
            --dir trusted-provider-artifact
          test -f trusted-provider-artifact/provider_batch_anchor_receipt.json
          test -f trusted-provider-artifact/provider_batch_anchor_comment_id.txt
          test -d trusted-provider-artifact/trusted-provider-capture/provider-batch-store
          test -d trusted-provider-artifact/trusted-provider-capture/pages

      - name: Install pinned prediction runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Download frozen 2000-2025 WTA source and player registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
              "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv" \
              --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv" \
            --output data/wta_players.csv
          test "$(find data/wta-live-raw -type f | wc -l)" -eq 26

      - name: Rebuild canonical frozen WTA history
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2025); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset \
            "${args[@]}" \
            --tour WTA \
            --output-dir data/wta-live-base \
            --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-2000-2025" \
            --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
            --source-version "$PINNED_ARCHIVE_COMMIT" \
            --license-name "CC BY-NC-SA 4.0" \
            --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/" \
            --allowed-use-status research_allowed \
            > data/wta-live-base/build_output.json

      - name: Calculate and immutably commit Frech-Dolehide prediction
        id: prediction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/wta_live_prediction_forward_003.py | tee prediction-summary.json
          record=$(find prediction-work/prospective-pilot-store/records -type f -name '*.json' | sort | tail -1)
          prediction_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["record_sha256"])' "$record")
          chain_head=$(python - <<'PY'
          from pathlib import Path
          from tennis_genome.prospective.pilot import ProspectivePilotStore
          print(ProspectivePilotStore(Path("prediction-work/prospective-pilot-store")).verify()["chain_head_sha256"])
          PY
          )
          test "$prediction_sha" = "$chain_head"
          identity_sha=$(sha256sum prediction-work/sportradar-identity-binding.json | awk '{print $1}')
          echo "prediction_sha=$prediction_sha" >> "$GITHUB_OUTPUT"
          echo "chain_head=$chain_head" >> "$GITHUB_OUTPUT"
          echo "identity_sha=$identity_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$prediction_sha" > prediction-work/prediction-record-sha256.txt
          printf '%s\n' "$chain_head" > prediction-work/chain-head-sha256.txt
          printf '%s\n' "$identity_sha" > prediction-work/identity-binding-sha256.txt

      - name: Dispatch trusted prediction anchor on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREDICTION_SHA: ${{ steps.prediction.outputs.prediction_sha }}
          CHAIN_HEAD: ${{ steps.prediction.outputs.chain_head }}
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "prediction_record_sha256": os.environ["PREDICTION_SHA"],
                  "chain_head_sha256": os.environ["CHAIN_HEAD"],
              },
          }))
          PY
          )
          code=$(curl --silent --show-error --output prediction-anchor-dispatch-response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/prospective_evidence_anchor.yml/dispatches" \
            -d "$payload")
          test "$code" = "204"

      - name: Upload complete forward 003 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wta-forward-003-frech-dolehide
          path: |
            trusted-provider-artifact/
            forward-003-target-resolution.json
            prediction-work/
            prediction-summary.json
            prediction-anchor-dispatch-response.txt
          if-no-files-found: warn
          retention-days: 90
