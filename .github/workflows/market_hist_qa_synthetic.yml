name: MARKET-HIST-QA-001 synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - dev/market-hist-qa-v1
    paths:
      - "src/tennis_genome/experiments/market_hist_qa*.py"
      - "src/tennis_genome/market/historical_manifest.py"
      - "tests/test_market_hist_qa.py"
      - "tests/test_historical_manifest.py"
      - ".github/workflows/market_hist_qa_synthetic.yml"
      - "research/installment_01/market_hist_qa_001*.md"
  pull_request:
    paths:
      - "src/tennis_genome/experiments/market_hist_qa*.py"
      - "src/tennis_genome/market/historical_manifest.py"
      - "tests/test_market_hist_qa.py"
      - "tests/test_historical_manifest.py"
      - ".github/workflows/market_hist_qa_synthetic.yml"
      - "research/installment_01/market_hist_qa_001*.md"

jobs:
  synthetic-market-hist-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Generate synthetic eligible source and MARKET-HIST artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import UTC, date, datetime, timedelta
          from pathlib import Path

          import pandas as pd

          from tennis_genome.market.historical_manifest import (
              build_historical_source_manifest,
              write_historical_source_manifest,
          )

          root = Path("synthetic_market_hist_qa")
          source = root / "source"
          source.mkdir(parents=True)
          source_file = source / "bundle.jsonl"
          source_file.write_bytes(b"synthetic Betfair source stand-in")
          manifest = build_historical_source_manifest(
              root=source,
              data_package="ADVANCED",
              requested_start_date="2020-01-01",
              requested_end_date="2025-12-31",
          )
          write_historical_source_manifest(manifest, root / "manifest.json")
          source_hash = manifest.files[0].sha256

          def sha(value: str) -> str:
              return hashlib.sha256(value.encode()).hexdigest()

          def checkpoint(name, match_id, market_id, join_hash, market_time, seconds, executable=True):
              return {
                  "checkpoint_name": name,
                  "data_package": "ADVANCED",
                  "executable_two_way": executable,
                  "seconds_to_start": float(seconds),
                  "checkpoint_lag_seconds": 0.0,
                  "match_id": match_id,
                  "source_market_id": market_id,
                  "best_back_a": 1.90,
                  "best_back_size_a": 100.0,
                  "best_lay_a": 1.92,
                  "best_lay_size_a": 90.0,
                  "best_back_b": 2.05,
                  "best_back_size_b": 80.0,
                  "best_lay_b": 2.08,
                  "best_lay_size_b": 70.0,
                  "published_at": (market_time - timedelta(seconds=seconds)).isoformat(),
                  "market_time": market_time.isoformat(),
                  "market_total_matched": 5000.0,
                  "market_base_rate": 5.0,
                  "record_hash": sha(f"record:{match_id}:{name}"),
                  "join_hash": join_hash,
                  "source_file_sha256": source_hash,
                  "source_message_sha256": sha(f"message:{match_id}:{name}"),
              }

          pre_rows = []
          outcome_rows = []
          market_lines = []
          for tour in ("ATP", "WTA"):
              for year in range(2020, 2026):
                  count = 1000 if year == 2020 else 100
                  for index in range(count):
                      match_id = f"{tour.lower()}-{year}-{index:04d}"
                      market_id = f"market-{match_id}"
                      join_hash = sha(f"join:{match_id}")
                      market_time = datetime(year, 6, 15, 18, 0, tzinfo=UTC)
                      pre_rows.append({
                          "match_id": match_id,
                          "tour": tour,
                          "event_date": date(year, 6, 15),
                          "tournament_level": "A" if index % 2 == 0 else "M",
                          "surface": "Hard" if index % 3 else "Clay",
                          "round": "R32" if index % 2 == 0 else "R16",
                          "rank_a": 10 + index % 120,
                          "rank_b": 20 + index % 140,
                      })
                      outcome_rows.append({
                          "match_id": match_id,
                          "retirement": False,
                          "walkover": False,
                      })
                      checkpoints = [
                          checkpoint(
                              "CLOSE_PREPLAY", match_id, market_id, join_hash, market_time, 300
                          ),
                          checkpoint("T-15M", match_id, market_id, join_hash, market_time, 900),
                      ]
                      if index % 2 == 0:
                          checkpoints.append(
                              checkpoint("T-1H", match_id, market_id, join_hash, market_time, 3600)
                          )
                      if index % 4 == 0:
                          checkpoints.append(
                              checkpoint("T-6H", match_id, market_id, join_hash, market_time, 21600)
                          )
                      if index % 10 == 0:
                          checkpoints.append(
                              checkpoint("T-24H", match_id, market_id, join_hash, market_time, 86400)
                          )
                      market_lines.append(json.dumps({
                          "source_market_id": market_id,
                          "source_event_id": f"event-{year}",
                          "source_file": "bundle.jsonl",
                          "source_file_sha256": source_hash,
                          "data_package": "ADVANCED",
                          "join_status": "MATCHED",
                          "normalized_runner_names": ["alpha", "beta"],
                          "candidate_match_ids": [match_id],
                          "join": {
                              "join_hash": join_hash,
                              "source_market_id": market_id,
                              "match_id": match_id,
                              "tour": tour,
                          },
                          "checkpoints": checkpoints,
                      }, sort_keys=True))

              boundary = f"{tour.lower()}-boundary-excluded"
              pre_rows.append({
                  "match_id": boundary,
                  "tour": tour,
                  "event_date": date(2025, 12, 20),
                  "tournament_level": "A",
                  "surface": "Hard",
                  "round": "R32",
                  "rank_a": 20,
                  "rank_b": 30,
              })
              outcome_rows.append({
                  "match_id": boundary,
                  "retirement": False,
                  "walkover": False,
              })

          (root / "market_hist_001_records.jsonl").write_text(
              "\n".join(market_lines) + "\n", encoding="utf-8"
          )
          pd.DataFrame(pre_rows).to_parquet(root / "pre_match.parquet", index=False)
          pd.DataFrame(outcome_rows).to_parquet(root / "outcomes.parquet", index=False)
          PY

      - name: Run QA bundle twice
        run: |
          python -m tennis_genome.experiments.market_hist_qa_bundle \
            --source-manifest synthetic_market_hist_qa/manifest.json \
            --market-hist-records synthetic_market_hist_qa/market_hist_001_records.jsonl \
            --pre-match synthetic_market_hist_qa/pre_match.parquet \
            --outcomes synthetic_market_hist_qa/outcomes.parquet \
            --source-root synthetic_market_hist_qa/source \
            --output synthetic_market_hist_qa/qa-a.json > /dev/null
          python -m tennis_genome.experiments.market_hist_qa_bundle \
            --source-manifest synthetic_market_hist_qa/manifest.json \
            --market-hist-records synthetic_market_hist_qa/market_hist_001_records.jsonl \
            --pre-match synthetic_market_hist_qa/pre_match.parquet \
            --outcomes synthetic_market_hist_qa/outcomes.parquet \
            --source-root synthetic_market_hist_qa/source \
            --output synthetic_market_hist_qa/qa-b.json > /dev/null

      - name: Enforce deterministic confirmatory QA and checkpoint coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("synthetic_market_hist_qa")
          first = (root / "qa-a.json").read_text(encoding="utf-8")
          second = (root / "qa-b.json").read_text(encoding="utf-8")
          assert first == second
          result = json.loads(first)
          assert result["experiment_id"] == "MARKET-HIST-QA-001"
          assert result["effective_overall_status"] == "ELIGIBLE_CONFIRMATORY"
          assert result["qa_report"]["denominator_end_date"] == "2025-12-10"
          assert result["companion_structural_errors"] == []
          assert len(result["artifact_sha256"]) == 64
          assert len(result["checkpoint_coverage"]) == 2
          for tour in result["checkpoint_coverage"]:
              assert tour["eligible_canonical"] == 1500
              overall = {item["checkpoint_name"]: item for item in tour["overall"]}
              assert overall["CLOSE_PREPLAY"]["executable_coverage"] == 1.0
              assert overall["T-15M"]["executable_coverage"] == 1.0
              assert overall["T-1H"]["executable_coverage"] == 0.5
              assert overall["T-6H"]["executable_coverage"] == 0.25
              assert overall["T-24H"]["executable_coverage"] == 0.1
              years = {item["year"]: item for item in tour["annual"]}
              assert set(range(2020, 2026)).issubset(years)
          PY

      - name: Enforce physical source tamper detection
        run: |
          printf 'tampered' >> synthetic_market_hist_qa/source/bundle.jsonl
          set +e
          python -m tennis_genome.experiments.market_hist_qa_bundle \
            --source-manifest synthetic_market_hist_qa/manifest.json \
            --market-hist-records synthetic_market_hist_qa/market_hist_001_records.jsonl \
            --pre-match synthetic_market_hist_qa/pre_match.parquet \
            --outcomes synthetic_market_hist_qa/outcomes.parquet \
            --source-root synthetic_market_hist_qa/source \
            --output synthetic_market_hist_qa/qa-tampered.json > /dev/null
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(
              Path("synthetic_market_hist_qa/qa-tampered.json").read_text(encoding="utf-8")
          )
          assert result["effective_overall_status"] == "BLOCKED_STRUCTURAL"
          assert "source manifest verification failed" in " ".join(
              result["qa_report"]["structural_errors"]
          )
          PY

      - name: Upload synthetic QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-market-hist-qa-synthetic
          path: |
            synthetic_market_hist_qa/qa-a.json
            synthetic_market_hist_qa/qa-tampered.json
