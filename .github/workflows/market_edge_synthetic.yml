name: MARKET-EDGE-001 synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - dev/market-edge-v1
    paths:
      - "src/tennis_genome/experiments/market_edge*.py"
      - "src/tennis_genome/evaluation/paired_inference.py"
      - "src/tennis_genome/evaluation/multiple_testing.py"
      - "src/tennis_genome/market/exchange_pricing.py"
      - "tests/test_market_edge*.py"
      - ".github/workflows/market_edge_synthetic.yml"
  pull_request:
    paths:
      - "src/tennis_genome/experiments/market_edge*.py"
      - "src/tennis_genome/evaluation/paired_inference.py"
      - "src/tennis_genome/evaluation/multiple_testing.py"
      - "src/tennis_genome/market/exchange_pricing.py"
      - "tests/test_market_edge*.py"
      - ".github/workflows/market_edge_synthetic.yml"

jobs:
  synthetic-market-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Generate four-claim synthetic artifacts
        run: |
          python - <<'PY'
          import json
          import math
          import random
          from datetime import UTC, date, datetime, timedelta
          from pathlib import Path

          import pandas as pd

          root = Path("synthetic_market_edge")
          root.mkdir(parents=True)
          market_path = root / "market_hist_001_records.jsonl"
          market_lines = []
          pre_match_rows = []
          outcome_rows = []
          reports = {
              ("ATP", "profile"): {"experiment_id": "PROFILE-GAP-001", "tour": "ATP", "predictions": []},
              ("WTA", "profile"): {"experiment_id": "PROFILE-GAP-001", "tour": "WTA", "predictions": []},
              ("ATP", "genome"): {"experiment_id": "GENOME-ADV-001", "tour": "ATP", "predictions": []},
              ("WTA", "genome"): {"experiment_id": "GENOME-ADV-001", "tour": "WTA", "predictions": []},
          }

          for tour_index, tour in enumerate(("ATP", "WTA")):
              rng = random.Random(7000 + tour_index)
              for year in range(2020, 2026):
                  for index in range(24):
                      match_id = f"{tour.lower()}-{year}-{index:03d}"
                      source_market_id = f"market-{match_id}"
                      join_hash = (f"{tour_index}{index:03d}{year:04d}" * 8)[:64]
                      market_p = 0.30 + 0.40 * rng.random()
                      profile_signal = rng.gauss(0.0, 1.0)
                      genome_signal = 0.45 * profile_signal + rng.gauss(0.0, 0.9)
                      true_logit = math.log(market_p / (1.0 - market_p))
                      true_logit += 0.24 * profile_signal + 0.16 * genome_signal
                      true_p = 1.0 / (1.0 + math.exp(-true_logit))
                      outcome_a = rng.random() < true_p

                      event_date = date(year, 6, 15)
                      market_time = datetime(year, 6, 15, 18, 0, tzinfo=UTC)
                      published_at = market_time - timedelta(minutes=5)
                      spread = 0.008
                      implied_back_a = min(0.98, market_p + spread)
                      implied_lay_a = max(0.02, market_p - spread)
                      implied_back_b = min(0.98, 1.0 - market_p + spread)
                      implied_lay_b = max(0.02, 1.0 - market_p - spread)
                      back_a = 1.0 / implied_back_a
                      lay_a = 1.0 / implied_lay_a
                      back_b = 1.0 / implied_back_b
                      lay_b = 1.0 / implied_lay_b

                      market_lines.append(json.dumps({
                          "source_market_id": source_market_id,
                          "join_status": "MATCHED",
                          "join": {
                              "match_id": match_id,
                              "tour": tour,
                              "join_hash": join_hash,
                          },
                          "checkpoints": [{
                              "checkpoint_name": "CLOSE_PREPLAY",
                              "data_package": "ADVANCED",
                              "executable_two_way": True,
                              "seconds_to_start": 300.0,
                              "match_id": match_id,
                              "source_market_id": source_market_id,
                              "best_back_a": back_a,
                              "best_lay_a": lay_a,
                              "best_back_b": back_b,
                              "best_lay_b": lay_b,
                              "published_at": published_at.isoformat(),
                              "market_time": market_time.isoformat(),
                              "market_total_matched": 10000.0 + 10.0 * index,
                              "market_base_rate": 5.0,
                              "record_hash": (f"{year:04d}{index:03d}{tour_index}" * 8)[:64],
                              "join_hash": join_hash,
                          }],
                      }, sort_keys=True))
                      pre_match_rows.append({"match_id": match_id, "event_date": event_date})
                      outcome_rows.append({
                          "match_id": match_id,
                          "a_won": outcome_a,
                          "retirement": False,
                          "walkover": False,
                      })
                      reports[(tour, "profile")]["predictions"].append({
                          "match_id": match_id,
                          "profile_gap_match": profile_signal,
                          "outcome_a": not outcome_a,
                      })
                      genome_row = {
                          "match_id": match_id,
                          "full_neighbor_residual": genome_signal,
                          "core_neighbor_residual": genome_signal,
                          "outcome_a": not outcome_a,
                      }
                      reports[(tour, "genome")]["predictions"].append(genome_row)

          market_path.write_text("\n".join(market_lines) + "\n", encoding="utf-8")
          pd.DataFrame(pre_match_rows).to_parquet(root / "pre_match.parquet", index=False)
          pd.DataFrame(outcome_rows).to_parquet(root / "outcomes.parquet", index=False)
          for (tour, kind), payload in reports.items():
              (root / f"{kind}_{tour.lower()}.json").write_text(
                  json.dumps(payload, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Run MARKET-EDGE-001 family twice
        run: |
          python -m tennis_genome.experiments.market_edge_pipeline \
            --market-hist-records synthetic_market_edge/market_hist_001_records.jsonl \
            --pre-match synthetic_market_edge/pre_match.parquet \
            --outcomes synthetic_market_edge/outcomes.parquet \
            --profile-gap-atp synthetic_market_edge/profile_atp.json \
            --profile-gap-wta synthetic_market_edge/profile_wta.json \
            --genome-atp synthetic_market_edge/genome_atp.json \
            --genome-wta synthetic_market_edge/genome_wta.json \
            --min-prior-rows 24 \
            --output synthetic_market_edge/result-a.json > /dev/null
          python -m tennis_genome.experiments.market_edge_pipeline \
            --market-hist-records synthetic_market_edge/market_hist_001_records.jsonl \
            --pre-match synthetic_market_edge/pre_match.parquet \
            --outcomes synthetic_market_edge/outcomes.parquet \
            --profile-gap-atp synthetic_market_edge/profile_atp.json \
            --profile-gap-wta synthetic_market_edge/profile_wta.json \
            --genome-atp synthetic_market_edge/genome_atp.json \
            --genome-wta synthetic_market_edge/genome_wta.json \
            --min-prior-rows 24 \
            --output synthetic_market_edge/result-b.json > /dev/null

      - name: Enforce four-claim deterministic family
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("synthetic_market_edge")
          a = (root / "result-a.json").read_text(encoding="utf-8")
          b = (root / "result-b.json").read_text(encoding="utf-8")
          assert a == b
          result = json.loads(a)
          assert result["experiment_id"] == "MARKET-EDGE-001"
          assert result["market_probability_method"] == "exchange_mid_implied_proportional_v1"
          assert len(result["coverage"]) == 4
          family = result["family_report"]
          assert family["experiment_id"] == "MARKET-EDGE-001"
          assert "Holm" in family["multiplicity_method"]
          assert len(family["claims"]) == 4
          labels = {item["label"] for item in family["decisions"]}
          assert labels == {
              "ATP:profile_gap",
              "WTA:profile_gap",
              "ATP:genome",
              "WTA:genome",
          }
          assert all(item["matched_claim_rows"] == 144 for item in result["coverage"])
          assert all(claim["last_evaluation_year"] == 2025 for claim in family["claims"])
          assert all(
              math.isfinite(prediction["fit_market_slope_control"])
              and math.isfinite(prediction["fit_market_slope_challenger"])
              for claim in family["claims"]
              for prediction in claim["predictions"]
          )
          PY

      - name: Enforce post-2025 fail-closed boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          from tennis_genome.experiments.market_edge_pipeline import build_market_edge_artifact

          root = Path("synthetic_market_edge")
          pre = pd.read_parquet(root / "pre_match.parquet")
          target = pre.index[0]
          pre.loc[target, "event_date"] = pd.Timestamp("2026-01-01").date()
          bad = root / "pre_match_with_2026.parquet"
          pre.to_parquet(bad, index=False)
          try:
              build_market_edge_artifact(
                  market_hist_records=root / "market_hist_001_records.jsonl",
                  pre_match=bad,
                  outcomes_path=root / "outcomes.parquet",
                  profile_gap_atp=root / "profile_atp.json",
                  profile_gap_wta=root / "profile_wta.json",
                  genome_atp=root / "genome_atp.json",
                  genome_wta=root / "genome_wta.json",
                  min_prior_rows=24,
              )
          except ValueError as exc:
              assert "2025" in str(exc)
          else:
              raise AssertionError("MARKET-EDGE accepted a post-2025 row")
          PY

      - name: Upload synthetic MARKET-EDGE artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-genome-market-edge-synthetic
          path: synthetic_market_edge/result-a.json
