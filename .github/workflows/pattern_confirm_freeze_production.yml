name: PATTERN-CONFIRM-001 Freeze Upstream Production

on:
  push:
    branches: [dev/pattern-confirm-production-hardening]
    paths:
      - .github/workflows/pattern_confirm_freeze_production.yml
      - src/tennis_genome/experiments/pattern_confirm_production.py
      - research/installment_01/pattern_confirm_001_preresult_amendment_001.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      START_YEAR: "2000"
      END_YEAR: "2025"
      LICENSE_NAME: CC BY-NC-SA 4.0
      LICENSE_URL: https://creativecommons.org/licenses/by-nc-sa/4.0/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Static checks
        run: ruff check src/tennis_genome/experiments/pattern_confirm_production.py tests/test_pattern_confirm_production.py
      - name: Download pinned ATP 2000-2025 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_raw/atp
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            filename="atp_matches_${year}.csv"
            url="https://raw.githubusercontent.com/${ARCHIVE_REPO}/${ARCHIVE_COMMIT}/atp/${filename}"
            curl --fail --location --silent --show-error --retry 3 \
              --output "data/research_raw/atp/${filename}" "$url"
          done
          test "$(find data/research_raw/atp -type f | wc -l)" -eq 26
      - name: Build canonical ATP dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research_processed/atp
          args=()
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            args+=(--input "data/research_raw/atp/atp_matches_${year}.csv")
          done
          python -m tennis_genome.pipeline.build_dataset \
            "${args[@]}" \
            --tour ATP \
            --output-dir data/research_processed/atp \
            --source-id "sackmann-archive-${ARCHIVE_COMMIT}-atp-${START_YEAR}-${END_YEAR}" \
            --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror" \
            --source-version "$ARCHIVE_COMMIT" \
            --license-name "$LICENSE_NAME" \
            --license-url "$LICENSE_URL" \
            --allowed-use-status research_allowed \
            > data/research_processed/atp/build_output.json
      - name: Freeze Profile and Strict Core production mappings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen
          python - <<'PY'
          import hashlib
          import json
          from dataclasses import asdict
          from pathlib import Path

          from tennis_genome.data.manifest import verify_canonical_manifest
          from tennis_genome.data.parquet import load_canonical_parquet
          from tennis_genome.experiments.pattern_confirm_production import freeze_production_artifacts

          root = Path('data/research_processed/atp')
          manifest = root / 'atp_manifest.json'
          pre_match = root / 'atp_pre_match.parquet'
          outcomes = root / 'atp_outcomes.parquet'
          stats = root / 'atp_stats.parquet'
          verify_canonical_manifest(
              manifest_path=manifest,
              pre_match_path=pre_match,
              outcome_path=outcomes,
              stats_path=stats,
          )
          matches = load_canonical_parquet(
              pre_match_path=pre_match,
              outcome_path=outcomes,
              stats_path=stats,
          )
          profile, core = freeze_production_artifacts(
              matches,
              canonical_manifest_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),
          )
          Path('frozen/profile_production_001.json').write_text(
              json.dumps(asdict(profile), indent=2, sort_keys=True, allow_nan=False) + '\n'
          )
          Path('frozen/core_production_001.json').write_text(
              json.dumps(asdict(core), indent=2, sort_keys=True, allow_nan=False) + '\n'
          )
          PY
      - name: Verify frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tennis_genome.experiments.pattern_confirm_production import (
              verify_core_artifact,
              verify_profile_artifact,
          )

          profile = verify_profile_artifact(
              json.loads(Path('frozen/profile_production_001.json').read_text())
          )
          core = verify_core_artifact(
              json.loads(Path('frozen/core_production_001.json').read_text())
          )
          assert profile.training_end_year == 2025
          assert core.training_end_year == 2025
          assert profile.training_n == core.training_n
          assert profile.training_rows_sha256 == core.training_rows_sha256
          summary = {
              'profile_artifact_sha256': profile.artifact_sha256,
              'core_artifact_sha256': core.artifact_sha256,
              'training_n': profile.training_n,
              'training_rows_sha256': profile.training_rows_sha256,
              'canonical_manifest_sha256': profile.canonical_manifest_sha256,
              'state_semantics': profile.state_semantics,
          }
          Path('frozen/PRODUCTION_FREEZE_SUMMARY.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(Path('frozen/PRODUCTION_FREEZE_SUMMARY.json').read_text())
          PY
      - name: Preserve production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pattern-confirm-001-production-${{ github.sha }}
          path: frozen/
          retention-days: 90
