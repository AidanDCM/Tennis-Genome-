name: WTA Web Shadow Slate

on:
  push:
    branches:
      - main
    paths:
      - "web-shadow/active-slate.json"
      - "web-shadow/fixtures/**"
      - "scripts/run_web_shadow_slate.py"
      - "scripts/build_web_shadow_local_input.py"
      - "scripts/build_web_shadow_target_state.py"
      - "scripts/run_web_shadow_prediction.py"
      - "scripts/derive_web_shadow_elo_baseline.py"
      - "scripts/manage_web_shadow_history_cache.py"
      - ".github/workflows/wta_web_shadow_slate.yml"
      - "src/tennis_genome/features/**"
      - "src/tennis_genome/ratings/**"
      - "src/tennis_genome/evaluation/**"
      - "src/tennis_genome/calculator/**"
      - "src/tennis_genome/prospective/web_shadow.py"
      - "artifacts/tge_independent_v1_production/**"
  workflow_dispatch:
    inputs:
      slate_path:
        description: "Repository path under web-shadow/"
        required: true
        default: "web-shadow/active-slate.json"
        type: string

permissions:
  contents: read

concurrency:
  group: wta-web-shadow-slate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict-slate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PINNED_ARCHIVE_REPO: Aneeshers/tennis-sackmann-archive
      PINNED_ARCHIVE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      PINNED_2026_MATCHES_BLOB: 4989661bc24d621417b344d22c5e5a2b8ef5119e
      PINNED_2026_QUAL_ITF_BLOB: 429fe4fc3a7736fda1d5c711ae587a6146490cf0
      PINNED_HISTORY_MAX_DATE: 2026-06-02
      WEB_SHADOW_HISTORY_MODE: PINNED_PUBLIC_HISTORY_THROUGH_2026_06_02

    steps:
      - uses: actions/checkout@v4

      - name: Resolve slate path
        shell: bash
        env:
          DISPATCH_SLATE_PATH: ${{ inputs.slate_path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            SLATE_PATH="web-shadow/active-slate.json"
          else
            SLATE_PATH="${DISPATCH_SLATE_PATH}"
          fi
          case "${SLATE_PATH}" in
            web-shadow/*.json) ;;
            *) echo "slate_path must be under web-shadow/" >&2; exit 1 ;;
          esac
          test -f "${SLATE_PATH}"
          echo "SLATE_PATH=${SLATE_PATH}" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          check-latest: false
          cache: "pip"
          cache-dependency-path: requirements/ci.lock

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Restore pinned Web Shadow history cache
        id: history-cache
        uses: actions/cache@v4
        with:
          path: |
            data/wta-live-base/wta_pre_match.parquet
            data/wta-live-base/wta_outcomes.parquet
            data/wta-live-base/wta_stats.parquet
            data/wta-live-base/2026-source-reconciliation.json
            data/wta-live-base/history-cache-receipt.json
            data/wta_players.csv
          key: >-
            web-shadow-wta-history-v1-${{ runner.os }}-${{ env.PINNED_ARCHIVE_COMMIT }}-${{ env.PINNED_2026_MATCHES_BLOB }}-${{ env.PINNED_2026_QUAL_ITF_BLOB }}-${{ hashFiles('src/tennis_genome/data/**', 'src/tennis_genome/pipeline/**', 'scripts/reconcile_web_shadow_2026_history.py', 'scripts/manage_web_shadow_history_cache.py', 'config/web_shadow_history_cache.json', 'requirements/ci.lock', 'pyproject.toml') }}

      - name: Download pinned WTA history through June 2 2026 once
        if: steps.history-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/wta-live-raw data/wta-live-base
          for year in $(seq 2000 2025); do
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors               "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_${year}.csv"               --output "data/wta-live-raw/wta_matches_${year}.csv"
          done
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_2026.csv"             --output data/wta-live-raw/wta_matches_2026.csv
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_matches_qual_itf_2026.csv"             --output data/wta-live-raw/wta_matches_qual_itf_2026.csv
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors             "https://raw.githubusercontent.com/${PINNED_ARCHIVE_REPO}/${PINNED_ARCHIVE_COMMIT}/wta/wta_players.csv"             --output data/wta_players.csv
          test "$(git hash-object data/wta-live-raw/wta_matches_2026.csv)" = "${PINNED_2026_MATCHES_BLOB}"
          test "$(git hash-object data/wta-live-raw/wta_matches_qual_itf_2026.csv)" = "${PINNED_2026_QUAL_ITF_BLOB}"
          test "$(find data/wta-live-raw -type f -name 'wta_matches_*.csv' | wc -l)" -eq 28
          test -s data/wta_players.csv

      - name: Reconcile overlapping pinned 2026 sources
        if: steps.history-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.reconcile_web_shadow_2026_history \
            --primary data/wta-live-raw/wta_matches_2026.csv \
            --secondary data/wta-live-raw/wta_matches_qual_itf_2026.csv \
            --output data/wta-live-raw/wta_matches_qual_itf_2026_reconciled.csv \
            --receipt data/wta-live-base/2026-source-reconciliation.json \
            --expected-exact-duplicate-rows 216 \
            --expected-cross-source-overlap-rows 0

      - name: Rebuild canonical pinned WTA history once
        if: steps.history-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for year in $(seq 2000 2026); do
            args+=(--input "data/wta-live-raw/wta_matches_${year}.csv")
          done
          args+=(--input data/wta-live-raw/wta_matches_qual_itf_2026_reconciled.csv)
          python -m tennis_genome.pipeline.build_dataset             "${args[@]}"             --tour WTA             --output-dir data/wta-live-base             --source-id "sackmann-archive-${PINNED_ARCHIVE_COMMIT}-wta-through-20260602"             --provider "Jeff Sackmann / Tennis Abstract via Aneeshers archival mirror"             --source-version "${PINNED_ARCHIVE_COMMIT}"             --license-name "CC BY-NC-SA 4.0"             --license-url "https://creativecommons.org/licenses/by-nc-sa/4.0/"             --allowed-use-status research_allowed             > data/wta-live-base/build_output.json

      - name: Write pinned Web Shadow history cache receipt
        if: steps.history-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.manage_web_shadow_history_cache write \
            --archive-repo "${PINNED_ARCHIVE_REPO}" \
            --archive-commit "${PINNED_ARCHIVE_COMMIT}" \
            --matches-2026-blob "${PINNED_2026_MATCHES_BLOB}" \
            --qual-itf-2026-blob "${PINNED_2026_QUAL_ITF_BLOB}" \
            --expected-history-max-date "${PINNED_HISTORY_MAX_DATE}" \
            --expected-spec config/web_shadow_history_cache.json

      - name: Verify pinned Web Shadow history cache receipt
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.manage_web_shadow_history_cache verify \
            --archive-repo "${PINNED_ARCHIVE_REPO}" \
            --archive-commit "${PINNED_ARCHIVE_COMMIT}" \
            --matches-2026-blob "${PINNED_2026_MATCHES_BLOB}" \
            --qual-itf-2026-blob "${PINNED_2026_QUAL_ITF_BLOB}" \
            --expected-history-max-date "${PINNED_HISTORY_MAX_DATE}" \
            --expected-spec config/web_shadow_history_cache.json

      - name: Run Web Shadow slate
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_web_shadow_slate             --slate "${SLATE_PATH}"             --registry data/wta_players.csv             --base-dir data/wta-live-base             --bundle artifacts/tge_independent_v1_production/tge_independent_v1_production.json             --model-source-sha "${GITHUB_SHA}"             --output-root web-shadow-slate-run             --history-mode "${WEB_SHADOW_HISTORY_MODE}"             --expected-history-max-date "${PINNED_HISTORY_MAX_DATE}"             2>&1 | tee web-shadow-slate-summary.json

      - name: Verify slate accounting and isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("web-shadow-slate-run/slate-manifest.json").read_text()
          )
          eligible = int(manifest["eligible_target_count"])
          predicted = int(manifest["predicted_target_count"])
          skipped = int(manifest["skipped_target_count"])
          if eligible <= 0:
              raise SystemExit("Web Shadow slate denominator is empty")
          if predicted + skipped != eligible:
              raise SystemExit("predicted + skipped differs from slate denominator")
          if manifest.get("production_eligible") is not False:
              raise SystemExit("Web Shadow slate must remain non-production")
          if manifest.get("history_mode") != "PINNED_PUBLIC_HISTORY_THROUGH_2026_06_02":
              raise SystemExit("unexpected Web Shadow history mode")
          if int(manifest.get("shared_history_load_count", -1)) != 1:
              raise SystemExit("Web Shadow slate did not share one history load")
          if int(manifest.get("shared_calculator_load_count", -1)) != 1:
              raise SystemExit("Web Shadow slate did not share one calculator load")
          feature_targets = int(manifest.get("shared_feature_target_count", -1))
          feature_date_passes = int(manifest.get("shared_feature_date_pass_count", -1))
          if feature_targets < predicted or feature_targets > eligible:
              raise SystemExit("shared feature target accounting is invalid")
          if feature_date_passes < 0 or feature_date_passes > feature_targets:
              raise SystemExit("shared feature date-pass accounting is invalid")
          if predicted > 0 and feature_date_passes <= 0:
              raise SystemExit("predicted slate has no shared feature pass")
          for result in manifest["results"]:
              record = json.loads(Path(result["prediction_path"]).read_text())
              if record.get("production_eligible") is not False:
                  raise SystemExit("Web Shadow prediction escaped isolation")
              candidate_path = Path(result["baseline_candidate_path"])
              candidate = json.loads(candidate_path.read_text())
              if candidate.get("record_type") != "WEB_SHADOW_BASELINE_CANDIDATE":
                  raise SystemExit("unexpected Web Shadow baseline candidate type")
              if candidate.get("production_eligible") is not False:
                  raise SystemExit("Web Shadow baseline candidate escaped isolation")
              if (
                  candidate.get("prediction_record_sha256")
                  != record.get("record_sha256")
              ):
                  raise SystemExit("baseline candidate prediction SHA mismatch")
              if (
                  candidate.get("record_sha256")
                  != result.get("baseline_candidate_record_sha256")
              ):
                  raise SystemExit("baseline candidate record SHA mismatch")
              p_a = float(candidate["p_player_a"])
              p_b = float(candidate["p_player_b"])
              if not (0.0 <= p_a <= 1.0 and 0.0 <= p_b <= 1.0):
                  raise SystemExit("baseline candidate probability out of range")
              if abs((p_a + p_b) - 1.0) > 1e-12:
                  raise SystemExit("baseline candidate probabilities do not sum to one")
          PY

      - name: Upload Web Shadow slate artifact
        id: raw_slate_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shadow-slate-${{ github.run_id }}
          path: |
            web-shadow-slate-run/
            web-shadow-slate-summary.json
            data/wta-live-base/2026-source-reconciliation.json
            data/wta-live-base/history-cache-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Finalize artifact-bound Web Shadow evidence
        if: success()
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ steps.raw_slate_artifact.outputs['artifact-id'] }}
          RAW_ARTIFACT_DIGEST: ${{ steps.raw_slate_artifact.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          python -m scripts.finalize_web_shadow_slate_evidence \
            --slate-root web-shadow-slate-run \
            --source-reconciliation data/wta-live-base/2026-source-reconciliation.json \
            --history-cache-receipt data/wta-live-base/history-cache-receipt.json \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-artifact-id "${RAW_ARTIFACT_ID}" \
            --workflow-artifact-sha256 "${RAW_ARTIFACT_DIGEST}" \
            --workflow-source-sha "${GITHUB_SHA}" \
            --output-root web-shadow-bound-evidence

      - name: Verify bound Web Shadow evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("web-shadow-bound-evidence/bound-evidence-manifest.json")
              .read_text(encoding="utf-8")
          )
          receipt = json.loads(
              Path("web-shadow-bound-evidence/slate-receipt.json")
              .read_text(encoding="utf-8")
          )
          predicted = int(summary["predicted_target_count"])
          if predicted <= 0:
              raise SystemExit("bound Web Shadow evidence has no predictions")
          if int(summary["baseline_count"]) != predicted:
              raise SystemExit("bound baseline count differs from predicted count")
          if summary.get("production_eligible") is not False:
              raise SystemExit("bound Web Shadow evidence escaped isolation")
          if receipt.get("scorecard_eligible") is not True:
              raise SystemExit("bound Web Shadow slate receipt is not scorecard eligible")
          if int(receipt["predicted_target_count"]) != predicted:
              raise SystemExit("bound slate receipt prediction count mismatch")
          PY

      - name: Upload bound Web Shadow evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-shadow-bound-evidence-${{ github.run_id }}
          path: web-shadow-bound-evidence/
          if-no-files-found: error
          retention-days: 90
