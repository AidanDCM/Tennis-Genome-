name: WTA Web Shadow Auto Freeze

on:
  workflow_run:
    workflows:
      - "WTA Web Shadow Slate"
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  freeze-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard idempotency
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          branch="ops/web-shadow-auto-freeze-${SOURCE_RUN_ID}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          existing_pr="$(gh pr list \
            --repo "${REPO}" \
            --head "${branch}" \
            --state all \
            --limit 1 \
            --json number,state,mergedAt,url)"
          count="$(jq 'length' <<<"${existing_pr}")"
          if [ "${count}" -gt 1 ]; then
            echo "multiple pull requests unexpectedly use ${branch}" >&2
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            state="$(jq -r '.[0].state' <<<"${existing_pr}")"
            merged_at="$(jq -r '.[0].mergedAt // empty' <<<"${existing_pr}")"
            url="$(jq -r '.[0].url' <<<"${existing_pr}")"
            if [ "${state}" = "OPEN" ] || [ -n "${merged_at}" ]; then
              echo "Web Shadow run ${SOURCE_RUN_ID} is already represented by ${url}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "existing auto-freeze PR for run ${SOURCE_RUN_ID} was closed without merge" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            compare_url="https://github.com/${REPO}/compare/main...${branch}?expand=1"
            echo "remote branch ${branch} exists without a pull request; preserved and requires manual PR publication"
            {
              echo "## Web Shadow freeze proposal preserved"
              echo
              echo "Validated branch \`${branch}\` already exists without a pull request."
              echo
              echo "Manual PR publication: ${compare_url}"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          check-latest: false
          cache: "pip"
          cache-dependency-path: requirements/ci.lock

      - name: Install pinned runtime and test tools
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Resolve exact bound artifact
        if: steps.guard.outputs.skip != 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="web-shadow-bound-evidence-${SOURCE_RUN_ID}"
          metadata="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"

          matches="$(jq --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name and .expired == false)]' \
            <<<"${metadata}")"
          count="$(jq 'length' <<<"${matches}")"
          if [ "${count}" -ne 1 ]; then
            echo "expected exactly one live bound artifact named ${artifact_name}; found ${count}" >&2
            exit 1
          fi

          artifact_id="$(jq -r '.[0].id' <<<"${matches}")"
          artifact_digest="$(jq -r '.[0].digest // empty' <<<"${matches}")"
          artifact_run_id="$(jq -r '.[0].workflow_run.id // empty' <<<"${matches}")"
          artifact_head_sha="$(jq -r '.[0].workflow_run.head_sha // empty' <<<"${matches}")"

          if ! [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "bound artifact ID is invalid" >&2
            exit 1
          fi
          if ! [[ "${artifact_digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "bound artifact digest is missing or invalid" >&2
            exit 1
          fi
          if [ "${artifact_run_id}" != "${SOURCE_RUN_ID}" ]; then
            echo "bound artifact workflow run identity mismatch" >&2
            exit 1
          fi
          if [ "${artifact_head_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "bound artifact source SHA differs from triggering run" >&2
            exit 1
          fi

          digest_hex="${artifact_digest#sha256:}"
          echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${digest_hex}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Download immutable bound artifact ZIP
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          BOUND_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          BOUND_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/web-shadow-bound-evidence.zip"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${BOUND_ARTIFACT_ID}/zip" \
            --output "${destination}"

          observed="$(sha256sum "${destination}" | awk '{print $1}')"
          if [ "${observed}" != "${BOUND_ARTIFACT_SHA256}" ]; then
            echo "downloaded bound artifact digest differs from GitHub metadata" >&2
            exit 1
          fi

      - name: Freeze bound evidence transactionally
        if: steps.guard.outputs.skip != 'true'
        id: freeze
        shell: bash
        env:
          BOUND_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          BOUND_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/web-shadow-freeze-summary.json"
          python -m scripts.freeze_web_shadow_bound_evidence \
            --artifact-zip "${RUNNER_TEMP}/web-shadow-bound-evidence.zip" \
            --repo-root . \
            --scorecard web-shadow/scorecard.json \
            --bound-artifact-id "${BOUND_ARTIFACT_ID}" \
            --bound-artifact-sha256 "${BOUND_ARTIFACT_SHA256}" \
            | tee "${summary}"

          slate_id="$(jq -r '.slate_id // empty' "${summary}")"
          raw_run_id="$(jq -r '.raw_workflow_run_id // empty' "${summary}")"
          source_sha="$(jq -r '.workflow_source_sha // empty' "${summary}")"
          if [ -z "${slate_id}" ]; then
            echo "freeze summary did not contain a slate ID" >&2
            exit 1
          fi
          if [ "${raw_run_id}" != "${SOURCE_RUN_ID}" ]; then
            echo "freeze summary run ID differs from triggering run" >&2
            exit 1
          fi
          if [ "${source_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "freeze summary source SHA differs from triggering run" >&2
            exit 1
          fi
          echo "slate_id=${slate_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify mutation scope
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          SLATE_ID: ${{ steps.freeze.outputs.slate_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          slate_id = os.environ["SLATE_ID"]
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "-z"]
          ).decode("utf-8")
          entries = [entry for entry in raw.split("\0") if entry]
          if not entries:
              raise SystemExit("auto-freeze produced no repository changes")

          allowed_prefix = f"web-shadow/slates/{slate_id}/"
          saw_scorecard = False
          saw_slate = False
          for entry in entries:
              if len(entry) < 4:
                  raise SystemExit(f"unexpected git status entry: {entry!r}")
              path = entry[3:]
              if " -> " in path:
                  raise SystemExit(f"renames are not allowed in auto-freeze: {path}")
              if path == "web-shadow/scorecard.json":
                  saw_scorecard = True
                  continue
              if path.startswith(allowed_prefix):
                  saw_slate = True
                  continue
              raise SystemExit(f"auto-freeze changed an unexpected path: {path}")

          if not saw_scorecard or not saw_slate:
              raise SystemExit("auto-freeze must change the scorecard and one immutable slate")
          PY

      - name: Run full repository checks
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          pytest

      - name: Create audited freeze pull request
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          SLATE_ID: ${{ steps.freeze.outputs.slate_id }}
          BOUND_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          BOUND_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          BOUND_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add web-shadow/scorecard.json "web-shadow/slates/${SLATE_ID}"
          if git diff --cached --quiet; then
            echo "nothing was staged for the freeze PR" >&2
            exit 1
          fi
          git commit -m "Freeze Web Shadow slate ${SLATE_ID}"
          git push origin "HEAD:${BRANCH}"

          body="${RUNNER_TEMP}/web-shadow-freeze-pr.md"
          cat > "${body}" <<EOF
          ## Automated Web Shadow freeze

          This PR was generated from a successful **push-triggered main-branch** Web Shadow run.

          - Slate: \`${SLATE_ID}\`
          - Source workflow run: \`${SOURCE_RUN_ID}\`
          - Source commit: \`${SOURCE_HEAD_SHA}\`
          - Bound artifact: \`${BOUND_ARTIFACT_NAME}\`
          - Bound artifact ID: \`${BOUND_ARTIFACT_ID}\`
          - Bound artifact SHA-256: \`${BOUND_ARTIFACT_SHA256}\`

          The orchestration reverified GitHub artifact identity/digest, froze the bound evidence transactionally, confined mutations to the scorecard plus this immutable slate, and ran Ruff plus the full pytest suite before opening this PR.

          **No provider requests, model changes, production routing changes, or automatic merge.**
          EOF

          if ! pr_url="$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "Freeze official Web Shadow slate ${SLATE_ID}" \
            --body-file "${body}")"; then
            compare_url="https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
            echo "unable to create the freeze PR with GITHUB_TOKEN; validated branch ${BRANCH} is preserved and requires manual PR publication" >&2
            {
              echo "## Web Shadow freeze proposal preserved"
              echo
              echo "GitHub blocked automatic PR publication. The validated branch \`${BRANCH}\` was preserved."
              echo
              echo "Manual PR publication: ${compare_url}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "Created ${pr_url}"
