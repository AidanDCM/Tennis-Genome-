name: Challenger Shadow Settlement Dispatch Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/challenger-shadow-settlement-request.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: challenger-shadow-settlement-dispatch-bridge
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate shadow settlement request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          path = Path('.github/challenger-shadow-settlement-request.json')
          raw = path.read_bytes()
          request = json.loads(raw)
          expected = {
              'schema_version',
              'request_id',
              'shadow_artifact_id',
              'verified_settlement_artifact_id',
          }
          if not isinstance(request, dict) or set(request) != expected:
              raise SystemExit('shadow settlement request has unexpected fields')
          if request['schema_version'] != 'tennis-genome-challenger-shadow-settlement-request-v1':
              raise SystemExit('unsupported shadow settlement request schema')
          if re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', str(request['request_id'])) is None:
              raise SystemExit('request_id has unsupported format')
          if os.environ.get('GITHUB_REF_NAME') != 'main':
              raise SystemExit('shadow settlement dispatch bridge must run from main')
          if os.environ.get('GITHUB_REPOSITORY') != 'AidanDCM/Tennis-Genome-':
              raise SystemExit('unexpected repository')
          for key in ('shadow_artifact_id', 'verified_settlement_artifact_id'):
              value = str(request[key])
              if re.fullmatch(r'[1-9][0-9]*', value) is None:
                  raise SystemExit(f'{key} must be a positive integer')
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"request_id={request['request_id']}\n")
              handle.write(f"request_sha256={hashlib.sha256(raw).hexdigest()}\n")
              handle.write(f"shadow_artifact_id={request['shadow_artifact_id']}\n")
              handle.write(
                  'verified_settlement_artifact_id='
                  f"{request['verified_settlement_artifact_id']}\n"
              )
          PY

      - name: Dispatch trusted shadow settlement finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          SHADOW_ARTIFACT_ID: ${{ steps.request.outputs.shadow_artifact_id }}
          VERIFIED_SETTLEMENT_ARTIFACT_ID: ${{ steps.request.outputs.verified_settlement_artifact_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python -S - <<'PY'
          import json
          import os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'shadow_artifact_id': os.environ['SHADOW_ARTIFACT_ID'],
                  'verified_settlement_artifact_id': os.environ[
                      'VERIFIED_SETTLEMENT_ARTIFACT_ID'
                  ],
              },
          }, separators=(',', ':')))
          PY
          )
          code=$(curl --silent --show-error \
            --output shadow-settlement-dispatch-response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/challenger_shadow_settlement_finalize.yml/dispatches" \
            -d "$payload")
          if [ "$code" != "204" ]; then
            cat shadow-settlement-dispatch-response.txt
            echo "::error::shadow settlement dispatch returned HTTP ${code}"
            exit 1
          fi
          printf 'shadow_settlement_request_id=%s\n' "$REQUEST_ID"
          printf 'shadow_settlement_request_sha256=%s\n' "$REQUEST_SHA256"
          printf 'shadow_settlement_artifact_id=%s\n' "$SHADOW_ARTIFACT_ID"
          printf 'verified_settlement_artifact_id=%s\n' "$VERIFIED_SETTLEMENT_ARTIFACT_ID"
