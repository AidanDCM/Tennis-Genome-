name: WTA Web Shadow Auto Settlement

on:
  workflow_run:
    workflows:
      - "WTA Web Shadow Settlement Batch"
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  settlement-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard idempotency
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          branch="ops/web-shadow-auto-settlement-${SOURCE_RUN_ID}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          existing_pr="$(gh pr list \
            --repo "${REPO}" \
            --head "${branch}" \
            --state all \
            --limit 1 \
            --json number,state,mergedAt,url)"
          count="$(jq 'length' <<<"${existing_pr}")"
          if [ "${count}" -gt 1 ]; then
            echo "multiple pull requests unexpectedly use ${branch}" >&2
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            state="$(jq -r '.[0].state' <<<"${existing_pr}")"
            merged_at="$(jq -r '.[0].mergedAt // empty' <<<"${existing_pr}")"
            url="$(jq -r '.[0].url' <<<"${existing_pr}")"
            if [ "${state}" = "OPEN" ] || [ -n "${merged_at}" ]; then
              echo "Settlement run ${SOURCE_RUN_ID} is already represented by ${url}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "existing auto-settlement PR for run ${SOURCE_RUN_ID} was closed without merge" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "remote branch ${branch} exists without a pull request; refusing to overwrite it" >&2
            exit 1
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          check-latest: false
          cache: "pip"
          cache-dependency-path: requirements/ci.lock

      - name: Install pinned runtime and test tools
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps

      - name: Resolve exact settlement batch artifact
        if: steps.guard.outputs.skip != 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="web-shadow-settlement-batch-${SOURCE_RUN_ID}"
          metadata="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"

          matches="$(jq --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name and .expired == false)]' \
            <<<"${metadata}")"
          count="$(jq 'length' <<<"${matches}")"
          if [ "${count}" -ne 1 ]; then
            echo "expected exactly one live settlement artifact named ${artifact_name}; found ${count}" >&2
            exit 1
          fi

          artifact_id="$(jq -r '.[0].id' <<<"${matches}")"
          artifact_digest="$(jq -r '.[0].digest // empty' <<<"${matches}")"
          artifact_run_id="$(jq -r '.[0].workflow_run.id // empty' <<<"${matches}")"
          artifact_head_sha="$(jq -r '.[0].workflow_run.head_sha // empty' <<<"${matches}")"

          if ! [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "settlement artifact ID is invalid" >&2
            exit 1
          fi
          if ! [[ "${artifact_digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "settlement artifact digest is missing or invalid" >&2
            exit 1
          fi
          if [ "${artifact_run_id}" != "${SOURCE_RUN_ID}" ]; then
            echo "settlement artifact workflow run identity mismatch" >&2
            exit 1
          fi
          if [ "${artifact_head_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "settlement artifact source SHA differs from triggering run" >&2
            exit 1
          fi

          digest_hex="${artifact_digest#sha256:}"
          echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${digest_hex}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Download immutable settlement artifact ZIP
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          SETTLEMENT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SETTLEMENT_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/web-shadow-settlement-batch.zip"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${SETTLEMENT_ARTIFACT_ID}/zip" \
            --output "${destination}"

          observed="$(sha256sum "${destination}" | awk '{print $1}')"
          if [ "${observed}" != "${SETTLEMENT_ARTIFACT_SHA256}" ]; then
            echo "downloaded settlement artifact digest differs from GitHub metadata" >&2
            exit 1
          fi

      - name: Apply settlement batch transactionally
        if: steps.guard.outputs.skip != 'true'
        id: apply
        shell: bash
        env:
          SETTLEMENT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SETTLEMENT_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/web-shadow-settlement-apply-summary.json"
          python -m scripts.apply_web_shadow_settlement_batch \
            --artifact-zip "${RUNNER_TEMP}/web-shadow-settlement-batch.zip" \
            --repo-root . \
            --scorecard web-shadow/scorecard.json \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-sha "${SOURCE_HEAD_SHA}" \
            --settlement-artifact-id "${SETTLEMENT_ARTIFACT_ID}" \
            --settlement-artifact-sha256 "${SETTLEMENT_ARTIFACT_SHA256}" \
            | tee "${summary}"

          applied="$(jq -r '.applied_settlement_count // empty' "${summary}")"
          run_id="$(jq -r '.source_workflow_run_id // empty' "${summary}")"
          source_sha="$(jq -r '.source_workflow_sha // empty' "${summary}")"
          receipt_path="$(jq -r '.settlement_batch_receipt_path // empty' "${summary}")"
          if ! [[ "${applied}" =~ ^[1-9][0-9]*$ ]]; then
            echo "settlement apply summary has invalid applied count" >&2
            exit 1
          fi
          if [ "${run_id}" != "${SOURCE_RUN_ID}" ]; then
            echo "settlement apply run ID differs from triggering run" >&2
            exit 1
          fi
          if [ "${source_sha}" != "${SOURCE_HEAD_SHA}" ]; then
            echo "settlement apply source SHA differs from triggering run" >&2
            exit 1
          fi
          if [ "${receipt_path}" != "web-shadow/settlement-batches/${SOURCE_RUN_ID}/artifact-receipt.json" ]; then
            echo "settlement batch receipt path differs from triggering run" >&2
            exit 1
          fi
          echo "summary_path=${summary}" >> "${GITHUB_OUTPUT}"
          echo "applied_count=${applied}" >> "${GITHUB_OUTPUT}"

      - name: Verify mutation scope
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.apply.outputs.summary_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY_PATH"]).read_text(encoding="utf-8"))
          source_run_id = str(summary["source_workflow_run_id"])
          expected_settlements = int(summary["applied_settlement_count"])
          affected_slates = set(summary["affected_slate_ids"])

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "-z"]
          ).decode("utf-8")
          entries = [entry for entry in raw.split("\0") if entry]
          if not entries:
              raise SystemExit("auto-settlement produced no repository changes")

          saw_scorecard = False
          settlement_count = 0
          receipt_count = 0
          receipt_prefix = f"web-shadow/settlement-batches/{source_run_id}/"

          for entry in entries:
              if len(entry) < 4:
                  raise SystemExit(f"unexpected git status entry: {entry!r}")
              path = entry[3:]
              if " -> " in path:
                  raise SystemExit(
                      f"renames are not allowed in auto-settlement: {path}"
                  )
              if path == "web-shadow/scorecard.json":
                  saw_scorecard = True
                  continue
              if path.startswith(receipt_prefix):
                  receipt_count += 1
                  continue

              parts = Path(path).parts
              if (
                  len(parts) == 5
                  and parts[0] == "web-shadow"
                  and parts[1] == "slates"
                  and parts[2] in affected_slates
                  and parts[3] == "settlements"
                  and parts[4].endswith(".json")
              ):
                  settlement_count += 1
                  continue
              raise SystemExit(
                  f"auto-settlement changed an unexpected path: {path}"
              )

          if not saw_scorecard:
              raise SystemExit("auto-settlement must update the official scorecard")
          if settlement_count != expected_settlements:
              raise SystemExit(
                  "auto-settlement immutable settlement-file count drift"
              )
          if receipt_count != 3:
              raise SystemExit(
                  "auto-settlement must retain summary, manifest, and artifact receipt"
              )
          PY

      - name: Run full repository checks
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          pytest

      - name: Create audited settlement pull request
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          SUMMARY_PATH: ${{ steps.apply.outputs.summary_path }}
          SETTLEMENT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          SETTLEMENT_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          SETTLEMENT_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          applied="$(jq -r '.applied_settlement_count' "${SUMMARY_PATH}")"
          eligible="$(jq -r '.evaluation_eligible_count' "${SUMMARY_PATH}")"
          excluded="$(jq -r '.excluded_noncompleted_count' "${SUMMARY_PATH}")"
          affected="$(jq -r '.affected_slate_ids | join(", ")' "${SUMMARY_PATH}")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add \
            web-shadow/scorecard.json \
            web-shadow/slates \
            "web-shadow/settlement-batches/${SOURCE_RUN_ID}"
          if git diff --cached --quiet; then
            echo "nothing was staged for the settlement PR" >&2
            exit 1
          fi
          git commit -m "Settle Web Shadow batch ${SOURCE_RUN_ID}"
          git push origin "HEAD:${BRANCH}"

          body="${RUNNER_TEMP}/web-shadow-settlement-pr.md"
          cat > "${body}" <<EOF
          ## Automated Web Shadow settlement

          This PR was generated from a successful **push-triggered main-branch** settlement-batch run.

          - Source workflow run: \`${SOURCE_RUN_ID}\`
          - Source commit: \`${SOURCE_HEAD_SHA}\`
          - Settlement artifact: \`${SETTLEMENT_ARTIFACT_NAME}\`
          - Settlement artifact ID: \`${SETTLEMENT_ARTIFACT_ID}\`
          - Settlement artifact SHA-256: \`${SETTLEMENT_ARTIFACT_SHA256}\`
          - Applied settlements: \`${applied}\`
          - Evaluation-eligible completed matches: \`${eligible}\`
          - Retained non-completed finishes excluded from metrics: \`${excluded}\`
          - Affected slates: \`${affected}\`

          The orchestration reverified GitHub artifact identity/digest, result-file hashes, prediction/settlement linkage, metric eligibility, scorecard accounting, mutation scope, and the full repository test suite before opening this PR.

          **No provider requests, model changes, production routing changes, or automatic merge.**
          EOF

          if ! pr_url="$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "Settle official Web Shadow batch ${SOURCE_RUN_ID}" \
            --body-file "${body}")"; then
            git push origin --delete "${BRANCH}" || true
            echo "unable to create the settlement PR with GITHUB_TOKEN" >&2
            echo "repository Actions settings must allow GitHub Actions to create pull requests" >&2
            exit 1
          fi
          echo "Created ${pr_url}"
