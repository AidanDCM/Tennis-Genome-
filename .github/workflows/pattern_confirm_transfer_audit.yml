name: PATTERN-CONFIRM-001 Baseline Transfer Audit

on:
  push:
    branches: [dev/pattern-confirm-production-hardening]
    paths:
      - .github/workflows/pattern_confirm_transfer_audit.yml
      - src/tennis_genome/experiments/pattern_confirm_transfer_audit.py
      - research/installment_01/pattern_confirm_001_market_core_fit.json
      - research/installment_01/pattern_confirm_001_preresult_amendment_001.md

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Static checks
        run: ruff check src/tennis_genome/experiments/pattern_confirm_transfer_audit.py
      - name: Download immutable PATTERN-DISCOVERY-001 artifact
        uses: actions/download-artifact@v4
        with:
          name: pattern-discovery-001-6014a691fb53cd7f3dbdd6179ac20419b80002f4
          path: inputs/discovery
          github-token: ${{ github.token }}
          run-id: 34633660089
      - name: Verify discovery artifact files
        shell: bash
        run: |
          set -euo pipefail
          echo '1d71222ab477eec65a06a3e7c76ac0af1c282e6f2a7164e8c47b37afc7192628  inputs/discovery/feature_ledger.jsonl' | sha256sum --check
          echo '3fb6ae9b670dca30e2b5085c0ace72ced926be16e1d8bbfa9874b0c7abcb0c6c  inputs/discovery/residual_ledger.jsonl' | sha256sum --check
      - name: Re-score spent validation block under prospective pooled baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python -m tennis_genome.experiments.pattern_confirm_transfer_audit \
            --feature-ledger inputs/discovery/feature_ledger.jsonl \
            --residual-ledger inputs/discovery/residual_ledger.jsonl \
            --discovery-summary inputs/discovery/PATTERN_DISCOVERY_SUMMARY.json \
            --fit research/installment_01/pattern_confirm_001_market_core_fit.json \
            --output audit/pattern_confirm_001_baseline_transfer_audit.json
          cat audit/pattern_confirm_001_baseline_transfer_audit.json
      - name: Preserve audit
        uses: actions/upload-artifact@v4
        with:
          name: pattern-confirm-001-baseline-transfer-${{ github.sha }}
          path: audit/
          retention-days: 90
