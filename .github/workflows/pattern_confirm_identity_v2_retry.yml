name: PATTERN-CONFIRM Season Identity v2 Retry

on:
  push:
    branches: [dev/pattern-confirm-provider-dryrun]
    paths:
      - .github/workflows/pattern_confirm_identity_v2_retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pattern-confirm-provider-dryrun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind season ID and source date
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tennis_genome/experiments/pattern_confirm_live_identity.py')
          text = path.read_text()
          if '_VERSION = "pattern-confirm-identity-v2"' not in text:
              text = text.replace('_VERSION = "pattern-confirm-identity-v1"', '_VERSION = "pattern-confirm-identity-v2"')
              text = text.replace(
                  '    competition_id: str\n    competition_name: str\n    scheduled_start: str\n',
                  '    competition_id: str\n    competition_name: str\n    season_id: str\n    season_start_date: str\n    scheduled_start: str\n',
                  1,
              )
              text = text.replace(
                  '    competition_name: str\n    competition_type: str\n    player_a_sportradar_id: str\n',
                  '    competition_name: str\n    competition_type: str\n    season_id: str\n    season_start_date: str\n    player_a_sportradar_id: str\n',
                  1,
              )
              marker = '''def _normalized_name(value: object) -> str:\n    text = str(value).strip().lower()\n    return _NAME_TOKEN.sub(" ", text).strip()\n\n\n'''
              replacement = '''def _normalized_name(value: object) -> str:\n    text = str(value).strip().lower()\n    return _NAME_TOKEN.sub(" ", text).strip()\n\n\ndef _iso_date(value: object, *, field: str) -> str:\n    from datetime import date\n\n    try:\n        return date.fromisoformat(str(value)).isoformat()\n    except ValueError as exc:\n        raise ValueError(f"{field} must be ISO date YYYY-MM-DD") from exc\n\n\n'''
              if marker not in text:
                  raise SystemExit('normalized-name marker not found')
              text = text.replace(marker, replacement)
              old = '''    competition_id = _required_text(competition, "id")\n    competition_name = _required_text(competition, "name")\n\n    provider_status = _required_text(status, "status").lower()\n'''
              new = '''    competition_id = _required_text(competition, "id")\n    competition_name = _required_text(competition, "name")\n    season = _as_dict(context.get("season"), field="sport_event_context.season")\n    season_id = _required_text(season, "id")\n    season_start_date = _iso_date(\n        season.get("start_date"), field="sport_event_context.season.start_date"\n    )\n    season_competition_id = _required_text(season, "competition_id")\n    if season_competition_id != competition_id:\n        raise ValueError("Sportradar season competition_id does not match competition")\n\n    provider_status = _required_text(status, "status").lower()\n'''
              if old not in text:
                  raise SystemExit('competition parser marker not found')
              text = text.replace(old, new)
              old = '''        competition_id=competition_id,\n        competition_name=competition_name,\n        competition_type=competition_type,\n        player_a_sportradar_id=home_id,\n'''
              new = '''        competition_id=competition_id,\n        competition_name=competition_name,\n        competition_type=competition_type,\n        season_id=season_id,\n        season_start_date=season_start_date,\n        player_a_sportradar_id=home_id,\n'''
              if old not in text:
                  raise SystemExit('event constructor marker not found')
              text = text.replace(old, new)
              old = '''        "competition_id": sportradar_event.competition_id,\n        "competition_name": sportradar_event.competition_name,\n        "scheduled_start": sportradar_event.scheduled_start,\n'''
              new = '''        "competition_id": sportradar_event.competition_id,\n        "competition_name": sportradar_event.competition_name,\n        "season_id": sportradar_event.season_id,\n        "season_start_date": sportradar_event.season_start_date,\n        "scheduled_start": sportradar_event.scheduled_start,\n'''
              if old not in text:
                  raise SystemExit('mapping constructor marker not found')
              text = text.replace(old, new)
              old = '''    scheduled = _aware_time(mapping.scheduled_start, field="scheduled_start")\n    if _aware_time(mapping.created_at, field="created_at") >= scheduled:\n'''
              new = '''    _iso_date(mapping.season_start_date, field="season_start_date")\n    if not mapping.season_id.strip():\n        raise ValueError("identity mapping season_id must be non-empty")\n    scheduled = _aware_time(mapping.scheduled_start, field="scheduled_start")\n    if _aware_time(mapping.created_at, field="created_at") >= scheduled:\n'''
              if old not in text:
                  raise SystemExit('mapping verify marker not found')
              text = text.replace(old, new)
              old = '''    if mapping.competition_id != event.competition_id:\n        raise ValueError("identity mapping competition does not match Sportradar event")\n    if mapping.scheduled_start != event.scheduled_start:\n'''
              new = '''    if mapping.competition_id != event.competition_id:\n        raise ValueError("identity mapping competition does not match Sportradar event")\n    if mapping.season_id != event.season_id:\n        raise ValueError("identity mapping season does not match Sportradar event")\n    if mapping.season_start_date != event.season_start_date:\n        raise ValueError("identity mapping season start does not match Sportradar event")\n    if mapping.scheduled_start != event.scheduled_start:\n'''
              if old not in text:
                  raise SystemExit('mapping validation marker not found')
              text = text.replace(old, new)
              path.write_text(text)

          # Insert synthetic season fixtures. We deliberately target only the
          # sport_event_context competition-closing shape in these test files.
          no_gender = '''                    "type": competition_type,\n                },\n            },\n'''
          no_gender_new = '''                    "type": competition_type,\n                },\n                "season": {\n                    "id": "sr:season:2026-test",\n                    "name": "ATP Miami 2026",\n                    "start_date": "2026-09-07",\n                    "end_date": "2026-09-20",\n                    "year": "2026",\n                    "competition_id": "sr:competition:55",\n                },\n            },\n'''
          fixed_singles = '''                    "type": "singles",\n                },\n            },\n'''
          fixed_singles_new = '''                    "type": "singles",\n                },\n                "season": {\n                    "id": "sr:season:2026-test",\n                    "name": "ATP Miami 2026",\n                    "start_date": "2026-09-07",\n                    "end_date": "2026-09-20",\n                    "year": "2026",\n                    "competition_id": "sr:competition:55",\n                },\n            },\n'''
          with_gender = '''                    "type": "singles",\n                    "gender": "men",\n                },\n            },\n'''
          with_gender_new = '''                    "type": "singles",\n                    "gender": "men",\n                },\n                "season": {\n                    "id": "sr:season:2026-test",\n                    "name": "ATP Miami Open 2026",\n                    "start_date": "2026-09-07",\n                    "end_date": "2026-09-20",\n                    "year": "2026",\n                    "competition_id": "sr:competition:55",\n                },\n            },\n'''
          fixture_specs = {
              'tests/test_pattern_confirm_live_identity.py': (no_gender, no_gender_new),
              'tests/test_pattern_confirm_live.py': (fixed_singles, fixed_singles_new),
              'tests/test_pattern_confirm_provider_dryrun.py': (with_gender, with_gender_new),
          }
          for filename, (old, new) in fixture_specs.items():
              test_path = Path(filename)
              content = test_path.read_text()
              if '"season": {' not in content:
                  if old not in content:
                      raise SystemExit(f'season fixture insertion marker not found in {filename}')
                  content = content.replace(old, new)
                  test_path.write_text(content)
          PY
      - name: Format lint and test
        run: |
          pip install -e .[dev]
          ruff format \
            src/tennis_genome/experiments/pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live.py \
            tests/test_pattern_confirm_provider_dryrun.py
          ruff check --fix \
            src/tennis_genome/experiments/pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live.py \
            tests/test_pattern_confirm_provider_dryrun.py
          ruff check .
          pytest
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Aidan Miller"
          git config user.email "aidandcmiller@live.com"
          git add \
            src/tennis_genome/experiments/pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live_identity.py \
            tests/test_pattern_confirm_live.py \
            tests/test_pattern_confirm_provider_dryrun.py
          git commit -m "Bind live identity to Sportradar season source date"
          git push origin HEAD:dev/pattern-confirm-provider-dryrun
